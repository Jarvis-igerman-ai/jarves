name: jarves-package
# Continuous release (docs/RELEASING.md). After EVERY green `main` (all jarves-checks jobs passed, including the
# installer build + silent install smoke) this workflow takes the exact installer that run tested - nothing is rebuilt -
# and
#   1. builds a signed CANDIDATE (installer + signed manifest) and keeps it as a workflow artifact for 30 days.
#      Nothing is published.
#   2. BETA channel: publishes JARVES X.Y.Z-beta.N to the releases repo with latest-beta.json, ONLY when the repository
#      variable ENABLE_BETA_PUBLISH is "true" (default: unset = disabled).
# STABLE is never published here: it is tag-driven (.github/workflows/release.yml) and gated by tools/release_gate.py.
on:
  workflow_run:
    workflows: [jarves-checks]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: jarves-package
  cancel-in-progress: false
jobs:
  candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read       # check out the tested commit
      actions: read        # read the tested artifact
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download the installer that jarves-checks built and smoke-tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: jarves-windows-installer-main
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify provenance (tested commit, channel main, SHA256)
        run: python3 packaging/release.py verify --dir dist --commit "$SHA"
      - name: Signed candidate (installer + manifest; published nowhere)
        env:
          JARVES_UPDATE_SIGNING_KEY: ${{ secrets.JARVES_UPDATE_SIGNING_KEY }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: python3 packaging/release.py candidate --dir dist --commit "$SHA" --out candidate
      - uses: actions/upload-artifact@v7
        with:
          name: jarves-release-candidate-${{ github.event.workflow_run.head_sha }}
          path: candidate
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: What the beta step would do (dry run; no network, no secrets)
        run: python3 packaging/release.py beta-publish --dir dist --dry-run
      - name: Keep the verified installer for the beta job
        uses: actions/upload-artifact@v7
        with:
          name: beta-input
          path: dist
          retention-days: 1
          compression-level: 0
  beta:
    # DISABLED by default: runs only when the repository variable ENABLE_BETA_PUBLISH is "true".
    needs: candidate
    if: ${{ vars.ENABLE_BETA_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ENABLE_BETA_PUBLISH: ${{ vars.ENABLE_BETA_PUBLISH }}
      RELEASES_REPO: ${{ vars.RELEASES_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: beta-input
          path: dist
      - name: Publish the beta (pre-release beta-v<build> + signed latest-beta.json; stable is never touched)
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          JARVES_UPDATE_SIGNING_KEY: ${{ secrets.JARVES_UPDATE_SIGNING_KEY }}
        run: python3 packaging/release.py beta-publish --dir dist

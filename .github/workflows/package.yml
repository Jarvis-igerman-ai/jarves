name: jarves-package
# SW-V2 M6 (D09): publish the Windows installer as a GitHub Release after a PR is merged to main and ALL
# jarves-checks jobs passed (including the `installer` build + silent install smoke). The published files are the
# exact artifact that run tested - nothing is rebuilt here. PR builds never get here (event must be a push to main).
# Retention: newest 3 `win-v*` releases + newest 3 `jarves-windows-installer-main` artifacts; "[pinned]" releases,
# drafts and anything else are never touched (packaging/release.py). Unsigned: no code-signing certificate exists.
on:
  workflow_run:
    workflows: [jarves-checks]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: jarves-package
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the release + tag, delete old ones
      actions: write       # read the tested artifact, delete old ones
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download the installer that jarves-checks built and smoke-tested
        uses: actions/download-artifact@v8
        with:
          name: jarves-windows-installer-main
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify provenance (tested commit, channel main, SHA256)
        id: verify
        run: python3 packaging/release.py verify --dir dist --commit "$SHA"
      - name: Create release win-v<version>
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if gh release view "win-v$VERSION" > /dev/null 2>&1; then
            echo "release win-v$VERSION already exists (re-run): nothing to publish"; exit 0
          fi
          python3 packaging/release.py notes --dir dist --run-url "$RUN_URL" > notes.md
          gh release create "win-v$VERSION" --target "$SHA" --title "JARVES $VERSION (Windows)" \
            --notes-file notes.md --latest dist/JARVES-Setup-*.exe dist/JARVES-Setup-*.exe.sha256 dist/build-info.json
      - name: Retention - keep the newest 3 (pinned exempt)
        run: python3 packaging/release.py prune --keep 3

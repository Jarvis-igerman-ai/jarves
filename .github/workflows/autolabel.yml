name: jarves-autolabel
# Adds the `automerge` label to LOW-RISK PRs (docs/RELEASING.md "Automatic labelling of low-risk PRs"), so the queue
# (automerge.yml) merges them once `CI result (single required check)` is green. It never merges, never bypasses a check.
# Classification: core/tools/risk_class.py (standard library, no network). Dependabot: dependabot-automerge.yml.
# Switch: repository variable ENABLE_AUTOLABEL = "true" or unset (docs, tests, guides/locales), "all" (also PRs labelled
# `bugfix` with < 150 changed lines), "false" (off). Labels `needs-review` / `no-automerge` always block.
# This workflow never checks out or runs the PR's code: the base branch is checked out and only file NAMES are read.
# Use only the scoped GITHUB_TOKEN for label management: the separate AUTOMERGE_TOKEN is for merging and
# may intentionally lack Issues write. An unavailable label must fail visibly, not be masked by `|| true`.
on:
  pull_request_target:
    branches: [main, next]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  merge_group:              # the required check must also report in the merge queue (#161); labels were judged on the PR
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: write
  issues: write           # creating repository labels / attaching labels to PR issue records
concurrency:
  group: autolabel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  label:
    name: Auto-label policy
    if: github.event_name == 'pull_request_target' && vars.ENABLE_AUTOLABEL != 'false' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # The merge queue is triggered by jarves-checks completion even for GITHUB_TOKEN label events.
      # An AUTOMERGE_TOKEN with only Contents/Pull requests cannot create repository labels.
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      MODE: ${{ vars.ENABLE_AUTOLABEL }}
    steps:
      - uses: actions/checkout@v7          # the base branch (pull_request_target), never the PR head
        with:
          sparse-checkout: core/tools/risk_class.py
      - name: Classify the change and label low-risk PRs
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > files.txt
          lines=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.additions + .deletions')
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name]|join(",")')
          # Ensure both labels exist. Suppressing a creation error caused 3 red jobs and missing
          # automerge-auto on PRs #112/#113/#115. Fail clearly if token/repo settings prevent creation.
          for l in automerge automerge-auto; do
            if gh api "repos/$GITHUB_REPOSITORY/labels/$l" >/dev/null 2>/dev/null; then
              continue
            fi
            if ! gh label create "$l" -R "$GITHUB_REPOSITORY" --color 0e8a16; then
              # Concurrent PR jobs may have created the label during our request.
              if ! gh api "repos/$GITHUB_REPOSITORY/labels/$l" >/dev/null; then
                echo "::error::Cannot create label $l. Check Actions permissions (Issues: write) and repository label settings."
                exit 1
              fi
            fi
          done
          if out=$(python3 core/tools/risk_class.py --files-from files.txt --lines "$lines" --labels "$labels" --author "$AUTHOR" --mode "${MODE:-true}"); then
            echo "$out"
            case ",$labels," in
              *,automerge,*) ;;
              *) gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label automerge --add-label automerge-auto ;;
            esac
          else
            echo "$out"
            # a label this workflow added earlier is withdrawn when the PR stops qualifying (new high-risk file, blocking label)
            case ",$labels," in
              *,automerge-auto,*) gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label automerge --remove-label automerge-auto ;;
            esac
          fi
  queue-pass:
    # Same check name as the job above, for merge_group events: each PR's labels were judged on the PR itself and a
    # merge group has no PR labels to read. Runs no repository code, reads nothing.
    name: Auto-label policy
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "merge group, the label policy was checked on each PR"

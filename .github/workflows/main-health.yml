name: jarves-main-health
# Owner request 23 Oct 2026 (#89): when jarves-checks fails on main, open ONE issue "main is red" (or comment on it when
# it is already open) with the run link, so agents fix main first (CLAUDE.md: nothing merges while main is red, and
# automerge.yml stops by itself). When main is green again the issue is closed with the green run's link.
# Reads only the run's metadata: never checks out or runs repository code.
on:
  workflow_run:
    workflows: [jarves-checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  issues: write
concurrency:
  group: jarves-main-health
  cancel-in-progress: false
jobs:
  rerun-once:
    # E3 (#160): 5 of 10 red main runs on 21-24 Oct were flaky tests (the next run was green with no fix). A red FIRST
    # attempt re-runs only its failed jobs, once; the issue below opens only when that re-run is red too. A failure that
    # then passes is a flake: the nightly flake scan opens its showstopper issue (CLAUDE.md). Never a second re-run.
    if: >-
      github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-run the failed jobs of this main run once
        run: gh run rerun "${{ github.event.workflow_run.id }}" -R "${{ github.repository }}" --failed
  alert:
    # opens/updates the issue only when the re-run is red too (attempt 2+); closes it on any green main run
    if: >-
      github.event.workflow_run.event == 'push' &&
      ((github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt > 1) ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # the red run's failed-job logs (failing test names)
      issues: write
      pull-requests: write   # the hand-off comment on each suspect PR
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CONCL: ${{ github.event.workflow_run.conclusion }}
      URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Fix-forward (owner decision 24 Oct 2026, #160): the issue names the failing tests and the suspect PRs (merges
      # since the last green main run), and each suspect PR gets a comment handing the fix to its agent; the fix PR
      # (label main-fix) goes to the front of the merge queue, because every merge group contains the failure. Only the
      # default branch's own core/tools are checked out (trusted code); no PR code runs. No auto-revert.
      - uses: actions/checkout@v7
        if: github.event.workflow_run.conclusion == 'failure'
        with:
          sparse-checkout: core/tools
      - name: Open, update or close the "main is red" issue
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          title="main is red: jarves-checks failed"
          n=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number,title --jq "[.[]|select(.title==\"$title\")][0].number // empty")
          if [ "$CONCL" = "failure" ]; then
            python3 core/tools/red_main.py report --repo "$REPO" --run "$RUN_ID" --out body.md > /dev/null
            if [ -n "$n" ]; then
              gh issue edit "$n" -R "$REPO" --body-file body.md          # markers follow the newest red run
              gh issue comment "$n" -R "$REPO" --body "Still red at ${SHA:0:7}: $URL"
            else
              n=$(gh issue create -R "$REPO" --title "$title" --label P1 --body-file body.md | sed -n 's#.*/issues/\([0-9]*\)$#\1#p')
              for pr in $(sed -n 's/^<!-- red-main-suspects: \(.*\) -->$/\1/p' body.md | tr ',' ' '); do
                gh pr comment "$pr" -R "$REPO" --body "main turned red after this PR was merged (suspect, #$n). Its agent: please fix forward in a new PR labelled \`main-fix\` (it goes to the front of the merge queue). Nothing is reverted automatically." || echo "could not comment on #$pr"
              done
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" -R "$REPO" --comment "main is green again at ${SHA:0:7}: $URL"
          fi

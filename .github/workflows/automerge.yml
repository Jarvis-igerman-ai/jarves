name: jarves-automerge
# Merge queue for a personal repo (GitHub's native merge queue needs an organization). Label a PR `automerge`. This
# workflow then, in PR-number order (owner decision 23 Oct 2026, #89: no update-and-re-run of green PRs):
#   1. merges nothing while main is red (the latest finished jarves-checks run on main failed): fix main first;
#   2. skips drafts and conflicting PRs; a PR that is only BEHIND main is NOT updated and re-tested: its run tested the
#      merge with main as it was, and the run on main after the merge is the integration check (full matrix when the
#      merged tree was not proven on the PR; queued main runs batch on their own);
#   3. merges every PR whose head commit has ALL jarves-checks jobs green (merge commit, branch deleted);
#   4. if any check failed it comments once and removes the label (a human or the merge agent fixes it).
# Per check name only the newest run counts: a duplicate run cancelled by a concurrency group (#125) must not block a green PR.
# It never merges with a pending/failed/missing check, never force-pushes, never bypasses anything.
# Secret AUTOMERGE_TOKEN (fine-grained PAT, this repo: Contents RW, Pull requests RW, Issues RW for the failure comment) makes the merge push trigger
# jarves-checks + the installer publish on main (merges done with GITHUB_TOKEN do not trigger workflows).
on:
  workflow_run:
    workflows: [jarves-checks]
    types: [completed]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write   # only used by the github.token fallback for the failure comment and label removal
  issues: write
concurrency:
  group: jarves-automerge
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge the green PRs
        run: |
          set -uo pipefail   # no -e: one PR error must never stop the loop; every merge decision is checked explicitly
          if [ -z "${{ secrets.AUTOMERGE_TOKEN }}" ]; then
            echo "::warning::AUTOMERGE_TOKEN is not set: merging with GITHUB_TOKEN will NOT start CI/installer publish on main"
          fi
          # main must be green: the newest finished (not cancelled) jarves-checks run on main decides. Runs still queued
          # or running do not block (they batch); this workflow runs again whenever a jarves-checks run completes.
          last=$(gh run list -R "$REPO" --branch main --workflow jarves-checks --status completed --limit 10 --json conclusion --jq '[.[]|select(.conclusion!="cancelled")][0].conclusion // "none"')
          if [ "$last" = "failure" ]; then echo "::warning::main is red (latest jarves-checks run on main failed): no merges until it is fixed"; exit 0; fi
          [ -n "$last" ] || { echo "::warning::could not read the state of main: no merges in this run (fail closed)"; exit 0; }
          # labels needs-review / no-automerge block the merge (autolabel.yml, dependabot-automerge.yml, or a human)
          prs=$(gh pr list -R "$REPO" --state open --base main --label automerge --json number,labels --jq '[.[]|select([.labels[].name]|(index("needs-review") or index("no-automerge"))|not)]|sort_by(.number)|.[].number')
          for n in $prs; do
            info=$(gh pr view "$n" -R "$REPO" --json isDraft,mergeable,headRefOid,mergeStateStatus)
            draft=$(echo "$info" | jq -r .isDraft); mer=$(echo "$info" | jq -r .mergeable)
            sha=$(echo "$info" | jq -r .headRefOid); st=$(echo "$info" | jq -r .mergeStateStatus)
            echo "PR #$n draft=$draft mergeable=$mer state=$st sha=${sha:0:7}"
            [ "$draft" = "true" ] && continue
            [ "$mer" = "CONFLICTING" ] && { echo "  conflicts: skipped"; continue; }
            [ -n "$sha" ] && [ "$sha" != "null" ] || { echo "  could not read the PR: skipped"; continue; }
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=pull_request" --jq '[.workflow_runs[]|select(.name=="jarves-checks")]|sort_by(.created_at)|last')
            run_id=$(echo "$runs" | jq -r '.id // empty')
            status=$(echo "$runs" | jq -r '.status // "none"'); concl=$(echo "$runs" | jq -r '.conclusion // ""')
            echo "  jarves-checks: $status $concl"
            if [ "$status" = "completed" ] && [ "$concl" = "success" ]; then
              # Judge only what protects main (#160): (1) the two REQUIRED checks: the newest non-cancelled run of each
              # name must be a completed success (a cancelled duplicate from a concurrency group does not count, a missing
              # one blocks); (2) no job of THIS jarves-checks run failed, was cancelled or is still running. Other
              # check-runs on the sha are ignored: this workflow's own "queue" check from an older crashed run (and the
              # dependabot "label" check) kept green PRs #136/#139 out of the queue.
              req=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[]|select(.name=="CI result (single required check)" or .name=="Auto-label policy")|select(.conclusion!="cancelled")]|group_by(.name)|map(max_by(.started_at))|(length == 2 and all(.status=="completed" and .conclusion=="success"))')
              jobs=$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[]|select(.status!="completed" or .conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="cancelled")]|length')
              if [ "$req" = "true" ] && [ "$jobs" = "0" ]; then bad=0; else bad=1; echo "  required checks green: ${req:-?}; failed/pending jobs in run $run_id: ${jobs:-?}"; fi
              if [ "$bad" = "0" ]; then
                echo "  all green: merging #$n"
                gh pr merge "$n" -R "$REPO" --merge --delete-branch || echo "  merge refused (for example a conflict with the PR merged just before); the next run retries"
              fi
            elif [ "$status" = "completed" ]; then
              msg="automerge: jarves-checks ended '$concl' on ${sha:0:7}; removing the automerge label. Fix and re-add the label."
              gh pr comment "$n" -R "$REPO" --body "$msg" >/dev/null 2>&1 \
                || GH_TOKEN="${{ github.token }}" gh pr comment "$n" -R "$REPO" --body "$msg" >/dev/null 2>&1 \
                || echo "could not comment (token scope)"
              gh pr edit "$n" -R "$REPO" --remove-label automerge >/dev/null 2>&1 \
                || GH_TOKEN="${{ github.token }}" gh pr edit "$n" -R "$REPO" --remove-label automerge >/dev/null 2>&1 \
                || echo "could not remove label (token scope)"
            else
              echo "  checks still running: merged by a later run"
            fi
          done

name: jarves-automerge
# Low-risk PRs labelled `automerge` (autolabel.yml, dependabot-automerge.yml, or a human) enter GitHub's native merge
# queue: this workflow turns on auto-merge for them (`gh pr merge --auto --merge`). The ruleset "main: merge queue +
# required checks" (#161) then adds the PR to the queue once its own required checks are green; the queue tests it
# merged with the latest main and the PRs ahead of it (event merge_group) and merges only when that run is green too.
# Replaces the custom queue that merged directly (it could not test PRs together, #160). It never merges by itself,
# never bypasses a check, never runs PR code (pull_request_target: base branch, no checkout).
# Labels needs-review / no-automerge / do-not-merge / wip block it; drafts are skipped (marked ready -> runs again).
on:
  pull_request_target:
    types: [labeled, ready_for_review]
  workflow_run:               # labels added with GITHUB_TOKEN (autolabel.yml) start no workflow: sweep after each CI run
    workflows: [jarves-checks]
    types: [completed]
  workflow_dispatch:          # sweep: turn on auto-merge for every labelled PR (after an outage)
permissions:
  contents: read
concurrency:
  group: jarves-automerge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false
jobs:
  enqueue:
    if: >-
      github.event_name != 'pull_request_target' ||
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # AUTOMERGE_TOKEN (fine-grained, org resource owner: Contents RW, Pull requests RW, Issues RW, Actions read)
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      REPO: ${{ github.repository }}
      ONE: ${{ github.event.pull_request.number }}
    steps:
      - name: Turn on auto-merge (merge queue) for labelled, unblocked, ready PRs
        run: |
          set -uo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::AUTOMERGE_TOKEN is not set"; exit 1; }
          if [ -n "$ONE" ]; then prs="$ONE"; else
            prs=$(gh pr list -R "$REPO" --state open --base main --label automerge --json number --jq '.[].number'); fi
          rc=0
          for n in $prs; do
            info=$(gh pr view "$n" -R "$REPO" --json isDraft,labels,autoMergeRequest) || { echo "#$n: unreadable"; rc=1; continue; }
            if echo "$info" | jq -e '[.labels[].name] | (index("needs-review") or index("no-automerge") or index("do-not-merge") or index("wip"))' >/dev/null; then
              echo "#$n: blocked by a label"; continue; fi
            [ "$(echo "$info" | jq -r .isDraft)" = "true" ] && { echo "#$n: draft, skipped"; continue; }
            [ "$(echo "$info" | jq -r '.autoMergeRequest != null')" = "true" ] && { echo "#$n: auto-merge already on"; continue; }
            gh pr merge "$n" -R "$REPO" --auto --merge && echo "#$n: auto-merge on (enters the merge queue when green)" || { echo "#$n: could not turn on auto-merge"; rc=1; }
          done
          exit $rc

name: jarves-checks
# CI for Issue #2. No secrets used; no paid API calls (all AI/voice tests are offline fakes).
#
# Fast-release design (docs/CI_PERFORMANCE.md):
#  * the full tests AND the installer build + silent-install smoke run in PARALLEL on the PR head, before the merge;
#  * every installer build uploads `jarves-installer-<git tree hash>`; the merge commit on `main` has the same tree when
#    the PR was tested on top of the current main, so the `main` push re-runs NOTHING (job `changes` finds the proof,
#    `reused=true`) and jarves-package publishes the PR's installer;
#  * a different tree (a direct push, a stale merge) falls back to the full matrix, including the installer build;
#  * only `pull_request` and `push` to main trigger this workflow (a branch push has no push trigger: no duplicate run
#    for the same commit); superseded runs of the same PR/ref are cancelled; docs/guides-only changes skip heavy jobs.
# Python tests are sharded by MEASURED file durations (core/tools/ci_plan.py), slowest files first, with pytest-xdist
# inside a shard (file-isolated) and ONE automatic retry of only the failed files for known socket/load flakes
# (core/tools/ci_flake.py, flake-report artifact). Zero skips stay enforced. Nightly: nightly.yml.
on:
  push:
    branches: [main, next]   # `next` = the batch run of the integration-branch flow (docs/NEXT_FLOW.md)
    tags: ["v*", "win-v*"]
  pull_request:
    branches-ignore: [next]   # PRs into `next` get the light run of next-flow.yml
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # main runs queue, never cancelled by a newer push
jobs:
  changes:
    name: Classify the change (docs-only skips heavy jobs; reuse of the PR proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read        # find the PR run's installer artifact for the merge commit
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      code: ${{ steps.c.outputs.code }}
      full: ${{ steps.c.outputs.full }}
      perf: ${{ steps.c.outputs.perf }}
      installer: ${{ steps.c.outputs.installer }}
      cad: ${{ steps.c.outputs.cad }}
      blender: ${{ steps.c.outputs.blender }}
      godot: ${{ steps.c.outputs.godot }}
      whatsapp: ${{ steps.c.outputs.whatsapp }}
      e2e: ${{ steps.c.outputs.e2e }}
      plan: ${{ steps.c.outputs.plan }}
      tree: ${{ steps.c.outputs.tree }}
      reused: ${{ steps.c.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Restore measured Linux durations (otherwise use committed seed)
        uses: actions/cache/restore@v6
        with:
          path: core/tests/durations-linux.json
          key: jarves-durations-v2-linux-none
          restore-keys: jarves-durations-v2-linux-
      - name: Restore measured Windows durations (otherwise use committed seed)
        uses: actions/cache/restore@v6
        with:
          path: core/tests/durations-windows.json
          key: jarves-durations-v2-windows-none
          restore-keys: jarves-durations-v2-windows-
      - id: c
        shell: bash
        run: |
          set -euo pipefail
          tree=$(python3 core/tools/ci_reuse.py tree)
          reused=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # same tree as a green PR run => nothing to test or build (docs/CI_PERFORMANCE.md "reuse")
            if python3 core/tools/ci_reuse.py resolve --repo "$GITHUB_REPOSITORY" --tree "$tree" > reuse.out; then reused=true; fi
            cat reuse.out || true
          fi
          args=(--event "$GITHUB_EVENT_NAME")
          [ "$reused" = "true" ] && args+=(--reused)
          python3 core/tools/ci_plan.py classify "${args[@]}" | tee classify.out
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$reused" != "true" ]; then echo "full matrix ($GITHUB_EVENT_NAME $GITHUB_REF)"; fi
          { cat classify.out; echo "tree=$tree"; echo "reused=$reused"; } >> "$GITHUB_OUTPUT"
          { echo "tree \`${tree:0:12}\` reused=$reused"; grep -E '^[a-z0-9]+=(true|false)$' classify.out | tr '\n' ' '; } >> "$GITHUB_STEP_SUMMARY"
  validate:
    # Quick stage: every heavy job `needs` it, so a cheap budget/guide/docs failure ends a PR run in about two minutes
    # and no heavy job starts (on main/next the same gate runs; those runs are never cancelled, see `concurrency`).
    name: Fast CI and documentation validation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - name: Quick gate = the local `python core/tools/prepush.py` (log lint, guides + CLI parity, Hebrew/locales, docs links, prompt-size budget, workflow contracts, network guard, dashboard endpoint timing vs the ci budget)
        run: uv run python tools/prepush.py 2>&1 | tee prepush.out
        shell: bash
      - name: Quick gate table in the job summary
        if: always()
        shell: bash
        run: |
          { echo '```'; sed -n '/^check /,$p' prepush.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Quick gate output (for the failure-summary comment)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: junit-prepush
          path: core/prepush.out
          retention-days: 7
          if-no-files-found: ignore
  core:
    # Both platforms use 3 separate runners planned from measured durations (core/tools/ci_plan.py).
    # Linux stays serial inside each runner to isolate process limits, ports and update-flow fakes.
    # The real-browser files are their own job (`browser`, one retry). A guides-only change
    # runs the Linux shards only (the Windows shards finish in seconds). Matrix job names are required-check names.
    name: Python Core tests (${{ matrix.os }} shard ${{ matrix.shard }})
    needs: [changes, validate]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, shard: "1/3"}
          - {os: ubuntu-24.04, platform: linux, shard: "2/3"}
          - {os: ubuntu-24.04, platform: linux, shard: "3/3"}
          - {os: windows-2025, platform: windows, shard: "1/3"}
          - {os: windows-2025, platform: windows, shard: "2/3"}
          - {os: windows-2025, platform: windows, shard: "3/3"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: core
    env:
      PLAN: ${{ needs.changes.outputs.plan }}
      # pytest-xdist workers inside the shard (file-isolated: --dist loadfile). Repository variable CI_XDIST_WORKERS
      # overrides; 1 = serial. Default: 2 on Windows; Linux is serial (3 workers made the per-user process limit of the isolation tests and the update-flow fakes fail on ubuntu-24.04: 20 failures).
      XDIST_WORKERS: ${{ vars.CI_XDIST_WORKERS || (matrix.os == 'ubuntu-24.04' && '1' || '2') }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ] || [ "${{ needs.changes.outputs.full }}" = "true" ]; then run=true; else run=false; echo "guides/docs-level change: the Windows shard is not needed"; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no major tags since v8)
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      # Owner rule: NO skipped tests. Every extra is installed (camera/OpenCV, voice, tray, browser/Playwright once it
      # exists) and the real tools are fetched/located by tests/_tools.py (Godot 4.7.2 everywhere, Inno Setup on
      # Windows, openssl from PATH/Git). Platform-only tests are deselected per OS (markers), never skipped.
      - name: "System libraries (Linux, PortAudio for sounddevice)"
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
      - name: Install (locked, all extras)
        if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen --all-extras
      - name: Cache tool downloads (Godot, Inno Setup; SHA-pinned in tests/_tools.py)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/jarves-test-tools
          key: jarves-test-tools-${{ runner.os }}-${{ hashFiles('core/tests/_tools.py') }}
      - name: pytest (offline; planned shard, slowest first, xdist; known-flake retry of failed files only; ANY skip fails)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          JARVES_BUILD_CACHE: ${{ runner.temp }}/jarves-test-tools
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          os=$(echo "$RUNNER_OS" | tr 'A-Z' 'a-z')
          FILES=$(uv run python tools/ci_plan.py shard-files --plan "$RUNNER_TEMP/plan.json" --os "$os" --shard ${{ matrix.shard }})
          echo "shard ${{ matrix.shard }}: $FILES"
          XD=(); PX=()
          if [ "$XDIST_WORKERS" -gt 1 ]; then XD=(--with pytest-xdist==3.8.0); PX=(-n "$XDIST_WORKERS" --dist loadfile); fi
          set +e
          uv run "${XD[@]}" pytest -q -rs -p no:cacheprovider --browser exclude --shard-files "$FILES" "${PX[@]}" --durations=25 --junitxml=pytest-junit.xml 2>&1 | tee pytest.out
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] && RETRY=$(uv run python tools/ci_flake.py failed-files --junit pytest-junit.xml); then
            echo "::warning::known transient (socket/load) failures; retrying ONLY these files once: $RETRY"
            cp pytest-junit.xml first-junit.xml
            uv run pytest -q -rs -p no:cacheprovider --junitxml=retry-junit.xml $RETRY 2>&1 | tee -a pytest.out
            rc=${PIPESTATUS[0]}
            uv run python tools/ci_flake.py report --first first-junit.xml --second retry-junit.xml --out flake-report.json
            [ "$rc" -eq 0 ] && cp first-junit.xml pytest-junit.xml
          fi
          if grep -E "(^SKIPPED|[0-9]+ skipped|xfailed)" pytest.out; then echo "::error::tests were skipped"; exit 1; fi
          exit $rc
      - name: Timing data and flake report (feeds the next shard plan)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            core/pytest-junit.xml
            core/flake-report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Quarantined tests (non-blocking; still run, never skipped; docs/CI_DETERMINISM.md)
        if: steps.gate.outputs.run == 'true' && matrix.shard == 1
        continue-on-error: true
        shell: bash
        run: |
          uv run pytest -q -p no:cacheprovider --browser exclude -m quarantine || [ $? -eq 5 ]   # 5 = none quarantined
      - name: Redacted diagnostics on failure (pytest output, junit, Core logs; no secrets, no user content)
        if: failure()
        shell: bash
        run: |
          uv run python tools/ci_diagnostics.py diag pytest.out pytest-junit.xml || true
          uv run python -m jarves diag --ci --out diag/health || true   # package O: redaction-scanned bundle
      - name: Upload redacted diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-core-${{ matrix.os }}-${{ strategy.job-index }}
          path: core/diag
          retention-days: 7
          if-no-files-found: ignore
      - name: jarvis.cmd launcher smoke (Windows, shard 1 only)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Windows' && matrix.shard == '1/3'
        shell: cmd
        run: |
          call ..\jarvis.cmd setup --help || exit /b 1
          call ..\jarvis.cmd status > status.txt
          type status.txt
          findstr /C:"Core is NOT running" status.txt || exit /b 1
  durations:
    # Refresh each OS after a green full Core matrix, including same-repository PRs.
    # Actions PR caches are merge-ref scoped: they accelerate subsequent runs of that PR, not other branches.
    name: Update shard timing data (${{ matrix.platform }})
    needs: [changes, core]
    if: ${{ always() && needs.core.result == 'success' && needs.changes.outputs.full == 'true' && needs.changes.outputs.reused != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        platform: [linux, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: core/tests/durations-${{ matrix.platform }}.json
          key: jarves-durations-v2-${{ matrix.platform }}-none
          restore-keys: jarves-durations-v2-${{ matrix.platform }}-
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-${{ matrix.platform }}-*
          path: junit
      - run: python3 core/tools/ci_plan.py durations-merge --junit junit --into core/tests/durations-${{ matrix.platform }}.json
      - uses: actions/cache/save@v6
        with:
          path: core/tests/durations-${{ matrix.platform }}.json
          key: jarves-durations-v2-${{ matrix.platform }}-${{ github.run_id }}
  browser:
    # Real-browser tests (Playwright: Chromium on Linux, the preinstalled Edge on Windows) as their own job so the
    # shards stay fast. One retry of the browser files only; a second failure fails the job. Never skipped.
    name: Real-browser tests (${{ matrix.os }})
    needs: [changes, validate]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: "System libraries (Linux, PortAudio for sounddevice)"
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
      - name: Install (locked, all extras)
        run: uv sync --frozen --all-extras
      - name: Cache Playwright browsers (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('core/uv.lock') }}
      - name: Browser (Chromium on Linux, preinstalled Edge on Windows)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then uv run playwright install --with-deps chromium; else echo "using the preinstalled Edge"; fi
      - name: pytest real-browser files (one retry; ANY skip fails the run)
        shell: bash
        run: |
          run() { uv run pytest -q -rs -p no:cacheprovider --browser only --junitxml=pytest-junit.xml 2>&1 | tee pytest.out; return "${PIPESTATUS[0]}"; }
          run || { echo "::warning::real-browser tests failed once; retrying the browser files one time"; run; }
          rc=$?
          if grep -E "(^SKIPPED|[0-9]+ skipped|xfailed)" pytest.out; then echo "::error::tests were skipped"; exit 1; fi
          exit $rc
      - name: Redacted diagnostics on failure
        if: failure()
        shell: bash
        run: uv run python tools/ci_diagnostics.py diag pytest.out pytest-junit.xml || true
      - name: Upload redacted diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-browser-${{ matrix.os }}
          path: core/diag
          retention-days: 7
          if-no-files-found: ignore
  installer:
    # SW-V2 M6: build the real Windows installer and smoke-test it (silent per-user install into a temp dir,
    # --version/status/features/doctor, offline Core start/stop, exported face self-checks, upgrade, uninstall keeps
    # data, /PURGE=1). It runs IN PARALLEL with the Python tests (it needs only the checkout, the tool cache and `changes`),
    # so the release critical path is max(tests, installer), not their sum. The artifact is content-addressed
    # (`jarves-installer-<git tree>`); jarves-package publishes exactly that artifact once the WHOLE run is green (tests
    # included), for the PR's merge commit as well (no second build when the tree matches). PR artifacts live 7 days.
    name: Windows installer (build + silent install smoke)
    needs: [changes, validate]
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CHANNEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || 'pr' }}
      TREE: ${{ needs.changes.outputs.tree }}
      # WP-O: optional custom update folder baked in as the default (docs/RELEASE_HOSTING.md); unset = the public
      # releases repo (once a signing key is built in), else the private repo's releases
      JARVES_UPDATE_BASE_URL: ${{ vars.JARVES_UPDATE_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Cache pinned build tools (Python, Godot editor + Windows template, Inno Setup; SHA256-pinned)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/jarves-build-cache
          key: jarves-build-tools-${{ hashFiles('packaging/build_windows.ps1') }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: bridge/whatsapp/go.sum
      - name: Build the pinned WhatsApp bridge (same reproducible build as the whatsapp-bridge job)
        shell: pwsh
        run: |
          $pin = Get-Content packaging/bridge_pin.json -Raw | ConvertFrom-Json
          ./scripts/build_whatsapp_bridge.ps1 -Version $pin.version
          "JARVES_BRIDGE_EXE=$((Resolve-Path bridge/whatsapp/dist/whatsapp_bridge.exe).Path)" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: |
          # X.Y.Z.<run_number>: the version stamp is the run number of THIS build. A reused build keeps it (no rebuild,
          # no re-stamp): a PR is merged only after a run on top of the current main, so merged builds only grow.
          $base = (Select-String -Path core/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $v = "$base.${{ github.run_number }}"
          ./packaging/build_windows.ps1 -Version $v -Channel $env:CHANNEL -Commit $env:GITHUB_SHA -Tree $env:TREE `
            -Cache "$env:RUNNER_TEMP/jarves-build-cache" -Out dist
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Silent install / run / upgrade / uninstall smoke
        shell: pwsh
        run: ./packaging/smoke_windows.ps1 -Installer "dist/JARVES-Setup-$env:VERSION.exe" -Version $env:VERSION -RequireFace -CheckAutostart -DefaultTasks -MetricsOut dist/installer-metrics.json
      - name: Installer size / time budget (SW-V4 L; same numbers feed core/tools/perf_gate.py --installer-json)
        shell: pwsh
        run: python packaging/installer_metrics.py check --metrics dist/installer-metrics.json --class ci
      - name: Upgrade + rollback matrix (old installers pinned in packaging/upgrade_fixtures.json)
        shell: pwsh
        run: ./packaging/upgrade_matrix.ps1 -Candidate "dist/JARVES-Setup-$env:VERSION.exe" -Version $env:VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: jarves-installer-${{ env.TREE }}
          path: |
            dist/JARVES-Setup-*.exe
            dist/JARVES-Setup-*.exe.sha256
            dist/build-info.json
          retention-days: ${{ env.CHANNEL == 'main' && 30 || 7 }}
          compression-level: 0
          if-no-files-found: error
  whatsapp-bridge:
    # SW-V4 F: the Go WhatsApp bridge (bridge/whatsapp). Offline only: go mod verify, vet, unit + API tests against the
    # fake engine (no WhatsApp account is ever contacted), then a reproducible Windows build checked by rebuilding.
    name: WhatsApp bridge (Go vet/test + reproducible build)
    needs: [changes, validate]
    if: needs.changes.outputs.whatsapp == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: bridge/whatsapp/go.sum
      - name: Build (pinned go1.27.0 check, go mod verify, go vet, go test, reproducible build)
        shell: pwsh
        run: ./scripts/build_whatsapp_bridge.ps1 -Version "0.1.0"
      - name: Rebuild and compare SHA-256 (reproducibility)
        shell: pwsh
        run: ./scripts/build_whatsapp_bridge.ps1 -Version "0.1.0" -Verify bridge/whatsapp/dist/whatsapp_bridge.exe.sha256
      - name: Compare with packaging/bridge_pin.json
        shell: pwsh
        run: |
          $pin = Get-Content packaging/bridge_pin.json -Raw | ConvertFrom-Json
          $got = (Get-FileHash bridge/whatsapp/dist/whatsapp_bridge.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $pin.sha256) { throw "bridge SHA256 $got differs from packaging/bridge_pin.json ($($pin.sha256)); rebuild with -Version $($pin.version) and update the pin" }
      - uses: actions/upload-artifact@v7
        with:
          name: whatsapp-bridge-windows
          path: bridge/whatsapp/dist/
          retention-days: 7
          if-no-files-found: error
  perf:
    # SW-V4 M: performance gate (core/perf_budgets.toml, class ci = loose). Fails when a budget is exceeded.
    name: Performance gate (Windows)
    needs: [changes, validate]
    if: needs.changes.outputs.perf == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: perf_gate (real background Core, 2 runs, idle 60 s, plus in-process and dashboard timings)
        shell: bash
        run: uv run python tools/perf_gate.py --class ci --results perf-results.json
      - name: speed gate (jarvis speedtest, class ci, same budgets and code as the app, no history written)
        shell: bash
        run: uv run python -m jarves.cli speedtest --class ci --gate --no-store --no-net --idle-window 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: core/perf-results.json
          retention-days: 14
          if-no-files-found: ignore
  cad:
    needs: [changes, validate]
    if: needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Cache FreeCAD AppImage
        id: fc
        uses: actions/cache@v6
        with:
          path: FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          key: freecad-1.1.4-appimage
      - name: Install FreeCAD 1.1.4 (same version as local; apt only ships 0.21)
        run: |
          [ -f FreeCAD_1.1.4-Linux-x86_64-py311.AppImage ] || curl -sSLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          curl -sSL https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage-SHA256.txt | sha256sum -c -
          chmod +x FreeCAD_*.AppImage && ./FreeCAD_*.AppImage --appimage-extract > /dev/null
          echo "FC=$PWD/squashfs-root/usr/bin/freecadcmd" >> "$GITHUB_ENV"
      - name: CAD smoke test (blockout + Pebble build, check_pebble, HeadRX regression)
        run: QT_QPA_PLATFORM=offscreen "$FC" cad/smoke_test.py
      - name: Mesh export + mechanical estimates
        run: |
          QT_QPA_PLATFORM=offscreen "$FC" cad/build_pebble.py
          QT_QPA_PLATFORM=offscreen "$FC" cad/export_meshes.py
          QT_QPA_PLATFORM=offscreen "$FC" cad/mech_estimates.py | tee mech.txt
          grep -q "MECH DONE" mech.txt
  blender:
    needs: [changes, validate]
    if: needs.changes.outputs.blender == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cache Blender 5.2.2
        uses: actions/cache@v6
        with:
          path: blender-5.2.2-linux-x64
          key: blender-5.2.2-linux-x64
      - name: Install Blender 5.2.2
        run: |
          [ -x blender-5.2.2-linux-x64/blender ] || curl -sSL https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz | tar xJ
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxi6 libxkbcommon0 libxrender1 libsm6 libgl1 libegl1
      - name: Blender smoke (committed .glb vs CAD manifest, materials, Godot asset sync, renders present)
        run: ./blender-5.2.2-linux-x64/blender -b --python blender/smoke_blender.py
  godot:
    needs: [changes, validate]
    if: needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Cache the Godot 4.7.2 download
        uses: actions/cache@v6
        with:
          path: Godot_v4.7.2-stable_linux.x86_64.zip
          key: godot-4.7.2-linux-zip
      - name: Install Godot 4.7.2
        run: |
          [ -f Godot_v4.7.2-stable_linux.x86_64.zip ] || curl -sSLO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_*.zip && echo "GODOT=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import assets
        run: '"$GODOT" --headless --path godot --import'
      - name: Viewer check (parts, picking, exploded view, LED/blank swap, live face)
        run: |
          "$GODOT" --headless --path godot --quit-after 3000 -- --check --no-core | tee viewer.txt
          grep -q "CHECK RESULT: PASS" viewer.txt
      - name: Face display self-test
        run: |
          "$GODOT" --headless --path godot --quit-after 3000 res://face/face_app.tscn -- --check | tee face.txt
          grep -q "FACE CHECK RESULT: PASS" face.txt
  e2e:
    name: Core-Godot E2E (real processes)
    needs: [changes, validate]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Cache the Godot 4.7.2 download
        uses: actions/cache@v6
        with:
          path: Godot_v4.7.2-stable_linux.x86_64.zip
          key: godot-4.7.2-linux-zip
      - name: Install Core + Godot 4.7.2
        run: |
          (cd core && uv sync --frozen)
          [ -f Godot_v4.7.2-stable_linux.x86_64.zip ] || curl -sSLO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_*.zip && echo "GODOT=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "JARVES_HOME=$RUNNER_TEMP/jarves" >> "$GITHUB_ENV"
      - name: Import assets
        run: '"$GODOT" --headless --path godot --import'
      - name: Face protocol test (real face, headless; every message incl. malformed must not break it)
        run: (cd core && GODOT_EXE="$GODOT" uv run pytest -q tests/test_face_protocol_godot.py)
      - name: Start the Core (offline, no keys, no audio, no music)
        run: |
          mkdir -p "$JARVES_HOME"
          printf '[voice]\nmode = "off"\n\n[music]\nprovider = "none"\n' > "$JARVES_HOME/config.toml"
          (cd core && nohup uv run jarves run > "$RUNNER_TEMP/core.out" 2>&1 &)
          for i in $(seq 60); do grep -q CORE_READY "$JARVES_HOME/logs/jarves.log" 2>/dev/null && break; sleep 0.5; done
          grep -q CORE_READY "$JARVES_HOME/logs/jarves.log" || { cat "$RUNNER_TEMP/core.out"; exit 1; }
      - name: Loading screen waits for read-only startup readiness
        run: |
          timeout 30 "$GODOT" --headless --path godot res://loading.tscn -- --loading-check | tee loading.txt
          grep -q "LOADING CHECK RESULT: PASS" loading.txt
      - name: E2E pass - face asks "what time is it", gets a reply and face states
        run: |
          timeout 90 "$GODOT" --headless --path godot res://face/face_app.tscn -- --e2e | tee e2e.txt
          grep -q "E2E RESULT: PASS" e2e.txt
      - name: E2E negative - wrong token is rejected (4401), face never connects
        run: |
          mkdir -p "$RUNNER_TEMP/bad" && echo wrong-token > "$RUNNER_TEMP/bad/link_token"
          JARVES_HOME="$RUNNER_TEMP/bad" timeout 90 "$GODOT" --headless --path godot res://face/face_app.tscn -- --e2e | tee bad.txt || true
          grep -q "E2E RESULT: FAIL" bad.txt && grep -q "rejected the token" bad.txt
          (cd core && uv run jarves status || true) | grep -Eq '"core": "(ready|degraded)"'   # Core survived the bad client (offline = degraded)
      - name: Window close keeps the Core running by default (background_core ON); `jarves stop` ends it
        run: |
          timeout 30 "$GODOT" --headless --path godot res://face/face_app.tscn -- --e2e-close
          sleep 3
          ! grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log"               # the face closed, the Core did not stop
          (cd core && uv run jarves status) | grep -Eq '"core": "(ready|degraded)"'
          (cd core && uv run jarves stop)
          for i in $(seq 30); do grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log" && break; sleep 0.5; done
          grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log"
          ! (cd core && uv run jarves status)
      - name: Window close stops the Core through the authenticated link (background_core OFF)
        run: |
          rm -f "$JARVES_HOME/logs/jarves.log"
          (cd core && nohup uv run jarves run > "$RUNNER_TEMP/core2.out" 2>&1 &)
          for i in $(seq 60); do grep -q CORE_READY "$JARVES_HOME/logs/jarves.log" 2>/dev/null && break; sleep 0.5; done
          grep -q CORE_READY "$JARVES_HOME/logs/jarves.log" || { cat "$RUNNER_TEMP/core2.out"; exit 1; }
          (cd core && uv run jarves features off background_core)
          sleep 2                                                             # the running Core re-reads the switch file
          timeout 30 "$GODOT" --headless --path godot res://face/face_app.tscn -- --e2e-close
          for i in $(seq 30); do grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log" && break; sleep 0.5; done
          grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log"
          ! (cd core && uv run jarves status)                                 # now reports NOT running
      - name: Redacted diagnostics on failure (Core output and log, nothing unredacted is printed or kept)
        if: failure()
        run: |
          (cd core && uv run python tools/ci_diagnostics.py "$GITHUB_WORKSPACE/diag" "$RUNNER_TEMP/core.out" "$RUNNER_TEMP/core2.out" "$JARVES_HOME/logs" "$RUNNER_TEMP/bad" || true)
          tail -50 "$GITHUB_WORKSPACE"/diag/*jarves.log || true
          (cd core && uv run python -m jarves diag --ci --out "$GITHUB_WORKSPACE/diag/health" || true)   # package O
      - name: Upload redacted diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-e2e
          path: diag
          retention-days: 7
          if-no-files-found: ignore
  ci-ok:
    # ONE stable required check for branch protection: green when every job above passed or was legitimately skipped
    # (docs-only, reused proof). Failed or cancelled needs make it red. Per-shard names stay valid required checks too.
    name: CI result (single required check)
    if: always()
    needs: [changes, validate, core, browser, installer, whatsapp-bridge, perf, cad, blender, godot, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - shell: bash
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | select(.result == "failure" or .result == "cancelled")] | length == 0' > /dev/null
  failure-summary:
    # ONE comment per PR (updated in place): failed jobs, first failing test + its first error line, log links, known
    # flakes marked from the flake-report artifact. No secrets, no log content beyond one redacted line (core/tools/ci_comment.py).
    name: Failure summary comment (PR only)
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, validate, core, browser, installer, whatsapp-bridge, perf, cad, blender, godot, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: junit-*
          path: artifacts
      - name: Build and post the comment
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > jobs.json
          python3 core/tools/ci_comment.py build --jobs jobs.json --artifacts artifacts             --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out comment.md
          python3 core/tools/ci_comment.py post --repo "$GITHUB_REPOSITORY" --pr ${{ github.event.pull_request.number }} --body comment.md

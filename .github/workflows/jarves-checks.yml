name: jarves-checks
# CI for Issue #2. No secrets used; no paid API calls (all AI/voice tests are offline fakes).
#
# SW-V4 M: a `changes` job classifies the diff so a docs-only PR skips every heavy job (skipped jobs count as green for
# the merge queue). `main` pushes, release tags and manual runs ALWAYS run the full matrix. Every job has a timeout;
# superseded runs of the same ref are cancelled; tool downloads (uv, Godot, Inno Setup, Blender, FreeCAD) are cached.
# The core suite stays serial on purpose (no pytest-xdist): see docs/reviews/SWV4_M_PERF_CI.md. Nightly: nightly.yml.
on:
  push:
    branches: [main]
    tags: ["v*", "win-v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Classify the change (docs-only skips heavy jobs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
      perf: ${{ steps.c.outputs.perf }}
      installer: ${{ steps.c.outputs.installer }}
      cad: ${{ steps.c.outputs.cad }}
      blender: ${{ steps.c.outputs.blender }}
      godot: ${{ steps.c.outputs.godot }}
      whatsapp: ${{ steps.c.outputs.whatsapp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: c
        shell: bash
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            for k in code perf installer cad blender godot whatsapp; do out $k true; done
            echo "full matrix ($GITHUB_EVENT_NAME $GITHUB_REF)"; exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)   # the PR merge commit against its base
          echo "$files"
          any() { grep -Eq "$1" <<< "$files" && echo true || echo false; }
          out code      "$(grep -Evq '^(docs/|[^/]+\.md$|LICENSE|\.gitignore)' <<< "$files" && echo true || echo false)"
          out perf      "$(any '^(core/(src/|tools/(bench_startup|perf_gate)|perf_budgets|pyproject|uv\.lock)|\.github/)')"
          out installer "$(any '^(packaging/|core/(src/|pyproject|uv\.lock)|godot/|\.github/|jarvis\.cmd)')"
          out cad       "$(any '^(cad/|\.github/)')"
          out blender   "$(any '^(blender/|cad/|godot/|\.github/)')"
          out godot     "$(any '^(godot/|blender/|core/src/|\.github/)')"
          out whatsapp  "$(any '^(bridge/|scripts/build_whatsapp_bridge\.ps1|packaging/|\.github/)')"
  core:
    name: Python Core tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no major tags since v8)
        with:
          enable-cache: true
      # Owner rule: NO skipped tests. Every extra is installed (camera/OpenCV, voice, tray, browser/Playwright once it
      # exists) and the real tools are fetched/located by tests/_tools.py (Godot 4.7.2 everywhere, Inno Setup on
      # Windows, openssl from PATH/Git). Platform-only tests are deselected per OS (markers), never skipped.
      - name: "System libraries (Linux, PortAudio for sounddevice)"
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
      - name: Install (locked, all extras)
        run: uv sync --frozen --all-extras
      - name: Browser for the real-browser tests (Chromium on Linux, preinstalled Edge on Windows)
        shell: bash
        run: |
          if uv run python -c "import playwright" 2>/dev/null; then
            if [ "$RUNNER_OS" = "Linux" ]; then uv run playwright install --with-deps chromium; else echo "using the preinstalled Edge"; fi
          else
            echo "no browser extra yet"
          fi
      - name: Cache tool downloads (Godot, Inno Setup; SHA-pinned in tests/_tools.py)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/jarves-test-tools
          key: jarves-test-tools-${{ runner.os }}-${{ hashFiles('core/tests/_tools.py') }}
      - name: pytest (offline; fakes for OpenAI, audio and the music player; ANY skip fails the run)
        shell: bash
        env:
          JARVES_BUILD_CACHE: ${{ runner.temp }}/jarves-test-tools
        run: |
          # a failing test FILE is retried once (only that file); flakes are recorded in flake-report.json (docs/CI_DETERMINISM.md)
          uv run python tools/pytest_ci.py --durations=25 | tee pytest.out
          if grep -E "(^SKIPPED|[0-9]+ skipped|xfailed)" pytest.out; then echo "::error::tests were skipped"; exit 1; fi
      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-report-core-${{ matrix.os }}
          path: core/flake-report.json
          if-no-files-found: ignore
      - name: Quarantined tests (non-blocking; still run, never skipped)
        continue-on-error: true
        shell: bash
        run: |
          uv run pytest -q -p no:cacheprovider -m quarantine || [ $? -eq 5 ]   # 5 = none quarantined
      - name: Redacted diagnostics on failure (pytest output, junit, Core logs; no secrets, no user content)
        if: failure()
        shell: bash
        run: |
          uv run python tools/ci_diagnostics.py diag pytest.out pytest-junit.xml || true
          uv run python -m jarves diag --ci --out diag/health || true   # package O: redaction-scanned bundle
      - name: Upload redacted diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-core-${{ matrix.os }}
          path: core/diag
          retention-days: 7
          if-no-files-found: ignore
      - name: jarvis.cmd launcher smoke (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call ..\jarvis.cmd setup --help || exit /b 1
          call ..\jarvis.cmd status > status.txt
          type status.txt
          findstr /C:"Core is NOT running" status.txt || exit /b 1
  installer:
    # SW-V2 M6: build the real Windows installer and smoke-test it (silent per-user install into a temp dir,
    # --version/status/features/doctor, offline Core start/stop, exported face self-checks, upgrade, uninstall keeps
    # data, /PURGE=1). On `main` the tested artifact is what .github/workflows/package.yml publishes; PR artifacts are
    # CI-only (3 days) and never become releases.
    name: Windows installer (build + silent install smoke)
    needs: [core, changes]
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CHANNEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || 'pr' }}
      # WP-O: optional custom update folder baked in as the default (docs/RELEASE_HOSTING.md); unset = the public
      # releases repo (once a signing key is built in), else the private repo's releases
      JARVES_UPDATE_BASE_URL: ${{ vars.JARVES_UPDATE_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Cache pinned build tools (Python, Godot editor + Windows template, Inno Setup; SHA256-pinned)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/jarves-build-cache
          key: jarves-build-tools-${{ hashFiles('packaging/build_windows.ps1') }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: bridge/whatsapp/go.sum
      - name: Build the pinned WhatsApp bridge (same reproducible build as the whatsapp-bridge job)
        shell: pwsh
        run: |
          $pin = Get-Content packaging/bridge_pin.json -Raw | ConvertFrom-Json
          ./scripts/build_whatsapp_bridge.ps1 -Version $pin.version
          "JARVES_BRIDGE_EXE=$((Resolve-Path bridge/whatsapp/dist/whatsapp_bridge.exe).Path)" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: |
          # 3.0.0.<run_number>: the public repo restarted its run counter, so the 3.x base keeps versions above the old 0.1.0.<run> series.
          $base = (Select-String -Path core/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $v = "$base.${{ github.run_number }}"
          ./packaging/build_windows.ps1 -Version $v -Channel $env:CHANNEL -Commit $env:GITHUB_SHA `
            -Cache "$env:RUNNER_TEMP/jarves-build-cache" -Out dist
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Silent install / run / upgrade / uninstall smoke
        shell: pwsh
        run: ./packaging/smoke_windows.ps1 -Installer "dist/JARVES-Setup-$env:VERSION.exe" -Version $env:VERSION -RequireFace -CheckAutostart -DefaultTasks -MetricsOut dist/installer-metrics.json
      - name: Installer size / time budget (SW-V4 L; same numbers feed core/tools/perf_gate.py --installer-json)
        shell: pwsh
        run: python packaging/installer_metrics.py check --metrics dist/installer-metrics.json --class ci
      - name: Upgrade + rollback matrix (old installers pinned in packaging/upgrade_fixtures.json)
        shell: pwsh
        run: ./packaging/upgrade_matrix.ps1 -Candidate "dist/JARVES-Setup-$env:VERSION.exe" -Version $env:VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: jarves-windows-installer-${{ env.CHANNEL }}
          path: |
            dist/JARVES-Setup-*.exe
            dist/JARVES-Setup-*.exe.sha256
            dist/build-info.json
          retention-days: ${{ env.CHANNEL == 'main' && 14 || 3 }}
          compression-level: 0
          if-no-files-found: error
  whatsapp-bridge:
    # SW-V4 F: the Go WhatsApp bridge (bridge/whatsapp). Offline only: go mod verify, vet, unit + API tests against the
    # fake engine (no WhatsApp account is ever contacted), then a reproducible Windows build checked by rebuilding.
    name: WhatsApp bridge (Go vet/test + reproducible build)
    needs: changes
    if: needs.changes.outputs.whatsapp == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: bridge/whatsapp/go.sum
      - name: Build (pinned go1.27.0 check, go mod verify, go vet, go test, reproducible build)
        shell: pwsh
        run: ./scripts/build_whatsapp_bridge.ps1 -Version "0.1.0"
      - name: Rebuild and compare SHA-256 (reproducibility)
        shell: pwsh
        run: ./scripts/build_whatsapp_bridge.ps1 -Version "0.1.0" -Verify bridge/whatsapp/dist/whatsapp_bridge.exe.sha256
      - name: Compare with packaging/bridge_pin.json
        shell: pwsh
        run: |
          $pin = Get-Content packaging/bridge_pin.json -Raw | ConvertFrom-Json
          $got = (Get-FileHash bridge/whatsapp/dist/whatsapp_bridge.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $pin.sha256) { throw "bridge SHA256 $got differs from packaging/bridge_pin.json ($($pin.sha256)); rebuild with -Version $($pin.version) and update the pin" }
      - uses: actions/upload-artifact@v7
        with:
          name: whatsapp-bridge-windows
          path: bridge/whatsapp/dist/
          retention-days: 7
          if-no-files-found: error
  perf:
    # SW-V4 M: performance gate (core/perf_budgets.toml, class ci = loose). Fails when a budget is exceeded.
    name: Performance gate (Windows)
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: perf_gate (real background Core, 2 runs, idle 60 s, plus in-process and dashboard timings)
        shell: bash
        run: uv run python tools/perf_gate.py --class ci --results perf-results.json
      - name: speed gate (jarvis speedtest, class ci, same budgets and code as the app, no history written)
        shell: bash
        run: uv run python -m jarves.cli speedtest --class ci --gate --no-store --no-net --idle-window 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: core/perf-results.json
          retention-days: 14
          if-no-files-found: ignore
  cad:
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Cache FreeCAD AppImage
        id: fc
        uses: actions/cache@v6
        with:
          path: FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          key: freecad-1.1.4-appimage
      - name: Install FreeCAD 1.1.4 (same version as local; apt only ships 0.21)
        run: |
          [ -f FreeCAD_1.1.4-Linux-x86_64-py311.AppImage ] || curl -sSLO https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          curl -sSL https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage-SHA256.txt | sha256sum -c -
          chmod +x FreeCAD_*.AppImage && ./FreeCAD_*.AppImage --appimage-extract > /dev/null
          echo "FC=$PWD/squashfs-root/usr/bin/freecadcmd" >> "$GITHUB_ENV"
      - name: CAD smoke test (blockout + Pebble build, check_pebble, HeadRX regression)
        run: QT_QPA_PLATFORM=offscreen "$FC" cad/smoke_test.py
      - name: Mesh export + mechanical estimates
        run: |
          QT_QPA_PLATFORM=offscreen "$FC" cad/build_pebble.py
          QT_QPA_PLATFORM=offscreen "$FC" cad/export_meshes.py
          QT_QPA_PLATFORM=offscreen "$FC" cad/mech_estimates.py | tee mech.txt
          grep -q "MECH DONE" mech.txt
  blender:
    needs: changes
    if: needs.changes.outputs.blender == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cache Blender 5.2.2
        uses: actions/cache@v6
        with:
          path: blender-5.2.2-linux-x64
          key: blender-5.2.2-linux-x64
      - name: Install Blender 5.2.2
        run: |
          [ -x blender-5.2.2-linux-x64/blender ] || curl -sSL https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz | tar xJ
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxi6 libxkbcommon0 libxrender1 libsm6 libgl1 libegl1
      - name: Blender smoke (committed .glb vs CAD manifest, materials, Godot asset sync, renders present)
        run: ./blender-5.2.2-linux-x64/blender -b --python blender/smoke_blender.py
  godot:
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Cache the Godot 4.7.2 download
        uses: actions/cache@v6
        with:
          path: Godot_v4.7.2-stable_linux.x86_64.zip
          key: godot-4.7.2-linux-zip
      - name: Install Godot 4.7.2
        run: |
          [ -f Godot_v4.7.2-stable_linux.x86_64.zip ] || curl -sSLO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_*.zip && echo "GODOT=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import assets
        run: '"$GODOT" --headless --path godot --import'
      - name: Viewer check (parts, picking, exploded view, LED/blank swap, live face)
        run: |
          "$GODOT" --headless --path godot --quit-after 3000 -- --check --no-core | tee viewer.txt
          grep -q "CHECK RESULT: PASS" viewer.txt
      - name: Face display self-test
        run: |
          "$GODOT" --headless --path godot --quit-after 3000 res://face/face_app.tscn -- --check | tee face.txt
          grep -q "FACE CHECK RESULT: PASS" face.txt
  e2e:
    name: Core-Godot E2E (real processes)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Cache the Godot 4.7.2 download
        uses: actions/cache@v6
        with:
          path: Godot_v4.7.2-stable_linux.x86_64.zip
          key: godot-4.7.2-linux-zip
      - name: Install Core + Godot 4.7.2
        run: |
          (cd core && uv sync --frozen)
          [ -f Godot_v4.7.2-stable_linux.x86_64.zip ] || curl -sSLO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_*.zip && echo "GODOT=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "JARVES_HOME=$RUNNER_TEMP/jarves" >> "$GITHUB_ENV"
      - name: Import assets
        run: '"$GODOT" --headless --path godot --import'
      - name: Face protocol test (real face, headless; every message incl. malformed must not break it)
        run: (cd core && GODOT_EXE="$GODOT" uv run pytest -q tests/test_face_protocol_godot.py)
      - name: Start the Core (offline, no keys, no audio, no music)
        run: |
          mkdir -p "$JARVES_HOME"
          printf '[voice]\nmode = "off"\n\n[music]\nprovider = "none"\n' > "$JARVES_HOME/config.toml"
          (cd core && nohup uv run jarves run > "$RUNNER_TEMP/core.out" 2>&1 &)
          for i in $(seq 60); do grep -q CORE_READY "$JARVES_HOME/logs/jarves.log" 2>/dev/null && break; sleep 0.5; done
          grep -q CORE_READY "$JARVES_HOME/logs/jarves.log" || { cat "$RUNNER_TEMP/core.out"; exit 1; }
      - name: Loading screen waits for read-only startup readiness
        run: |
          timeout 30 "$GODOT" --headless --path godot res://loading.tscn -- --loading-check | tee loading.txt
          grep -q "LOADING CHECK RESULT: PASS" loading.txt
      - name: E2E pass - face asks "what time is it", gets a reply and face states
        run: |
          timeout 90 "$GODOT" --headless --path godot res://face/face_app.tscn -- --e2e | tee e2e.txt
          grep -q "E2E RESULT: PASS" e2e.txt
      - name: E2E negative - wrong token is rejected (4401), face never connects
        run: |
          mkdir -p "$RUNNER_TEMP/bad" && echo wrong-token > "$RUNNER_TEMP/bad/link_token"
          JARVES_HOME="$RUNNER_TEMP/bad" timeout 90 "$GODOT" --headless --path godot res://face/face_app.tscn -- --e2e | tee bad.txt || true
          grep -q "E2E RESULT: FAIL" bad.txt && grep -q "rejected the token" bad.txt
          (cd core && uv run jarves status || true) | grep -Eq '"core": "(ready|degraded)"'   # Core survived the bad client (offline = degraded)
      - name: Window close keeps the Core running by default (background_core ON); `jarves stop` ends it
        run: |
          timeout 30 "$GODOT" --headless --path godot res://face/face_app.tscn -- --e2e-close
          sleep 3
          ! grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log"               # the face closed, the Core did not stop
          (cd core && uv run jarves status) | grep -Eq '"core": "(ready|degraded)"'
          (cd core && uv run jarves stop)
          for i in $(seq 30); do grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log" && break; sleep 0.5; done
          grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log"
          ! (cd core && uv run jarves status)
      - name: Window close stops the Core through the authenticated link (background_core OFF)
        run: |
          rm -f "$JARVES_HOME/logs/jarves.log"
          (cd core && nohup uv run jarves run > "$RUNNER_TEMP/core2.out" 2>&1 &)
          for i in $(seq 60); do grep -q CORE_READY "$JARVES_HOME/logs/jarves.log" 2>/dev/null && break; sleep 0.5; done
          grep -q CORE_READY "$JARVES_HOME/logs/jarves.log" || { cat "$RUNNER_TEMP/core2.out"; exit 1; }
          (cd core && uv run jarves features off background_core)
          sleep 2                                                             # the running Core re-reads the switch file
          timeout 30 "$GODOT" --headless --path godot res://face/face_app.tscn -- --e2e-close
          for i in $(seq 30); do grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log" && break; sleep 0.5; done
          grep -q CORE_STOPPED "$JARVES_HOME/logs/jarves.log"
          ! (cd core && uv run jarves status)                                 # now reports NOT running
      - name: Redacted diagnostics on failure (Core output and log, nothing unredacted is printed or kept)
        if: failure()
        run: |
          (cd core && uv run python tools/ci_diagnostics.py "$GITHUB_WORKSPACE/diag" "$RUNNER_TEMP/core.out" "$RUNNER_TEMP/core2.out" "$JARVES_HOME/logs" "$RUNNER_TEMP/bad" || true)
          tail -50 "$GITHUB_WORKSPACE"/diag/*jarves.log || true
          (cd core && uv run python -m jarves diag --ci --out "$GITHUB_WORKSPACE/diag/health" || true)   # package O
      - name: Upload redacted diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-e2e
          path: diag
          retention-days: 7
          if-no-files-found: ignore

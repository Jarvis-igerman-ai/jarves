; Godot 4.7 export preset for the installed face/room (written to godot/export_presets.cfg by build_windows.ps1).
; @TEMPLATE@ = the official windows_release_x86_64.exe from the pinned 4.7.2 export templates (.tpz).
; *.json is included because main.gd reads the GLB manifest/finishes with FileAccess (res://, inside the .pck).
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="previews/*, *.cmd, *.ps1"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release="@TEMPLATE@"
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/file_version="@VERSION@"
application/product_version="@VERSION@"
application/company_name="JARVES"
application/product_name="JARVES Face"
application/file_description="JARVES face and room"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0

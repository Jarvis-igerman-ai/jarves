what_en = "A countdown timer or an alarm for a clock time. JARVES announces it aloud, even when the window is closed."
say = [["טיימר לעשר דקות לפסטה", "A ten minute timer for the pasta"], ["תעיר אותי מחר בשבע וחצי", "Wake me tomorrow at seven thirty"], ["כמה זמן נשאר בטיימר?", "How long is left on the timer?"], ["תבטל את הטיימר", "Cancel the timer"]]
expect_he = "כשהזמן נגמר ג'ארביס אומר את זה בקול, בשיחה פתוחה ברגע נוח ובלי שיחה בעצמו. אם המחשב היה כבוי והטיימר חלף ביותר מ-10 דקות, הוא לא יצלצל באיחור."
expect_en = "When time is up JARVES says it aloud: in an open conversation at a good moment, otherwise by himself. If the computer was off and the timer passed more than 10 minutes ago it does not ring late."
cost_he = "חינם. הכול מקומי."
cost_en = "Free. All local."

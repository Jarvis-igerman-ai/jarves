privacy_en = "Timers are kept on this computer only."

[[steps]]
he = "אמרו \"טיימר לעשר דקות\" או \"תעיר אותי בשבע וחצי\"."
en = "Say \"a ten minute timer\" or \"wake me at seven thirty\"."
check = "active:timers"

[[steps]]
he = "כדי לבדוק את הצליל, הגדירו טיימר של דקה והשאירו את החלון סגור."
en = "To test the sound, set a one minute timer and leave the window closed."

[[steps]]
he = "בלי קול: בלוח הבקרה, בעמוד \"טיימרים ושעונים מעוררים\", או בשורת הפקודה: jarvis timers add 10m פסטה, jarvis timers list, jarvis timers cancel 3."
en = "Without voice: on the dashboard page \"Timers & alarms\", or on the command line: jarvis timers add 10m pasta, jarvis timers list, jarvis timers cancel 3."

[[problems]]
he = "הטיימר לא צלצל"
en = "The timer did not ring"
fix_he = "בדקו שהרמקול והמיקרופון פועלים (jarvis doctor) ושהקול לא כבוי. טיימר שהוחמץ יותר מ-10 דקות נרשם כ\"הוחמץ\"."
fix_en = "Check that the speaker works (jarvis doctor) and voice is not off. A timer missed by over 10 minutes is recorded as missed."

error_codes = ["WA_BRIDGE_DOWN", "WA_NOT_INSTALLED", "BRIDGE_NOT_PUBLISHED", "BRIDGE_OFFLINE", "BRIDGE_BAD_SIGNATURE", "BRIDGE_CHECKSUM", "BRIDGE_TAMPERED", "WA_NOT_SET_UP", "WA_KILLED", "WA_MODE_OFF", "WA_MODE_READ", "WA_NOT_ALLOWED", "WA_NO_HISTORY", "WA_RATE_LIMITED", "WA_QUIET_HOURS", "WA_STORE_LOCKED", "WA_UNKNOWN_CONTACT", "WA_AMBIGUOUS", "WA_BAD_PATTERN", "WA_APPROVAL_MISSING"]
title_he = "וואטסאפ אמיתי: לקרוא הודעות (ובהמשך לשלוח)"
title_en = "Real WhatsApp: read messages (and later send)"
what_he = "ג'ארביס מתחבר לוואטסאפ שלכם כמכשיר מקושר (כמו וואטסאפ ווב) דרך גשר נפרד במחשב, ויכול לספר מה חדש, להקריא מה מישהו כתב ולסכם. קודם קריאה בלבד. שליחה נפתחת רק אחרי 14 ימים שקטים ורק באישורכם, וכל הודעה מאושרת על המסך עם הנמען, המספר והטקסט המלא. עד אז שולחים כמו קודם: הוא פותח טיוטה ואתם לוחצים שלח."
what_en = "JARVES connects to your WhatsApp as a linked device (like WhatsApp Web) through a separate bridge on this computer, and can tell you what is new, read what someone wrote and summarize. Read-only first. Sending opens only after 14 quiet days and only with your go, and every message is approved on the screen with the recipient, number and full text. Until then you send as before: he opens a draft and you press send."
say = [
  ["מה חדש בוואטסאפ?", "What's new on WhatsApp?"],
  ["תקרא לי מה דנה כתבה", "Read me what Dana wrote"],
  ["תסכם לי מה כתבו לי דנה ויוסי היום", "Summarize what Dana and Yossi wrote me today"],
  ["תחפש צ'אט שיש בשם שלו \"אשתי\"", "Find the chat with \"אשתי\" in its name"],
  ["תחפש לי את הצ'אט של רשימת קניות", "Find my shopping list chat"],
  ["תחפש צ'אט שמתחיל בקניות", "Find a chat that starts with קניות"],
  ["תענה לדנה: אני מאחר בעשר דקות", "Reply to Dana: I'm ten minutes late"],
]
expect_he = "על \"מה חדש\" הוא אומר רק שמות ומספר הודעות. טקסט ארוך הוא לא מקריא אלא מציע להציג על המסך. הוא אף פעם לא עושה מה שכתוב בהודעה. במצב שליחה: הוא כותב טיוטה ומיד קופץ חלון אישור עם השם, המספר והטקסט המלא. הודעות של שיחה מוקראות מהישנה לחדשה, עם תאריך כשהן מכמה ימים, והוא אומר \"האחרונות X מתוך Y\". בתיבת ההודעות הצ'אט האחרון קודם, ובחיפוש התוצאה החדשה קודם."
expect_en = "For \"what's new\" he says only names and counts. Long texts are not read aloud; he offers the screen. He never does what a message says. In send mode he writes a draft and an approval window opens at once with the name, number and full text. A chat is read oldest to newest, with the date when it spans days, and he says \"the latest X of Y\". The inbox lists the most recent chat first; search lists the newest hit first."
test_he = "jarvis whatsapp status מראה מחובר, מצב ומספר הודעות שלא נקראו."
test_en = "jarvis whatsapp status shows connected, the mode and the unread count."
cost_he = "חינם. טקסט של הודעה עובר למודל ה-AI רק כשאתם שואלים עליה."
cost_en = "Free. A message's text goes to the AI model only when you ask about it."
privacy_he = "זה לקוח לא רשמי: הוא עלול לסתור את תנאי השימוש של וואטסאפ ויש סיכון לחסימה זמנית או קבועה של המספר (אישרתם את זה למספר הראשי, קודם לקריאה בלבד). המפתחות של החיבור מוצפנים במחשב (DPAPI) ולא נכנסים לגיבויים, ליומנים או לאבחון. הודעות נשמרות 14 יום (ניתן לשנות עד 90, לא לשמור כלום, או לשמור שנה ויותר עם הארכיון המוצפן האופציונלי: המדריך whatsapp_archive), מדיה לא יורדת אף פעם. ביומנים יש רק קודים, מספרים ותמצית מוצפנת של הצ'אט, בלי טקסט, שמות או מספרי טלפון. ניתוק בטלפון (מכשירים מקושרים > JARVES bridge > התנתקות) עובד תמיד."
privacy_en = "This is an unofficial client: it may go against WhatsApp's Terms and there is a risk of a temporary or permanent ban of the number (you accepted this for your main number, read-only first). The connection keys are encrypted on this computer (DPAPI) and never go into backups, logs or diagnostics. Messages are kept 14 days (changeable up to 90, or keep nothing, or a year and more with the optional encrypted archive: the whatsapp_archive guide); media is never downloaded. Logs hold only codes, counts and a chat hash, never text, names or phone numbers. Unlinking on the phone (Linked devices > JARVES bridge > Log out) always works."

[[steps]]
he = "אם רכיב הגשר לא מותקן: בלוח הבקרה, בעמוד וואטסאפ, לוחצים \"הורדת גשר הוואטסאפ\" (או jarvis whatsapp install). הקובץ מורד פעם אחת, רק כשלחצתם, מרשימה חתומה של JARVES; החתימה, ה-SHA256 והגודל נבדקים לפני ההתקנה, והקובץ נבדק שוב לפני כל הפעלה. אין צורך לבנות כלום. אם ההורדה עוד לא פורסמה תופיע הודעה ברורה ולא קורה כלום."
en = "If the bridge program is not installed: on the dashboard WhatsApp page press \"Download the WhatsApp bridge\" (or jarvis whatsapp install). The file is downloaded once, only when you press it, from a signed JARVES manifest; the signature, SHA256 and size are checked before it is installed, and the file is checked again before every start. You build nothing. If the download is not published yet you get a clear message and nothing happens."
action = "open:#/whatsapp"

[[steps]]
he = "הדרך הפשוטה: בלוח הבקרה, בעמוד וואטסאפ, לוחצים \"הגדרת וואטסאפ\" (או בעמוד החיבורים על השורה וואטסאפ, או jarvis connect whatsapp, או jarvis whatsapp setup). הגשר מופעל, מופיע קוד QR, ואתם סורקים אותו בטלפון. אחרי הקישור נשאלים אם להפעיל קריאה בלבד; אם עונים כן, גם מתג \"וואטסאפ אמיתי (קריאה)\" נדלק (אותו דבר כמו jarvis features on whatsapp_bridge) ואין צורך בצעד נוסף. השליחה נשארת כבויה. אם עונים לא, שניהם נשארים כבויים. הסריקה תמיד ידנית ושום הודעה לא נשלחת."
en = "The simple way: on the dashboard WhatsApp page press \"Set up WhatsApp\" (or the WhatsApp row on the Connections page, or jarvis connect whatsapp, or jarvis whatsapp setup). The bridge starts, a QR code appears and you scan it on your phone. After linking you are asked whether to switch on read-only; if you say yes, the \"WhatsApp real access (read)\" switch is turned on too (the same as jarvis features on whatsapp_bridge) and no further step is needed. Sending stays off. If you say no, both stay off. The scan is always manual and no message is sent."
action = "open:#/whatsapp"

[[steps]]
he = "במחשב: jarvis whatsapp link. בטלפון: וואטסאפ > הגדרות > מכשירים מקושרים > קישור מכשיר, וסורקים את הקוד (או jarvis whatsapp link --window לחלון)."
en = "On the computer: jarvis whatsapp link. On the phone: WhatsApp > Settings > Linked devices > Link a device, and scan the code (or jarvis whatsapp link --window for a window)."
action = "command:jarvis whatsapp link"

[[steps]]
he = "מצב קריאה בלבד ומתג הקריאה הם שני דברים נפרדים: jarvis whatsapp mode read קובע את מצב הגשר, ו-jarvis features on whatsapp_bridge מדליק את המתג שבלעדיו ג'ארביס לא קורא כלום. jarvis whatsapp status מראה \"מתג הקריאה: כבוי\" כשהוא כבוי."
en = "Read-only mode and the reading switch are two separate things: jarvis whatsapp mode read sets the bridge mode, and jarvis features on whatsapp_bridge turns on the switch without which JARVES reads nothing. jarvis whatsapp status shows \"reading switch: off\" when it is off."
action = "feature_on:whatsapp_bridge"
check = "active:whatsapp_bridge"

[[steps]]
he = "בלוח הבקרה, בעמוד וואטסאפ: מצב, רשימות קריאה ושליחה, מונה שליחות, שמירה, תיבת הודעות ומתג חירום."
en = "On the dashboard WhatsApp page: status, read and send lists, send counters, retention, the inbox and the kill switch."
action = "open:#/whatsapp"

[[steps]]
he = "אחרי 14 ימים בלי אזהרה: jarvis whatsapp allow send <איש קשר>, ואז jarvis whatsapp mode send והמתג \"שליחה בוואטסאפ דרך הגשר\"."
en = "After 14 days without a warning: jarvis whatsapp allow send <contact>, then jarvis whatsapp mode send and the switch \"WhatsApp send through the bridge\"."

[[steps]]
he = "חיפוש צ'אט בשם: אפשר להגיד או להקליד חלק מהשם, עם טעות או בכתיב אחר. הוא מוצא גם \"רשימה קניות\" או \"רשמית קניות\" לצ'אט \"רשימת קניות\", \"dana\" לצ'אט \"דנה\", וטקסט שהוקלד במקלדת בשפה הלא נכונה. התוצאות מדורגות מהטובה לפחות טובה (עד 10), ליד כל אחת הסיבה: זהה, מתחיל ב, מילה תואמת, מכיל, דומה (טעות), תבנית. התאמה אחת ברורה נעשית מיד; כמה התאמות באותה רמה הוא מציג ושואל איזה, לעולם לא מנחש. בדיקה: jarvis whatsapp find \"קניות\"."
en = "Finding a chat by name: say or type part of the name, with a typo or another spelling. He finds \"רשימה קניות\" or \"רשמית קניות\" for the chat \"רשימת קניות\", \"dana\" for \"דנה\", and text typed on the wrong keyboard layout. Results are ranked best first (up to 10) with the reason next to each: exact, starts with, word match, contains, similar (typo), pattern. One clear match is used at once; several at the same rank are shown and he asks which, and never guesses. Check: jarvis whatsapp find \"קניות\"."
action = "command:jarvis whatsapp find"

[[steps]]
he = "תבניות חיפוש (בשם הצ'אט): * = כל טקסט (קניות*); ? = אות אחת (קני?ת); \"מילים מדויקות\" במרכאות; א|ב = או (דנה|יוסי); ^ בהתחלה = מתחיל ב (^קניות); $ בסוף = נגמר ב (קניות$). ביטוי רגולרי: /תבנית/ או jarvis whatsapp find --regex \"...\" (מנוע בטוח וליניארי, עד 80 תווים, בלי backreference; תבנית לא תקינה מקבלת הסבר ברור בעברית ובאנגלית)."
en = "Search patterns (in a chat name): * = any text (קניות*); ? = one letter (קני?ת); \"exact words\" in quotes; a|b = either (dana|yossi); a leading ^ = starts with (^קניות); a trailing $ = ends with (קניות$). Regular expression: /pattern/ or jarvis whatsapp find --regex \"...\" (a safe linear-time engine, up to 80 characters, no backreferences; an invalid pattern gets a clear message in Hebrew and English)."
action = "command:jarvis whatsapp find --regex"

[[problems]]
he = "הוא לא מוצא את הצ'אט (למשל כשאני אומר רק חלק מהשם)"
en = "He cannot find the chat (for example when I give only part of the name)"
fix_he = "השם בוואטסאפ יכול להיות ארוך או עם לבבות ואימוג'י, ולכן אפשר להגיד רק חלק ממנו (\"אשתי\", \"לב\"). הוא סולח על טעויות כתיב, כתיב חלופי (רשימת/רשימה), dana במקום דנה ומקלדת בשפה שגויה, ומציג את התוצאות מדורגות עם סיבה. הוא מחפש בשמות הצ'אטים ולא בטקסט ההודעות: אם יש כמה התאמות הוא שואל אותך איזה מהם ולא מנחש, ואם אין הוא אומר שלא מצא ומציע חלק אחר מהשם או חיפוש בטקסט ההודעות. הוא לא אומר \"אני עדיין מחפש\": כל חיפוש נגמר מיד. לבדוק בעצמכם: jarvis whatsapp find \"אשתי\" (שמות בלבד, בלי טקסט הודעות). אם עדיין אין, הצ'אט אולי מחוץ לרשימת הקריאה: jarvis whatsapp scope או jarvis whatsapp allow read."
fix_en = "A WhatsApp name can be long or hold hearts and emoji, so you can give just a part of it (for example \"wife\" or a heart emoji). He forgives typos, spelling variants, Latin letters for Hebrew names and a wrong keyboard layout, and shows ranked results with a reason. He searches chat NAMES, not message text: with several matches he asks which one and never guesses; with none he says so and offers another part of the name or a search of message text. He never says \"still searching\": every search finishes at once. Check yourself: jarvis whatsapp find \"wife\" (names only, no message text). If it is still missing, the chat may be outside the read list: jarvis whatsapp scope or jarvis whatsapp allow read."

[[problems]]
he = "כתוב שרכיב הגשר לא מותקן"
en = "It says the bridge program is not installed"
fix_he = "הגשר הוא תוכנה נפרדת (whatsapp_bridge) שחייבת להיות במחשב. הצעד הבא: ללחוץ בעמוד וואטסאפ על \"הורדת גשר הוואטסאפ\" (או jarvis whatsapp install), או להתקין מחדש את JARVES (ההתקנה כוללת אותה), או מתוך קוד המקור להריץ scripts/build_whatsapp_bridge.ps1 (דורש Go 1.27.0). עד אז הכפתורים קישור והפעלה כבויים. jarvis whatsapp status מראה bridge_installed."
fix_en = "The bridge is a separate program (whatsapp_bridge) that must be on this computer. Next step: press \"Download the WhatsApp bridge\" on the WhatsApp page (or run jarvis whatsapp install), or reinstall JARVES (the installer includes it), or from a source checkout run scripts/build_whatsapp_bridge.ps1 (needs Go 1.27.0). Until then the Link and Start buttons stay off. jarvis whatsapp status shows bridge_installed."

[[problems]]
he = "הוא אומר שוואטסאפ עצור"
en = "He says WhatsApp is killed"
fix_he = "מישהו לחץ על מתג החירום, או שוואטסאפ שלח אזהרה והגשר עצר את עצמו. בדקו את הטלפון, ואז jarvis whatsapp kill --release."
fix_en = "Someone pressed the kill switch, or WhatsApp sent a warning and the bridge stopped itself. Check the phone, then jarvis whatsapp kill --release."

[[problems]]
he = "הוא לא שולח, רק פותח טיוטה"
en = "He does not send, he only opens a draft"
fix_he = "זה המצב הנכון עד שמצב שליחה מופעל (אחרי 14 ימי קריאה שקטים). השליחה דרך פתיחת הצ'אט נשארת."
fix_en = "That is right until send mode is on (after 14 quiet read-only days). Sending by opening the chat stays."

[[problems]]
he = "הגשר לא פועל או לא מחובר"
en = "The bridge is not running or not connected"
fix_he = "הריצו jarvis whatsapp start ואז jarvis whatsapp status. אם כתוב \"logged out\", קשרו שוב: jarvis whatsapp link."
fix_en = "Run jarvis whatsapp start, then jarvis whatsapp status. If it says \"logged out\", link again: jarvis whatsapp link."

[[problems]]
he = "העתקתי את התיקייה למחשב אחר והיא לא נפתחת"
en = "I copied the folder to another computer and it does not open"
fix_he = "נכון: ההצפנה קשורה למשתמש ולמחשב. במחשב החדש מקשרים מחדש: jarvis whatsapp unlink ואז link."
fix_en = "Correct: the encryption is tied to the user and the PC. On the new PC link again: jarvis whatsapp unlink, then link."

[[problems]]
he = "ההורדה של הגשר נכשלה או כתוב שהיא עוד לא פורסמה"
en = "The bridge download failed, or it says it is not published yet"
fix_he = "BRIDGE_NOT_PUBLISHED: הגשר החתום עוד לא פורסם, אין תקלה אצלכם; מתקינים מחדש את JARVES מהתקנה שכוללת את הגשר או מחכים לפרסום. BRIDGE_OFFLINE: בודקים אינטרנט ולוחצים שוב. BRIDGE_BAD_SIGNATURE או BRIDGE_CHECKSUM: הקובץ נדחה ולא הותקן כלום; לא מנסים לעקוף, אלא מדווחים (jarvis issues). BRIDGE_RUNNING: jarvis whatsapp stop ואז שוב. אפשר לראות את הכתובת והגרסה שהותקנה ב-jarvis whatsapp status."
fix_en = "BRIDGE_NOT_PUBLISHED: the signed bridge is not published yet, nothing is wrong on your side; reinstall JARVES from an installer that includes the bridge, or wait for the publication. BRIDGE_OFFLINE: check the internet and press again. BRIDGE_BAD_SIGNATURE or BRIDGE_CHECKSUM: the file was refused and nothing was installed; do not work around it, report it (jarvis issues). BRIDGE_RUNNING: jarvis whatsapp stop, then again. jarvis whatsapp status shows the installed bridge."

[[problems]]
he = "כתוב שהגשר המותקן לא תואם לרשימה החתומה (BRIDGE_TAMPERED)"
en = "It says the installed bridge no longer matches its signed manifest (BRIDGE_TAMPERED)"
fix_he = "הקובץ שונה או ניזוק אחרי ההורדה (לפעמים בגלל אנטי-וירוס), ולכן הוא לא הופעל. לוחצים \"הורדת גשר הוואטסאפ\" (jarvis whatsapp install) כדי להחליף אותו בקובץ מאומת. אם זה חוזר, בודקים את האנטי-וירוס ומדווחים."
fix_en = "The file was changed or damaged after the download (sometimes by an antivirus), so it was not started. Press \"Download the WhatsApp bridge\" (jarvis whatsapp install) to replace it with a verified file. If it repeats, check the antivirus and report it."

[[problems]]
he = "הוא עונה שאין לו גישה להודעות הוואטסאפ, אף שהגשר מקושר ובמצב קריאה"
en = "He says he has no access to my WhatsApp messages although the bridge is linked and in read mode"
fix_he = "מתג הקריאה כבוי (מצב הגשר והמתג נפרדים). הריצו jarvis features on whatsapp_bridge, או לחצו \"הדלקה\" בעמוד וואטסאפ. jarvis whatsapp status מראה \"מתג הקריאה: כבוי\". הגדרה חדשה מדליקה אותו כשעונים כן על קריאה בלבד."
fix_en = "The reading switch is off (the bridge mode and the switch are separate). Run jarvis features on whatsapp_bridge, or press \"Turn on\" on the WhatsApp page. jarvis whatsapp status shows \"reading switch: off\". A new setup turns it on when you answer yes to read-only."

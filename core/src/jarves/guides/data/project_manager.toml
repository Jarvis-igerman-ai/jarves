  ["תפצל את הבדיקה לקלוד ולקודקס, שיתווכחו ושופט יכריע", "Split the review between Claude and Codex, let them argue and a judge decide"],
  ["יש באג: ההתחברות נשברת אחרי התנתקות", "There is a bug: login breaks after logout"],

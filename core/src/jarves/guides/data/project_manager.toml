order = 73
category = "system"
pages = ["projects"]
features = ["project_manager"]
aliases = ["פרויקט תוכנה", "מנהל פרויקט", "משימות לסוכנים", "מה המצב בפרויקט", "project manager", "software project", "split into tasks", "agents tasks", "project status"]
links = ["agent_orchestrator", "privacy"]
title_he = "מנהל פרויקט תוכנה"
title_en = "Software project manager"
what_he = "פותחים פרויקט תוכנה (תיקיית git) וג'ארביס מנהל אותו: מפרק את המטרה למשימות קטנות, נותן כל משימה לסוכן קוד נפרד (Claude Code, Codex, OpenCode) בשיחה קצרה משלו, מריץ משימות בלתי תלויות במקביל, ומעביר עבודה הלאה בהעברת מקל קצרה. אפשר לשאול על המצב, להוסיף או לשנות משימה, לבקש פירוט ולדבר עם הסוכן."
what_en = "You open a software project (a git folder) and JARVES manages it: it splits the goal into small tasks, gives each task to a separate coding agent (Claude Code, Codex, OpenCode) in its own short session, runs independent tasks in parallel and passes work on with a short handoff. You can ask for the status, add or change a task, ask for details and talk to the agent."
say = [
  ["מה המצב בפרויקט?", "What is the status of the project?"],
  ["תוסיף משימה: לכתוב בדיקות ל-login", "Add a task: write tests for login"],
  ["תן לי פירוט על משימה 3", "Give me a deep dive on task 3"],
  ["תשאל את הסוכן של משימה 2 למה הוא שינה את הקובץ", "Ask the agent of task 2 why it changed the file"],
  ["תתחיל לעבוד", "Start working"],
]
expect_he = "תשובה קצרה: כמה משימות הושלמו, מה רץ עכשיו אצל איזה סוכן, ומה תקוע וצריך אותך. כל משימה מתמזגת לענף אינטגרציה נפרד (jarves/p<מספר>/integration) רק אחרי שפקודת הבדיקה של הפרויקט עברה על התוצאה הממוזגת. התיקייה שלכם לא נוגעים בה."
expect_en = "A short answer: how many tasks are done, what runs now with which agent, and what is stuck and needs you. Each task is merged into a separate integration branch (jarves/p<number>/integration) only after the project's check command passed on the merged result. Your own checkout is never touched."
cost_he = "הסוכנים עובדים על המנויים שלכם (Claude ו-ChatGPT), לא בחיוב API. יש מגבלה יומית על הרצות (40) ועל עלות מוערכת ($5), ו-OpenRouter (בתשלום) כבוי עד שמאפשרים אותו במפורש. תוכנית שהסוכן הציע נשארת הצעה עד שאישרתם."
cost_en = "The agents run on your subscriptions (Claude and ChatGPT), not API billing. There is a daily limit on runs (40) and on estimated cost ($5), and OpenRouter (paid) stays off until you explicitly allow it. A plan an agent proposes stays a proposal until you approve it."
privacy_he = "רק התיקיות שפתחתם כפרויקט. כל סוכן מקבל כרטיס משימה קטן בלבד (כ-1.5 אלף טוקנים) ורואה את הקוד בעצמו; מפתחות וטוקנים לא מועברים לתהליך הסוכן. ג'ארביס אף פעם לא דוחף, ממזג לענף שלכם, פותח pull request או מוחק. טקסט שהסוכן כותב הוא מידע, לא הוראה."
privacy_en = "Only folders you opened as a project. Each agent gets a small task card only (about 1.5k tokens) and reads the code itself; keys and tokens are not passed to the agent process. JARVES never pushes, merges into your branch, opens a pull request or deletes. Text an agent writes is data, not an instruction."

[[steps]]
he = "הדליקו את המתג \"מנהל פרויקט תוכנה\" (דף התכונות, או: jarvis features on project_manager)."
en = "Switch on \"Software project manager\" (the Features page, or: jarvis features on project_manager)."
action = "feature_on:project_manager"
check = "enabled:project_manager"

[[steps]]
he = "ודאו שיש לפחות סוכן קוד אחד מותקן ומחובר: jarvis project runners. אם חסר, ההודעה אומרת מה להתקין (Claude Code, Codex או OpenCode) ולהתחבר עם המנוי."
en = "Check that at least one coding agent is installed and signed in: jarvis project runners. If one is missing, the message says what to install (Claude Code, Codex or OpenCode) and to sign in with your subscription."

[[steps]]
he = "פתחו את הפרויקט במחשב: jarvis project open התיקייה --name שם --goal \"מה לבנות\" --check \"python -m pytest -q\". הפקודה (פתיחה וארכוב) רק מהמחשב או מהדף, לא בקול."
en = "Open the project on the PC: jarvis project open FOLDER --name NAME --goal \"what to build\" --check \"python -m pytest -q\". Opening and archiving are done only from the PC or the page, not by voice."

[[steps]]
he = "בקשו תוכנית: jarvis project plan --goal \"...\" (סוכן קורא את הקוד ומציע עד 12 משימות קטנות), או תוכנית משלכם: jarvis project plan --file tasks.json. לבדוק ולאשר: jarvis project approve (חלון אישור על המסך)."
en = "Ask for a plan: jarvis project plan --goal \"...\" (an agent reads the code and proposes up to 12 small tasks), or your own: jarvis project plan --file tasks.json. Review and approve: jarvis project approve (an approval window on the screen)."

[[steps]]
he = "התחילו לעבוד: jarvis project resume (או בקול: \"תתחיל לעבוד\"), או jarvis project run כדי לראות את ההתקדמות בחלון. עצירה: jarvis project pause."
en = "Start the work: jarvis project resume (or by voice: \"start working\"), or jarvis project run to watch the progress in the window. Stop: jarvis project pause."

[[steps]]
he = "ניהול שוטף: jarvis project status, add \"כותרת\" --spec \"...\" --scope src/a.py --after 1, update 3 --spec \"...\", note 3 \"הערה\", cancel 3, retry 3, deep 3 (פירוט), talk 3 \"שאלה\" (או --do כדי לבקש שינוי כמשימת המשך), ship (מה למזג ולדחוף בעצמכם), digest."
en = "Day to day: jarvis project status, add \"title\" --spec \"...\" --scope src/a.py --after 1, update 3 --spec \"...\", note 3 \"remark\", cancel 3, retry 3, deep 3 (details), talk 3 \"question\" (or --do to ask for a change as a follow-up task), ship (what to merge and push yourself), digest."

[[problems]]
he = "משימה סומנה \"תקועה\" ויש הודעה על קבצים מחוץ להיקף"
en = "A task is \"blocked\" with a message about files outside the scope"
fix_he = "הסוכן שינה קבצים שלא הוגדרו למשימה (או קובצי הגדרות של הסוכנים). שום דבר לא מוזג; העבודה נשארת בענף המשימה. הרחיבו את ההיקף: jarvis project update N --scope ... ואז jarvis project retry N."
fix_en = "The agent changed files the task did not list (or agent settings files). Nothing was merged; the work stays on the task branch. Widen the scope: jarvis project update N --scope ... then jarvis project retry N."

[[problems]]
he = "משימה נכשלה אחרי שתי ניסיונות"
en = "A task failed after two attempts"
fix_he = "ראו למה: jarvis project deep N (ציר זמן ופלט הבדיקה). פצלו למשימות קטנות יותר או תקנו את המפרט, ואז retry. סוכן שלא מותקן מופיע ב-jarvis project runners."
fix_en = "See why: jarvis project deep N (timeline and check output). Split it into smaller tasks or fix the spec, then retry. An agent that is not installed shows in jarvis project runners."

[[problems]]
he = "הפרויקט לא מתחיל או נעצר ומודיע על מגבלה יומית"
en = "The project does not start or stops with a daily limit message"
fix_he = "הגעתם למגבלת ההרצות או העלות היומית. אפשר להעלות את projects.max_runs_per_day או projects.max_cost_usd_per_day בהגדרות, או להמשיך מחר."
fix_en = "You reached the daily run or cost limit. Raise projects.max_runs_per_day or projects.max_cost_usd_per_day in the settings, or continue tomorrow."

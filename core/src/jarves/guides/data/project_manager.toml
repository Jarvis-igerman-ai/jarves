aliases = ["פרויקט תוכנה", "מנהל פרויקט", "משימות לסוכנים", "מה המצב בפרויקט", "project manager", "software project", "split into tasks", "agents tasks", "project status"]
links = ["agent_orchestrator", "privacy"]
title_he = "מנהל פרויקט תוכנה"
title_en = "Software project manager"
what_he = "פותחים פרויקט תוכנה (תיקיית git) וג'ארביס מנהל אותו: מפרק את המטרה למשימות קטנות, נותן כל משימה לסוכן קוד נפרד (Claude Code, Codex, OpenCode) בשיחה קצרה משלו, מריץ משימות בלתי תלויות במקביל, ומעביר עבודה הלאה בהעברת מקל קצרה. אפשר לשאול על המצב, להוסיף או לשנות משימה, לבקש פירוט ולדבר עם הסוכן."
what_en = "You open a software project (a git folder) and JARVES manages it: it splits the goal into small tasks, gives each task to a separate coding agent (Claude Code, Codex, OpenCode) in its own short session, runs independent tasks in parallel and passes work on with a short handoff. You can ask for the status, add or change a task, ask for details and talk to the agent."

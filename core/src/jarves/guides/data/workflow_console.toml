order = 95
category = "system"
pages = []
features = []
aliases = ["תהליך פיתוח", "לוח סוכנים", "שאלות פיתוח", "workflow", "development console"]
links = ["agent_orchestrator"]
title_he = "מערכת העבודה והמעקב"
title_en = "Development workflow console"
what_he = "לוח מקומי חי של תוכנית הגרסאות, סוכנים, משימות וראיות. שאלות שמחכות לכם נשמרות, ועבודה עצמאית יכולה להמשיך. משגיח חיצוני מזהה סוכנים לא מעודכנים ומפעיל מחדש את שירות התצוגה."
what_en = "A local live view of version scope, workers, tasks and evidence. Owner questions remain pending while independent work continues. An external supervisor detects stale workers and restarts the web service."
expect_he = "תוכנית הגרסאות אינה הוכחת השלמה: צריך לקשר ראיות. תשובה לשאלת תכנון אינה אישור להפעלת כלי, שליחה או שחרור. עד לחיבור סוכנים אמיתיים מוצג שאין סוכנים מחוברים."
expect_en = "Scope is not completion evidence. Planning answers never approve tools, external sends or releases. Until real workers attach, the view explicitly shows no connected workers."
cost_he = "המעקב מקומי וללא מודל. סוכני קוד ממשיכים להשתמש במנגנוני המנוי, התקציב והאישור הקיימים."
cost_en = "Monitoring is local and model-free. Coding sessions retain the existing subscription, budget and approval controls."
privacy_he = "נתוני מצב ושאלות נשמרים בתיקיית המשתמש, מחוץ לריפו. הממשק דורש קישור פרטי ומאזין רק ב־127.0.0.1; אין גישה מהטלפון ללא חיבור מאובטח נוסף."
privacy_en = "State and questions stay in the user's private data directory, outside the repository. The UI requires a private link and binds only to 127.0.0.1; phone access requires a separate secured integration."

[[steps]]
he = "מהריפו: python core/tools/workflow_console.py supervise. לחלופין: jarvis workflow supervise. המשגיח ושירות התצוגה הם תהליכים נפרדים מה־Core."
en = "From the checkout: python core/tools/workflow_console.py supervise, or jarvis workflow supervise. The supervisor and web service are separate from the Core."
action = "command:jarvis workflow supervise"

[[steps]]
he = "פתחו את הקישור הפרטי עם jarvis workflow open. סמנו 'אני כאן' למענה מרוכז לשאלות, או 'להמשיך בלעדיי' לשמירת השאלות. שתיקה אינה אישור."
en = "Open the private link with jarvis workflow open. Select Present for interactive planning questions or Away to retain them. Silence is never approval."
action = "command:jarvis workflow open"

[[steps]]
he = "סנכרון קריאה בלבד מ־GitHub: jarvis workflow sync. שיוך סוכן קיים: jarvis workflow agent --agent bugs --lane bugs --session-id ID --auto-dispatch. הקצאה חיה עדיין עוברת דרך ה־Orchestrator הקיים."
en = "Read-only GitHub sync: jarvis workflow sync. Attach an existing session with jarvis workflow agent --agent bugs --lane bugs --session-id ID --auto-dispatch. Live assignment still uses the existing Orchestrator."
action = "command:jarvis workflow status"

[[steps]]
he = "מנהל מיזוגים קבוע שמגיב לאירועים, בלי תזמון: כשבקשת מיזוג ירוקה, אדומה, בקונפליקט או מוזגה, המנהל מעביר את האירוע לתת־הסוכן workflow-merger. ירוקה שאינה Tier R נכנסת לתור המיזוג; אדומה עוברת למתקן Sonnet; Tier R ממתינה לאישור Opus. עובד שסיים או ממתין ל־CI מקבל מיד את המשימה העצמאית הבאה, ושאלה אליכם נשמרת. כדי לעצור, בקשו מהמנהל להפסיק להעביר אירועים. התפקיד מתואר ב־OPERATING_MODEL."
en = "Standing event-driven merge steward, no schedule: when a PR turns green, red, conflicted or merged, the manager hands the event to the workflow-merger subagent. Green non-Tier-R PRs join the merge queue; red ones go to a Sonnet fixer; Tier R waits for Opus sign-off. A worker that finishes or waits on CI gets the next independent task at once, and owner questions persist. To stop it, ask the manager to stop handing it events. The role is defined in OPERATING_MODEL."
action = "command:jarvis workflow status"

[[steps]]
he = "שאלות: לכל שאלה יש אפשרויות כקלפים (בחירה אחת, או כמה כשהשאלה מאפשרת), האפשרות המומלצת ראשונה עם תג 'מומלץ', מה ישתנה בכל אפשרות, למה שואלים, כמה דקות זה ייקח, וברירת המחדל הבטוחה אם לא עונים. שום דבר לא מאושר מתוך שתיקה. שדה 'אחר' מוסיף הערה לבחירה. מנהל ששואל: jarvis workflow ask --task ID --title TEXT --choices JSON --why TEXT --recommendation TEXT --safe-default TEXT --minutes N (ו־--multi לבחירה מרובה)."
en = "Questions: each question shows its options as cards (one choice, or several when allowed), the recommended option first with a Recommended badge, what changes with each option, why it is asked, minutes needed, and the safe default if you do not answer. Nothing is approved by silence. The Other field adds a comment to the selection. A manager asks with: jarvis workflow ask --task ID --title TEXT --choices JSON --why TEXT --recommendation TEXT --safe-default TEXT --minutes N (add --multi for several choices)."
action = "command:jarvis workflow status"

[[steps]]
he = "שאל עוד: מתחת לכל שאלה (ובתיבה הכללית) כותבים שאלת המשך למנהל, למשל 'למה זה נחוץ?' או 'מה האפשרויות?'. היא נשמרת ומגיעה למנהל בסיום הצעד הנוכחי שלו; התשובה שלו מופיעה כשרשור מתחת לשאלה. השאלה נשארת פתוחה עד שתענו. טיוטות נשמרות גם אחרי רענון. CLI: jarvis workflow ask-more --id QUESTION --note TEXT (או --task ID לשאלה כללית); המנהל עונה עם jarvis workflow reply --id FOLLOWUP --answer TEXT."
en = "Ask more: under each question (and in the general box) write a follow-up for the manager, such as 'why do you need this?' or 'what are the options?'. It is saved and reaches the manager when its current step ends; its reply shows as a thread under the question. The question stays open until you answer. Drafts survive a page refresh. CLI: jarvis workflow ask-more --id QUESTION --note TEXT (or --task ID for a general one); the manager replies with jarvis workflow reply --id FOLLOWUP --answer TEXT."
action = "command:jarvis workflow status"

[[problems]]
he = "שאלת המשך נשארת 'נשמר, יימסר למנהל'"
en = "A follow-up stays 'saved, will reach the manager'"
fix_he = "המסירה קורית כשהמנהל מסיים צעד (Stop hook). מנהל שעומד בלי עבודה מקבל אותה בצעד הבא שלו: כתבו לו משהו בחלון של Claude או המתינו להודעת סוכן. בדקו שה־hooks מותקנים (jarvis workflow bootstrap). מנהל שנסגר מקבל את השאלות הפתוחות כשהוא עולה מחדש."
fix_en = "Delivery happens when the manager ends a step (its Stop hook). An idle manager receives it on its next step: type anything in its Claude window or wait for a worker notification. Check that the hooks are installed (jarvis workflow bootstrap). A restarted manager gets open follow-ups at session start."

[[problems]]
he = "יש משימות אבל אף סוכן לא עובד"
en = "Tasks exist but no worker is running"
fix_he = "בדקו את ההתראה: משימה יכולה לחכות לכם, לתלות, למשאב תפוס או למיפוי מאושר. חברו סוכן אמיתי, דווחו heartbeat ואל תסמנו משימת מקור כמאושרת לביצוע לפני שקריטריוני הקבלה וההרשאה שלה ברורים."
fix_en = "Read the alert: work may need an owner answer, dependency, reserved resource or scope reconciliation. Attach a real worker and report a heartbeat. Do not authorise imported scope until its acceptance and execution authority are clear."

[parity.features]
# Standalone development tooling; no assistant runtime feature switch or tool group.

[[steps]]
he = "לחצו על מונה בתמונת המצב כדי להגיע לרשימה המתאימה. בתוכנית בוחרים גרסה ומצב, מחפשים ופותחים סעיף כדי לראות תנאי קבלה וראיות. גרסאות נפתחות לפי הצורך; בנייד כל ארבע הלשוניות זמינות בתחתית. CLI: jarvis workflow status מציג את אותן משימות וראיות."
en = "Select an overview counter to open its matching list. In the roadmap choose a version and state, search, and open a task for acceptance and evidence. Expand versions as needed; all four navigation tabs are available on narrow screens. CLI: jarvis workflow status exposes the same tasks and evidence."
action = "command:jarvis workflow status"

[[steps]]
he = "פתחו פעולה כדי לראות סוכן, זמן, כלי וקלט או תוצאה שנשמרו. הפרטים הטכניים מקופלים. בחרו טווח מדויק כדי לנתח עבר; זמן הסיום כולל את השנייה שנבחרה. עדכון חי חוזר לטווח יחסי. CLI: jarvis workflow trace --since SECONDS --until SECONDS, בזמני Unix."
en = "Open an action for its actor, time, tool and captured input/output. Raw event details are collapsed. Choose an exact time range to inspect history; the selected end second is inclusive. Live mode returns to a relative range. CLI: jarvis workflow trace --since SECONDS --until SECONDS, using Unix timestamps."
action = "command:jarvis workflow trace"

[[steps]]
he = "בפעולות והיסטוריה מסננים לפי סוכן, משימה ותקופה ופותחים קריאת כלי. ברירת המחדל היא metadata; פרטים מסוננים מופעלים במפורש ורק מכאן והלאה. CLI: jarvis workflow trace, ולפרטים jarvis workflow trace --capture details. היסטוריה חסרה וכיסוי ספק חלקי אינם משוחזרים."
en = "Action history filters by agent, task and period and opens individual calls. Metadata is default; sanitized details are explicitly enabled for future events. CLI: jarvis workflow trace, or jarvis workflow trace --capture details. Missing history and partial provider coverage are not reconstructed."
action = "command:jarvis workflow trace"

[[steps]]
he = "לניתוח יזום לחצו הכן ל־/retro, או jarvis workflow retro --agent ID. נוצר קובץ מקומי ובקשה להעתקה לסוכן שבו ה־skill מותקן. לא מופעל מודל ולא משתנים כללים; בוחרים בנפרד אילו הצעות ליישם."
en = "For an explicit retrospective choose Prepare /retro, or jarvis workflow retro --agent ID. This creates local evidence and a prompt for an agent with the skill installed. It starts no model and edits no rules; select proposed changes separately."
action = "command:jarvis workflow trace"

[[steps]]
he = "מנוע אוטומטי (בטא, כבוי כברירת מחדל): קובץ מדיניות autopilot.json בתיקיית העבודה. jarvis workflow autopilot status מציג מדיניות ורשימה משותפת של באגים פתוחים ובקשות מיזוג. שינוי: jarvis workflow autopilot set KEY VALUE, למשל authorized_versions '[\"V4.5.1\",\"V5\"]'. כפתור חירום: jarvis workflow autopilot stop (וחזרה עם start). jarvis workflow autopilot once מייבא פעם אחת. הלשונית 'באגים, מיזוגים ומדיניות' בלוח מציגה את אותו מידע."
en = "Autopilot (beta, OFF by default): policy file autopilot.json in the workflow directory. jarvis workflow autopilot status shows the policy and one list of open bugs and pull requests. Change it with jarvis workflow autopilot set KEY VALUE, for example authorized_versions '[\"V4.5.1\",\"V5\"]'. Kill switch: jarvis workflow autopilot stop (resume with start). jarvis workflow autopilot once imports one time. The Bugs, merges and policy tab in the console shows the same data."
action = "command:jarvis workflow autopilot status"

[[steps]]
he = "מה המנוע מייבא: כל באג פתוח עם תווית bug, P0-P3 או showstopper (לא רק bug), וכל סעיף פתוח עם תווית גרסה (4.5.1, v5, v6, v7) שאינו בתוכנית. באגים נבחרים לפי עדיפות, פיצ'רים לפי סדר הגרסאות. סעיף מגרסה שלא אושרה נשאר בלתי ניתן להרצה. בשלב הזה המנוע אינו מפעיל סוכנים, ממזג או מתייג."
en = "What it imports: every open issue labelled bug, P0-P3 or showstopper (not only bug) and every open issue with a version label (4.5.1, v5, v6, v7) that the plan lacks. Bugs go by priority, features by version order. Work from a version that is not authorized stays non-runnable. At this stage it does not start workers, merge or tag."
action = "command:jarvis workflow autopilot status"

[[problems]]
he = "תווית באג חדשה לא מופיעה ברשימה"
en = "A new bug label does not show in the list"
fix_he = "הרשימה מתעדכנת בסנכרון הקריאה מ־GitHub (עד חצי שעה): הריצו jarvis workflow sync ואז jarvis workflow autopilot once. אם קובץ המדיניות פגום המנוע נשאר כבוי ומציג שגיאה."
fix_en = "The list refreshes on the read-only GitHub sync (up to 30 minutes): run jarvis workflow sync, then jarvis workflow autopilot once. If the policy file is invalid the autopilot stays off and shows the error."

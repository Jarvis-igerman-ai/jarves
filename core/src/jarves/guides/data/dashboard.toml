[[steps]]
he = "אמרו \"תפתח את לוח הבקרה\", או הקלידו jarvis dashboard."
en = "Say \"open the dashboard\", or type jarvis dashboard."
action = "command:jarvis dashboard"
check = "enabled:dashboard"

[[steps]]
he = "אפשר לשאול \"באיזה דף אני?\" ו-JARVES יזהה את הדף הפתוח (רק שם הדף, לא התוכן). אפשר לבקש דף מסוים: \"תפתח את דף הזיכרון\". JARVES פותח אותו ומסביר מה אפשר לעשות שם ואיך. הוא לא לוחץ במקומכם: כל שינוי הוא הלחיצה שלכם, ופעולות רגישות (אישורים, מתגים, חיבורים, גיבוי) ממשיכות לבקש אישור."
en = "Ask for a specific page: \"open the Memory page\". JARVES opens it and explains what you can do there and how. Ask \"what page is this?\" and it names the page you have open (only the page name is shared, never what is on it). It never clicks for you: every change is your own click, and sensitive actions (approvals, switches, connections, backups) still ask for approval."
action = "command:jarvis dashboard --page #/costs"
check = "enabled:dashboard"

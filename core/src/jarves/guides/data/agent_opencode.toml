order = 73
category = "system"
pages = ["agents"]
features = ["agent_opencode"]
aliases = ["אופןקוד", "opencode", "open code", "opencode sessions"]
links = ["agent_orchestrator", "privacy"]
title_he = "OpenCode (צפייה והפעלה באישור)"
title_en = "OpenCode (view and start with approval)"
what_he = "ג'ארביס יכול להסתכל על סשני OpenCode שרצים אצלכם דרך השרת המקומי שלו: אילו סשנים יש, מה המצב שלהם ואילו אירועים קרו לאחרונה. הוא יכול גם להפעיל סשן בעץ עבודה נפרד של git, לשלוח לו הוראה ולעצור אותו, אבל רק אחרי שאישרתם כל פעולה כזו במסך (האישור מציג את השרת, המאגר, הענף והסשן). הוא לא נוגע בסשנים שהפעלתם בעצמכם. עץ העבודה הנפרד מפריד רק בין ענפים: אילו קבצים OpenCode עצמו רשאי לקרוא או לכתוב נקבע בהגדרות ההרשאות של OpenCode, כמו ב-Claude וב-Codex."
what_en = "JARVES can look at the OpenCode sessions on this computer through OpenCode's local server: which sessions exist, their state and recent events. It can also start a session in its own git worktree, send it a prompt and stop it, but only after you approve each of those on screen (the approval shows the server, repo, branch and session). It never touches sessions you started yourself. The separate worktree keeps branches apart only: which files OpenCode itself may read or write is decided by OpenCode's own permission settings, as with Claude and Codex."
say = [
  ["אילו סשנים של OpenCode פועלים?", "Which OpenCode sessions are running?"],
  ["תראה לי את הסשנים של OpenCode", "Show me the OpenCode sessions"],
]
expect_he = "רשימה קצרה של סשנים עם מצב (עובד או ממתין). סשנים מתיקיות מותרות מופיעים גם ברשימת סוכני הקוד, לצפייה בלבד."
expect_en = "A short list of sessions with their state (working or idle). Sessions in allow-listed folders also show in the coding-agents list, view only."
cost_he = "צפייה בסשנים עולה כלום. הפעלת סשן משתמשת במודל ש-OpenCode מריץ: ברירת המחדל היא רק מודל חינמי או מקומי. מודל בתשלום, לא מוכר, או ברירת המחדל של OpenCode (שהמחיר שלה לא ידוע לג'ארביס) נחסמים עד שתאשרו agents.opencode_allow_paid. מכסת העלות היומית של סוכני הקוד (agents.max_cost_usd_per_day) ממשיכה לחול."
cost_en = "Viewing sessions costs nothing. Starting a session uses the model OpenCode runs: by default only a free or local model is allowed. A paid model, an unknown model, or OpenCode's own default (whose price JARVES cannot see) is blocked until you allow agents.opencode_allow_paid. The daily coding-agent cost cap (agents.max_cost_usd_per_day) still applies."
privacy_he = "הכתובת חייבת להיות מקומית (127.0.0.1) והסיסמה נלקחת ממשתנה סביבה, לא נשמרת בקובץ ולא נרשמת ביומן. כותרות סשן ואירועים הם טקסט לא מהימן: מנוקים, ולא מפעילים שום פעולה."
privacy_en = "The address must be local (127.0.0.1) and the password comes from an environment variable: never saved in a file, never logged. Session titles and events are untrusted text: cleaned, and they never trigger an action."

[[steps]]
he = "בטרמינל שלכם הפעילו את שרת OpenCode עם סיסמה: הגדירו OPENCODE_SERVER_PASSWORD והריצו opencode serve (כתובת ברירת מחדל 127.0.0.1:4096). ג'ארביס לא מתקין ולא מפעיל אותו."
en = "In your own terminal start the OpenCode server with a password: set OPENCODE_SERVER_PASSWORD and run opencode serve (default 127.0.0.1:4096). JARVES does not install or start it."

[[steps]]
he = "הגדירו את אותו משתנה OPENCODE_SERVER_PASSWORD גם לג'ארביס (אפשר לשנות את שם המשתנה ב-agents.opencode_password_env)."
en = "Set the same OPENCODE_SERVER_PASSWORD variable for JARVES too (the variable name can be changed in agents.opencode_password_env)."

[[steps]]
he = "הדליקו את המתג \"OpenCode (צפייה והפעלה באישור)\". הוא כבוי כברירת מחדל."
en = "Switch on \"OpenCode (view and start with approval)\". It is off by default."
action = "feature_on:agent_opencode"
check = "enabled:agent_opencode"

[[steps]]
he = "בדקו את החיבור: jarvis agents opencode status, ואז jarvis agents opencode sessions או events."
en = "Check the connection: jarvis agents opencode status, then jarvis agents opencode sessions or events."
action = "command:jarvis agents opencode status"

[[steps]]
he = "בחירת מודל: הגדירו agents.opencode_model כ-ספק/מודל (למשל openrouter/free). ג'ארביס מסווג אותו לפי טבלת המודלים (חינמי, מקומי, בתשלום או לא מוכר) ושולח אותו ל-OpenCode. הסיווג והעלות מופיעים בכל חלון אישור, ו-\"jarvis agents doctor\" מציג שורת מודל."
en = "Choose a model: set agents.opencode_model to provider/model (for example openrouter/free). JARVES classifies it from its model table (free, local, paid or unknown) and sends it to OpenCode. The class and cost show in every approval popup, and jarvis agents doctor shows a model row."
action = "command:jarvis agents doctor"

[[steps]]
he = "להפעלת סשן: jarvis agents start opencode PROJECT \"המשימה\". אשרו במסך (השרת, המאגר, הענף והסשן מוצגים). כל הוראה נוספת: jarvis agents tell SESSION \"הטקסט\", וגם היא באישור. לעצירה: jarvis agents stop SESSION."
en = "To start a session: jarvis agents start opencode PROJECT \"the task\". Approve on screen (server, repo, branch and session are shown). Each later prompt: jarvis agents tell SESSION \"the text\", also with approval. To stop: jarvis agents stop SESSION."

[[steps]]
he = "לכיבוי: כבו את המתג (jarvis features off agent_opencode). ג'ארביס מפסיק לפנות לשרת מיד."
en = "To turn it off: switch it off (jarvis features off agent_opencode). JARVES stops contacting the server at once."

[[problems]]
he = "MODEL_NOT_ALLOWED: המודל לא מאושר"
en = "MODEL_NOT_ALLOWED: the model is not allowed"
fix_he = "המודל אינו חינמי או מקומי, או שהמחיר שלו לא ידוע (גם ברירת המחדל של OpenCode נחשבת כך). הגדירו agents.opencode_model למודל חינמי, או הדליקו agents.opencode_allow_paid אם אתם מקבלים עלות."
fix_en = "The model is not free or local, or its price is unknown (OpenCode's own default counts as unknown). Set agents.opencode_model to a free model, or turn on agents.opencode_allow_paid if you accept a cost."

[[problems]]
he = "AUTH_REQUIRED: צריך סיסמה"
en = "AUTH_REQUIRED: a password is needed"
fix_he = "משתנה הסביבה OPENCODE_SERVER_PASSWORD לא מוגדר לג'ארביס, או שהסיסמה שגויה. הגדירו אותה זהה לשרת והפעילו את ג'ארביס מחדש."
fix_en = "The OPENCODE_SERVER_PASSWORD variable is not set for JARVES, or the password is wrong. Set it equal to the server's and restart JARVES."

[[problems]]
he = "NOT_LOOPBACK: הכתובת לא מקומית"
en = "NOT_LOOPBACK: the address is not local"
fix_he = "agents.opencode_url חייב להיות http://127.0.0.1:PORT (או localhost). כתובת ברשת או באינטרנט נדחית בכוונה."
fix_en = "agents.opencode_url must be http://127.0.0.1:PORT (or localhost). A LAN or internet address is refused on purpose."

[[problems]]
he = "PROVIDER_MISSING: אין שרת"
en = "PROVIDER_MISSING: no server"
fix_he = "שרת OpenCode לא רץ על הכתובת. הפעילו אותו בעצמכם (opencode serve) ובדקו שהפורט זהה."
fix_en = "No OpenCode server answers at that address. Start it yourself (opencode serve) and check the port matches."

[[problems]]
he = "SERVER_ERROR: תשובה לא צפויה"
en = "SERVER_ERROR: unexpected answer"
fix_he = "השרת ענה בשגיאה או בפורמט שלא מוכר, כנראה גרסה אחרת של OpenCode. עדכנו את OpenCode והריצו jarvis agents opencode status."
fix_en = "The server answered with an error or an unknown shape, probably another OpenCode version. Update OpenCode and run jarvis agents opencode status."

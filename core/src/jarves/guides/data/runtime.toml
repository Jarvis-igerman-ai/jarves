order = 60
category = "system"
pages = ["runtime"]
features = ["background_core", "display_control", "tray_icon", "autostart"]
aliases = ["רקע", "מגש", "הפעלה אוטומטית", "תופיע", "תיעלם", "tray", "autostart", "start at login", "show yourself", "hide yourself", "background"]
links = ["appearance", "updates"]
title_he = "פועל ברקע, סמל במגש והפעלה עם המחשב"
title_en = "Runs in the background, tray icon, start with Windows"
what_he = "ג'ארביס ממשיך לשמוע \"היי ג'ארביס\" גם כשהחלון סגור, יש לו סמל ליד השעון, ואפשר שיעלה לבד עם המחשב."
what_en = "JARVES keeps hearing \"Hey Jarvis\" with the window closed, has an icon by the clock, and can start with the computer."
say = [["תופיע", "Show yourself"], ["תיעלם", "Hide yourself"]]
expect_he = "סגירת החלון רק מסתירה אותו. בפעם הראשונה תופיע הודעה חד-פעמית \"ג'ארביס עדיין פועל במגש\". \"Quit\" בתפריט של הסמל עוצר אותו באמת."
expect_en = "Closing the window only hides him. The first time, a one-time notice says JARVES is still running in the tray. Quit in the tray icon's menu really stops him."
cost_he = "חינם. מחכה ל\"היי ג'ארביס\" בלי חיבור לענן."
cost_en = "Free. Waiting for \"Hey Jarvis\" uses no cloud connection."
privacy_he = "בקשו להשתיק את המיקרופון כדי להפסיק להקשיב. לביטול השתקה השתמשו בכפתור המיקרופון הגלוי בחלון, בסמל במגש או בפקודה jarvis mic unmute. מיקרופון מושתק לא יכול לשמוע פקודת ביטול השתקה."
privacy_en = "Ask to mute the microphone to stop listening. Unmute using the visible microphone button in the window, the tray icon, or jarvis mic unmute. A muted microphone cannot hear an unmute command."

[[steps]]
he = "ג'ארביס עצור? פתחו את לוח הבקרה (jarvis dashboard) ולחצו על \"הפעלת JARVES\" בראש עמוד הבית, או על הכפתור בשורת המצב. המצב מוצג: עצור, מתחיל… או פועל. אחרי שעלה מופיעים השתקת מיקרופון, \"דברו\" והצגת החלון. הכפתור מפעיל אותו ברקע בדיוק כמו jarvis start, ורק מהמחשב עצמו (לא מטלפון). אם ההפעלה נכשלת מוצגת השגיאה האמיתית."
en = "JARVES stopped? Open the dashboard (jarvis dashboard) and press Start JARVES at the top of the Home page, or the button in the status bar. The state shows Stopped, Starting... or Running. Once it is up, the mute microphone, Talk and Show window controls appear. The button starts it in the background exactly like jarvis start, and only from this computer (never from a phone). If starting fails, the real error is shown."
action = "open:#/runtime"

[[steps]]
he = "בשורת הפקודה: jarvis mic status, jarvis mic mute או jarvis mic unmute. המצב נשמר גם אחרי הפעלה מחדש. כשהליבה עצורה נשמרת בחירה להפעלה הבאה, בלי לטעון שהמיקרופון פעיל כרגע."
en = "From the command line: jarvis mic status, jarvis mic mute, or jarvis mic unmute. The choice survives restart. With Core stopped, the preference is saved for next start and is not live-verified."

[[steps]]
he = "ודאו שהמתג \"ממשיך לפעול ברקע\" דולק."
en = "Make sure Keep running in the background is on."
action = "feature_on:background_core"
check = "enabled:background_core"

[[steps]]
he = "חפשו את הסמל של ג'ארביס ליד השעון (אולי מתחת לחץ ^)."
en = "Look for JARVES's icon by the clock (maybe under the ^ arrow)."
check = "available:tray_icon"

[[steps]]
he = "רוצים שיעלה לבד כשנכנסים למחשב? הדליקו \"הפעלה עם הכניסה למחשב\" בעמוד השליטה (Controls)."
en = "Want him to start when you log in? Turn on Start at login on the Controls page."
action = "open:#/runtime"

[[problems]]
he = "אין סמל במגש"
en = "No tray icon"
fix_he = "הסמל צריך את החבילה tray (uv sync --extra tray). אחרי התקנה הפעילו מחדש."
fix_en = "The icon needs the tray extra (uv sync --extra tray). Restart after installing."

[[problems]]
he = "הסטטוס אומר \"הפנים מוסתרות: מוצגות לפי בקשה\""
en = "Status says \"face hidden: shown on request\""
fix_he = "זה תקין: כשהחלון מוסתר (jarvis start ברקע) אין שגיאה והליבה נשארת ready. כדי לפתוח אותו הריצו jarvis show, או השתמשו בסמל במגש / בלוח הבקרה."
fix_en = "That is normal: while the window is hidden (jarvis start in the background) it is not an error and the Core stays ready. Open it with jarvis show, the tray icon or the dashboard."

[[problems]]
he = "jarvis show נכשל, או שהחלון נפתח ולא מתחבר"
en = "jarvis show fails, or the window opens but never connects"
fix_he = "זו שגיאה אמיתית והיא מוצגת במפורש. אם כתוב ש-Godot לא מותקן, התקינו Godot 4 או הגדירו GODOT_EXE. אפשר גם להפעיל ידנית את godot\\run_face.cmd. להסבר מפורט: jarvis diag."
fix_en = "This is a real error and is shown loudly. If it says Godot is not installed, install Godot 4 or set GODOT_EXE. You can also start godot\\run_face.cmd by hand. For details run: jarvis diag."

[[problems]]
he = "לחצתי \"הפעלת JARVES\" וזה נשאר \"מתחיל…\" או נכשל"
en = "I pressed Start JARVES and it stays Starting... or fails"
fix_he = "אחרי 60 שניות ללא מענה מוצגת הודעה. הריצו jarvis start בטרמינל ואז jarvis logs -n 80 כדי לראות את הסיבה. ג'ארביס כבר רץ? אז הכפתור לא מופיע."
fix_en = "After 60 seconds without an answer a message is shown. Run jarvis start in a terminal, then jarvis logs -n 80 to see why. If JARVES is already running the button does not appear."

order = 60
category = "everyday"
features = ["drive_mode"]
suggest = false
aliases = ["נהיגה", "מצב נהיגה", "ברכב", "drive mode", "driving", "car", "when stopped"]
title_he = "מצב נהיגה"
title_en = "Drive mode"
what_he = "מדיניות בטיחות לנהיגה: תשובות קצרות, שיחות והודעות רק לאנשי קשר מוכרים עם אישור קולי קצר, וכל מה שדורש מסך ממתין ברשימה \"כשתעצרו\". חירום וניתוק אף פעם לא נחסמים. כבוי כברירת מחדל."
what_en = "A safety policy for driving: short answers, calls and messages only to known contacts with one short spoken confirmation, and anything that needs a screen waits in a \"when you stop\" list. Emergencies and hang-up are never blocked. Off by default."
say = [["מצב נהיגה", "Drive mode"], ["עצרתי", "I have stopped"]]
expect_he = "כשהמצב דלוק, פעולות לא בטוחות נשמרות ברשימה ולא מבוצעות. כשאתם עוצרים, jarvis drive stopped מציג מה חיכה. שום דבר לא מבוצע אוטומטית אחרי העצירה, ואישורים נשארים כמו תמיד."
expect_en = "While it is on, unsafe actions are saved to a list and not run. When you stop, jarvis drive stopped shows what waited. Nothing runs by itself after you stop, and approvals stay as always."
test_he = "הריצו  jarvis drive status  ובדקו שכתוב \"drive mode: off\", ואז jarvis drive on ו-jarvis drive off."
test_en = "Run  jarvis drive status  and check it says \"drive mode: off\", then jarvis drive on and jarvis drive off."
cost_he = "חינם. הכול מקומי."
cost_en = "Free. All local."
privacy_he = "אין גישה למיקום ואין שליטה ברכב. הרשימה נשמרת רק במחשב הזה, עד 20 פריטים, ונמחקת אחרי יום. רק אתם מפעילים ומכבים."
privacy_en = "No location access and no vehicle control. The list stays on this PC, up to 20 items, and expires after a day. Only you switch it on or off."

[parity.features]
drive_mode = "drive"

[[steps]]
he = "הפעילו את \"מצב נהיגה\". הוא כבוי כברירת מחדל. בשורת הפקודה: jarvis drive on."
en = "Turn on \"Drive mode\". It is off by default. From the command line: jarvis drive on."
action = "feature_on:drive_mode"
check = "enabled:drive_mode"

[[steps]]
he = "בנהיגה: שאלות קצרות, שעה, מזג אוויר, טיימר, מוזיקה וקישור ניווט מותרים. שיחה או הודעה רק לאיש קשר מוכר ועם אישור קולי אחד."
en = "While driving: short questions, time, weather, timers, music and a navigation link are allowed. A call or message only to a known contact with one spoken confirmation."

[[steps]]
he = "מצב נהיגה אף פעם לא מאשר בעצמו: כל שאלת אישור רגילה עדיין נשאלת. הודעה מוכנה מראש נשלחת רק כשאמרתם אותה בקול, לאיש קשר ששמרתם. בקשה שבאה מתוך מייל, אתר או הודעה, וכל דבר שדורש מסך, נשמרת ברשימה ולא מבוצעת. רק אתם מכבים את המצב: JARVES לא יכול לכבות אותו בעצמו."
en = "Drive mode never approves anything itself: every normal approval question is still asked. A message is sent only when you said it out loud, to a contact you saved. A request that came from a mail, a web page or a message, and anything that needs a screen, is saved to the list and not run. Only you turn the mode off: JARVES cannot turn it off by itself."

[[steps]]
he = "כשעצרתם: jarvis drive stopped מציג את הרשימה. כדי לכבות: jarvis drive off. למחיקה: jarvis drive clear."
en = "When you have stopped: jarvis drive stopped shows the list. To turn off: jarvis drive off. To empty it: jarvis drive clear."

[[problems]]
he = "ביקשתי משהו והוא אמר שזה נשמר לאחר העצירה"
en = "I asked for something and it said it is saved for when I stop"
fix_he = "זה בכוונה בזמן נהיגה. אחרי שעצרתם הריצו jarvis drive stopped, או כבו את המצב עם jarvis drive off."
fix_en = "That is on purpose while driving. After you stop run jarvis drive stopped, or turn the mode off with jarvis drive off."

[[problems]]
he = "הוא לא מתקשר לשם שאמרתי"
en = "It will not call the name I said"
fix_he = "בנהיגה מתקשרים רק לאיש קשר מוכר. הוסיפו אותו קודם כשאתם עומדים."
fix_en = "While driving it only calls a known contact. Add the contact first while parked."

[[problems]]
he = "אמרתי לו לכבות את מצב הנהיגה והוא סירב"
en = "I told it to turn drive mode off and it refused"
fix_he = "בכוונה: הבינה המלאכותית לא יכולה לכבות את מצב הנהיגה בעצמה. הריצו jarvis drive off, או כבו את \"מצב נהיגה\" בלוח הבקרה."
fix_en = "On purpose: the AI cannot turn drive mode off by itself. Run jarvis drive off, or switch \"Drive mode\" off on the dashboard."

[[problems]]
he = "הוא אמר שבדיקת מצב הנהיגה נכשלה"
en = "It said the drive-mode check failed"
fix_he = "כשהבדיקה נכשלת הוא לא מבצע פעולות בכלל, ליתר ביטחון (ניתוק ועצירה עדיין עובדים). הריצו jarvis drive status, ואם זה חוזר הריצו jarvis selftest ושלחו את התוצאה."
fix_en = "When the check fails it does no actions at all, to stay safe (hang-up and stop still work). Run jarvis drive status, and if it happens again run jarvis selftest and send the result."

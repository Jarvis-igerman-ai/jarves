order = 40
category = "system"
pages = ["bugs"]
features = ["issue_reports"]
aliases = ["דיווחי תקלות", "תקלות", "דיווח למפתח", "bug report", "bug reports", "issues", "report a problem", "what issues do you have", "known problems"]
links = ["self_tests", "health", "self_check"]
error_codes = ["ISSUE_NEW", "ISSUE_REGRESSED", "ISSUE_FIXED_IN", "ISSUE_STATUS", "ISSUE_REPORTED", "ISSUE_REPORT_SAVED", "ISSUE_REPORT_FAILED", "ISSUE_REPORT_DENIED", "ISSUES_SAVE_FAILED"]
title_he = "דיווחי תקלות"
title_en = "Bug reports"
what_he = "ג'ארביס אוסף לרשימה אחת את הבעיות שהוא מוצא בעצמו: בדיקה עצמית ובדיקת מהירות, ממצאי האבחון, כלים שנכשלים שוב ושוב, קריסות ושגיאות בלוח הבקרה. כל בעיה מופיעה פעם אחת עם חומרה (P1 עד P3), כמה פעמים נראתה ומתי, ובלי תוכן. אפשר לדווח עליה למפתח כדי שהגרסה הבאה תתקן אותה."
what_en = "JARVES collects the problems he finds in himself into one list: the self-test and the speed test, the diagnostics findings, tools that keep failing, crashes and dashboard errors. Each problem appears once with a severity (P1 to P3), how often and when it was seen, and no content. You can report it to the developer so the next version fixes it."
say = [["אילו תקלות יש לך?", "What issues do you have?"], ["יש בעיות שצריך לדווח עליהן?", "Is there anything to report?"]]
expect_he = "משפט אחד: כמה תקלות פתוחות, כמה חמורות והראשונה. הפרטים בעמוד 'דיווחי תקלות', ומספר התקלות הפתוחות מופיע בכותרת."
expect_en = "One sentence: how many issues are open, how many are serious and the first. The details are on the Bug reports page, and the open count shows in the header."
test = "feature"
test_he = "הבדיקה רק מוודאת שהרכיב מותקן. אפשר לבדוק את הרשימה עם jarvis issues list."
test_en = "The check only sees that the component is installed. You can look at the list with jarvis issues list."
cost_he = "חינם. הרשימה מקומית. רק שליחת דיווח (אחרי אישור) פונה לאינטרנט, לפרויקט Jarvis-igerman-ai/jarves ב-GitHub."
cost_en = "Free. The list is local. Only sending a report (after your approval) uses the internet, to the Jarvis-igerman-ai/jarves project on GitHub."
privacy_he = "הרשימה נשמרת בקובץ מקומי (issues_registry.json) ומכילה רק קודים, מספרים, זמנים, גרסאות ושמות פונקציות. בלי שיחות, שמות, כתובות, נתיבים או מפתחות. שום דבר לא נשלח בלי שאישרתם את הטקסט המדויק שמוצג לכם. בלי אסימון GitHub הדיווח נשמר בקובץ לצירוף ידני."
privacy_en = "The list is kept in one local file (issues_registry.json) and holds only codes, numbers, times, versions and function names. No conversations, names, addresses, paths or keys. Nothing is sent unless you approve the exact text shown to you. Without a GitHub token the report is saved to a file you can attach yourself."

[[steps]]
he = "פתחו את העמוד 'דיווחי תקלות'. אפשר לסנן לפי מצב, חומרה ותחום, ולפתוח כל תקלה לפרטים."
en = "Open the Bug reports page. Filter by status, severity and area, and open any issue for the details."
action = "open:#/bugs"

[[steps]]
he = "בתקלה לחצו 'דווחו למפתח': יוצג הטקסט המדויק שיישלח, ורק אחרי אישור בחלון האישורים הוא נשלח כתקלה בפרויקט עם התווית from-diagnostics."
en = "On an issue press Report: the exact text that would be sent is shown, and only after you approve it in the approvals popup is it filed on the project with the label from-diagnostics."
action = "open:#/bugs"

[[steps]]
he = "מהטרמינל: רשימה, פרטים, דיווח והתעלמות. jarvis issues list מציג רק תקלות פתוחות; אפשר להוסיף --all, --info (מצבים צפויים של המחשב הזה), --since 7d ו---json."
en = "From the terminal: list, details, report and ignore. jarvis issues list shows open bugs only; add --all, --info (expected states of this PC), --since 7d and --json."
action = "command:jarvis issues list"

[[steps]]
he = "מצב שצפוי בהפעלה הזאת (אין פנים של Godot, אין מצלמה, Pear Desktop לא פועל, גוגל לא מחובר) מופיע בלשונית 'מידע' ולא נספר בכותרת. לחצו 'התעלם מזה במחשב הזה' כדי להסתיר אותו. אפשר לסמן גם תקלה כתוקנה: jarvis issues fixed ID --in 4.0.1.300 --note 'הערה קצרה'."
en = "A state that is expected for how JARVES is run here (no Godot face, no camera, Pear Desktop not running, Google not connected) shows under Information and is not counted in the header. Press Ignore this on this PC to hide it. You can also mark a bug fixed: jarvis issues fixed ID --in 4.0.1.300 --note 'short note'."
action = "open:#/bugs"

[[steps]]
he = "לשמירה בקובץ: jarvis issues export --all --out issues.json כותב UTF-8 תקין (בלי BOM, גם כשהמסוף בקידוד של Windows). --format text נותן גרסה לקריאה."
en = "To save them to a file: jarvis issues export --all --out issues.json writes real UTF-8 (no BOM, whatever the Windows console code page). --format text gives a readable version."
action = "command:jarvis issues export --all --out issues.json"

[[problems]]
he = "הדיווח נשמר בקובץ ולא נשלח"
en = "The report was saved to a file, not sent"
fix_he = "אין במחשב אסימון GitHub (משתנה הסביבה GH_TOKEN או כניסה ב-gh). צרפו את הקובץ מהתיקייה issue_reports לתקלה חדשה ב-github.com/Jarvis-igerman-ai/jarves עם התווית from-diagnostics."
fix_en = "There is no GitHub token on this computer (the GH_TOKEN environment variable or a gh login). Attach the file from the issue_reports folder to a new issue at github.com/Jarvis-igerman-ai/jarves with the label from-diagnostics."

[[problems]]
he = "תקלה סומנה כתוקנה בגרסה חדשה"
en = "An issue was marked fixed in a new version"
fix_he = "הגרסה שעודכנה מציינת את התקלה בשורת Fixes ביומן השינויים. אם היא חוזרת בגרסה הזאת או מאוחרת יותר, היא נפתחת מחדש אוטומטית."
fix_en = "The version you updated to lists the issue on a Fixes line of its changelog. If it comes back in that version or a later one, it is reopened automatically."

[[problems]]
he = "תקלה נסגרה לבד: 'לא נראתה מאז גרסה ...'"
en = "An issue closed by itself: 'not seen since version ...'"
fix_he = "אחרי עדכון, תקלה שלא חזרה במשך שלושה ימים (או שיומן השינויים מציין אותה בשורת Fixes) נסגרת עם ההיסטוריה שלה. אם היא חוזרת, היא נפתחת מחדש."
fix_en = "After an update, an issue that did not come back for three days (or that the changelog lists on a Fixes line) is closed and keeps its history. If it comes back it reopens."

[[problems]]
he = "הרשימה מלאה בשורות כמו 'גרסה חדשה' או 'המצלמה לא זמינה'"
en = "The list is full of lines like 'a new version was seen' or 'the camera was not available'"
fix_he = "אלה מצבים צפויים ולא תקלות. הם מופיעים תחת 'מידע', לא נספרים בכותרת, ואפשר להתעלם מהם במחשב הזה בלחיצה אחת."
fix_en = "These are expected states, not bugs. They appear under Information, are not counted in the header and can be ignored on this PC with one click."

[[problems]]
he = "בכותרת כתוב 'דיווחי תקלות: 26' במסגרת אדומה ולא ברור מה זה"
en = "The top bar says 'Bug reports: 26' with a red outline and it is not clear what it is"
fix_he = "לוחצים על המונה: נפתח הסבר במילים פשוטות (אלה כרטיסי אבחון מקומיים, שום דבר לא נשלח) עם 'סמן הכל כנראה'. אדום רק לכרטיסים חדשים וחמורים (P1/P2) שעוד לא נראו. כרטיס קל (P3) שלא חזר 14 יום נסגר לבד, וחוזר אם התקלה חוזרת; כרטיס P1/P2 נשאר עד תיקון או סגירה על ידך. ניתוק שיחה קולית אחרי זמן שקט ו-'Pear Desktop לא פועל' הם מידע, לא תקלות."
fix_en = "Click the counter: a plain-words explanation opens (these are local self-diagnostic tickets, nothing is sent) with 'Mark all as seen'. It is red only for NEW serious (P1/P2) tickets you have not seen. A minor (P3) ticket that did not recur for 14 days closes by itself and reopens if the problem comes back; a P1/P2 ticket stays until it is fixed or you close it. A voice idle disconnect and 'Pear Desktop is not running' are information, not bugs."

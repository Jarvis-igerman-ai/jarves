order = 63
category = "everyday"
features = ["wrong_feedback"]
suggest = false
aliases = ["זה היה לא נכון", "טעית", "משוב", "that was wrong", "wrong answer", "feedback"]
title_he = "משוב: זה היה לא נכון"
title_en = "Feedback: that was wrong"
what_he = "כשג׳רוויס טעה, הריצו jarvis feedback wrong. נשמרת השיחה האחרונה: מה אמרתם, מה הוא ענה, שמות הכלים ומתי זה קרה, אחרי השחרה. כך אפשר להפוך טעות לבדיקה. כשיומן מה השתבש פועל, המשוב נספר גם בדוח השבועי. אמירה בקול ודף בלוח הבקרה יגיעו בהמשך. בטא, כבוי כברירת מחדל."
what_en = "When Jarvis got it wrong, run jarvis feedback wrong. The last exchange is saved: what you said, what he answered, the tool names and when it happened, after redaction. A mistake can then become a test. With the what-went-wrong log on, it is also counted in the weekly report. Voice and a dashboard page come later. Beta, off by default."
expect_he = "הפקודה מדפיסה \"Saved: FB-... exchange from <תאריך ושעה>\". בדקו שהזמן הוא של השיחה שהתכוונתם אליה."
expect_en = "The command prints \"Saved: FB-... exchange from <date and time>\". Check the time is the exchange you meant."
cost_he = "חינם. קובץ מקומי בלבד."
cost_en = "Free. A local file only."
privacy_he = "שום דבר לא יוצא מהמחשב. מפתחות, מיילים ומספרי טלפון מושחרים; משפט שנראה רגיש (סיסמה, קוד, כרטיס אשראי, מספרים ארוכים) נשמר רק כאורך. עם מצב פרטיות ביומן נשמר רק האורך, גם של ההערה. עד 200 משובים, עד שמוחקים."
privacy_en = "Nothing leaves this PC. Keys, e-mails and phone numbers are masked; a sentence that looks sensitive (password, code, credit card, long numbers) is kept as its length only. With log privacy on only lengths are kept, the note included. Up to 200 cases, kept until deleted."

[parity.features]
wrong_feedback = "feedback"

[[steps]]
he = "הפעילו: jarvis features beta on ואחר כך jarvis features on wrong_feedback."
en = "Turn it on: jarvis features beta on, then jarvis features on wrong_feedback."
action = "feature_on:wrong_feedback"
check = "active:wrong_feedback"

[[steps]]
he = "אחרי תשובה לא נכונה: jarvis feedback wrong --note \"מה היה לא נכון\". לראות: jarvis feedback list. למחוק: jarvis feedback delete FB-.... לכבות: jarvis features off wrong_feedback."
en = "After a wrong answer: jarvis feedback wrong --note \"what was wrong\". To see them: jarvis feedback list. To delete one: jarvis feedback delete FB-.... To turn it off: jarvis features off wrong_feedback."

[[problems]]
he = "הפקודה אומרת שלא נמצאה שיחה אחרונה"
en = "The command says no last exchange was found"
fix_he = "המשוב קורא את היסטוריית השיחות. בדקו שההיסטוריה פועלת (history.enabled בהגדרות) ושהייתה שיחה לפני כן."
fix_en = "Feedback reads the conversation history. Check that history is on (history.enabled in settings) and that there was an exchange before."

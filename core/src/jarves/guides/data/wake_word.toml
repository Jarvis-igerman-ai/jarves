expect_he = "נשמע צליל קצר, הפנים מסתכלות אליכם, ואחרי צליל שני אפשר לדבר."
expect_en = "A short chime, the face looks at you, and after the second chime you can talk."
test_he = "הבדיקה בודקת שיש מיקרופון ושהגלאי מותקן. אחר כך פשוט אמרו \"היי ג'ארביס\"."
test_en = "The check looks for a microphone and the detector. Then just say \"Hey Jarvis\"."

order = 2
category = "voice"
features = ["wake_word"]
checklist = 2
suggest = true
aliases = ["hey jarvis", "היי ג'ארביס", "מילת הפעלה", "wake", "מיקרופון", "microphone"]
links = ["custom_wake_phrase", "chimes", "voice_ai"]
title_he = "מילת הפעלה \"היי ג'ארביס\""
title_en = "Wake word \"Hey Jarvis\""
what_he = "ג'ארביס מקשיב במחשב עצמו למילים \"היי ג'ארביס\" ורק אז פותח שיחה."
what_en = "JARVES listens on this computer for \"Hey Jarvis\" and only then opens a conversation."
say = [["היי ג'ארביס", "Hey Jarvis"], ["הי ג'ארביס", "Hi Jarvis"], ["אוקיי ג'ארביס", "OK Jarvis"]]
expect_he = "נשמע צליל קצר, הפנים מסתכלות אליכם, ואחרי צליל שני אפשר לדבר."
expect_en = "A short chime, the face looks at you, and after the second chime you can talk."
test_he = "הבדיקה בודקת שיש מיקרופון ושהגלאי מותקן. אחר כך פשוט אמרו \"היי ג'ארביס\"."
test_en = "The check looks for a microphone and the detector. Then just say \"Hey Jarvis\"."
cost_he = "חינם: הזיהוי רץ במחשב."
cost_en = "Free: detection runs on this computer."
privacy_he = "שום קול לא יוצא מהמחשב לפני שהמילים זוהו."
privacy_en = "No audio leaves the computer before the words are detected."

[[steps]]
he = "חברו מיקרופון (או השתמשו במיקרופון של המחשב)."
en = "Connect a microphone (or use the computer's own)."
check = "available:wake_word"

[[steps]]
he = "ודאו שהמתג \"מילת הפעלה\" דולק."
en = "Make sure the Wake word switch is on."
action = "feature_on:wake_word"
check = "enabled:wake_word"

[[steps]]
he = "אם הוא לא שומע טוב, הריצו jarvis wake test: הוא מראה עוצמה, ציון וכמעט-זיהויים ואומר בדיוק מה לתקן (שקט מדי, מיקרופון לא נכון, מילים לא מזוהות)."
en = "If he does not hear you well, run jarvis wake test: it shows level, score and near misses and says exactly what to fix (too quiet, wrong mic, phrase not matched)."
action = "command:jarvis wake test"

[[steps]]
he = "לחצו \"בדוק עכשיו\" ואז אמרו \"היי ג'ארביס\"."
en = "Press Test now, then say \"Hey Jarvis\"."
action = "test"

[[steps]]
he = "לבדוק אם הקול בכלל עובד, בלי מילת הפעלה: jarvis talk פותח שיחה חיה מיד (jarvis talk --stop מסיים). אם הוא עונה, המיקרופון והקול תקינים והבעיה היא רק זיהוי המילה."
en = "To test whether voice works at all, without the wake word: jarvis talk opens a live conversation at once (jarvis talk --stop ends it). If he answers, mic and voice are fine and only wake detection is the problem."
action = "command:jarvis talk"

[[steps]]
he = "ב-V4 אפשר לאמן שכבת זיהוי קטנה על ההקלטות שלכם: jarvis wake train. אם הוא לא משפר, jarvis wake train --revert מחזיר למודל הרגיל."
en = "In V4 you can train a head on your own recordings: jarvis wake train. If it does not help, jarvis wake train --revert goes back to the standard model."

[[problems]]
he = "הוא לא מגיב"
en = "He does not react"
fix_he = "בדף הבית, תחת \"מה פועל עכשיו\", מופיע מה הגלאי שמע (למשל \"שמעתי דיבור, אבל לא את מילת ההפעלה\" או \"המיקרופון שקט מדי\"). בדקו שהמיקרופון לא מושתק והריצו jarvis wake test (jarvis wake test --list-mics מציג את המיקרופונים)."
fix_en = "On Home, under What is on now, the detector shows what it heard (e.g. \"Heard speech, no wake match\" or \"Mic too quiet\"). Check the mic is not muted and run jarvis wake test (jarvis wake test --list-mics lists the microphones)."

[[problems]]
he = "הוא נדלק לבד"
en = "He wakes up by himself"
fix_he = "בדיקת הדיבור המקומית (voice.wake_confirm) דוחה דמיונות כמו \"היי טרוויס\". אם שיחה נפתחת ואף אחד לא מדבר 3 פעמים ביממה, ג'ארביס מחמיר לבד (סף גבוה יותר, בדיקת דיבור גם לציון חזק, המתנה קצרה יותר למילה הראשונה) ואומר זאת ביומן (WAKE_AUTO_TUNED). jarvis wake test מציג כמה התעוררויות שווא נמדדו וממליץ על סף. הריצו jarvis wake test --apply כשהחדר כרגיל כדי לכייל לקול ולחדר שלכם, או jarvis wake test --false-wakes 30. בלי בדיקת הדיבור המקומית הסף לא יורד מתחת ל-0.25. אחרי סיום שיחה הוא לא מקשיב למילת ההפעלה כשנייה וחצי, כדי שזנב הדיבור שלו לא יפעיל אותו."
fix_en = "The local speech check (voice.wake_confirm) rejects look-alikes such as \"hey Travis\". If a conversation opens and nobody speaks 3 times in 24 h, JARVES makes itself stricter on its own (higher threshold, the speech check also for strong scores, a shorter wait for the first word) and logs it (WAKE_AUTO_TUNED). jarvis wake test shows how many false wakes were measured and suggests a threshold. Run jarvis wake test --apply with the room as usual to calibrate to your voice and room, or jarvis wake test --false-wakes 30. Without the local speech check the threshold never goes below 0.25. After a conversation ends he ignores the wake word for about a second and a half so the tail of his own speech cannot wake him."

[[problems]]
he = "אין לי אוזניות והוא ממשיך לדבר כשאני מדבר"
en = "No headset, and he keeps talking while I talk"
fix_he = "עם רמקולים ובלי אוזניות המיקרופון מושתק בזמן שהוא מדבר כדי שלא ישמע את עצמו. אם אתם מדברים חזק יותר מההד, הוא עוצר תוך כשליש שנייה והמיקרופון נפתח (LIVE_ECHO_BARGE_IN ביומן). אם זה לא קורה, דברו קרוב יותר למיקרופון או הנמיכו את הרמקולים. עם אוזניות אפשר לכבות voice.half_duplex."
fix_en = "With speakers and no headset the microphone is silenced while he speaks so he cannot hear himself. If you talk louder than the echo he stops within about a third of a second and the microphone opens (LIVE_ECHO_BARGE_IN in the log). If that does not happen, talk closer to the microphone or turn the speakers down. With a headset you can turn voice.half_duplex off."

[[problems]]
he = "הוא לא מתעורר כשאני אומר \"היי ג'ארביס\" פעמיים ברצף"
en = "He misses a second \"Hey Jarvis\" said right after the first"
fix_he = "התעוררות שנייה בתוך כ-4 שניות מההתעוררות הקודמת עלולה להיפספס. חכו כמה שניות ונסו שוב. הוא גם מתעורר על \"Jarvis\" לבד."
fix_en = "A second wake within about 4 seconds of the previous one can be missed. Wait a few seconds and try again. He also wakes on a bare \"Jarvis\"."

[[problems]]
he = "jarvis talk לא פותח שיחה"
en = "jarvis talk does not open a conversation"
fix_he = "הוא כותב מה חסר: \"jarvis start\" אם ג'ארביס לא רץ, ביטול השתקה אם המיקרופון מושתק, או בדיקת מפתח OPENAI_API_KEY אם אין קול חי. פרטים: jarvis logs -n 50."
fix_en = "It says what is missing: jarvis start if JARVES is not running, unmute if the mic is muted, or check OPENAI_API_KEY if there is no live voice. Details: jarvis logs -n 50."

privacy_en = "No audio leaves the computer before the words are detected."

[[steps]]
he = "חברו מיקרופון (או השתמשו במיקרופון של המחשב)."
en = "Connect a microphone (or use the computer's own)."
check = "available:wake_word"

[[steps]]
he = "ודאו שהמתג \"מילת הפעלה\" דולק."
en = "Make sure the Wake word switch is on."
action = "feature_on:wake_word"
check = "enabled:wake_word"

[[steps]]
he = "אם הוא לא שומע טוב, הריצו jarvis wake כדי לכייל לקול שלכם."
en = "If he does not hear you well, run jarvis wake to tune it to your voice."
action = "command:jarvis wake"

[[steps]]
he = "לחצו \"בדוק עכשיו\" ואז אמרו \"היי ג'ארביס\"."
en = "Press Test now, then say \"Hey Jarvis\"."
action = "test"

[[problems]]
he = "הוא לא מגיב"
en = "He does not react"
fix_he = "בדקו שהמיקרופון לא מושתק ב-Windows או בעמוד השליטה (Controls). נסו jarvis wake."
fix_en = "Check the microphone is not muted in Windows or on the Controls page. Try jarvis wake."

[[problems]]
he = "הוא נדלק לבד"
en = "He wakes up by himself"
fix_he = "הריצו jarvis wake והשתמשו בסף שהוא ממליץ."
fix_en = "Run jarvis wake and use the threshold it recommends."

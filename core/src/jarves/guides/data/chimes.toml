[[problems]]
he = "לא שומעים צליל"
en = "No sound"
fix_he = "בדקו את עוצמת הקול של Windows ואת הרמקול שנבחר."
fix_en = "Check the Windows volume and the selected speaker."

[[problems]]
he = "שקט ארוך לפני התשובה"
en = "A long silence before the answer"
fix_he = "אם אין תשובה 3 שניות אחרי שסיימתם לדבר, נשמע צליל קצר ורך (עד 4 פעמים), לא בשעות השקט ורק כשהמתג דולק. ביומן, LIVE_LATENCY מראה איזה שלב איטי (עד ההעברה, החיפוש או הקול) ו-LIVE_WORKING_CUE מראה מתי הצליל נשמע. אם התשובה לא מגיעה אחרי כ-25 שניות הוא אומר שלא הצליח."
fix_en = "If there is no answer 3 seconds after you finish, a short soft sound plays (up to 4 times), never in quiet hours and only while the switch is on. In the log, LIVE_LATENCY shows which stage is slow (up to the hand-over, the lookup, or the voice) and LIVE_WORKING_CUE shows when the sound played. If no answer comes after about 25 seconds he says he did not manage."

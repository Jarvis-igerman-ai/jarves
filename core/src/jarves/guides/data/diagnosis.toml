order = 36
category = "system"
pages = ["issues"]
features = ["diagnosis_llm_pass", "self_diagnosis_ask", "self_diagnosis_ai_wording", "self_diagnosis_handoff"]
aliases = ["אבחון", "בעיות", "diagnosis", "issues", "תקלות"]
links = ["autonomy", "usage", "self_check"]
title_he = "אבחון עצמי"
title_en = "Self-diagnosis"
what_he = "אחרי כל שיחה ג'ארביס בודק מה לא עבד טוב (שתיקות, כלים שנכשלו) ורושם את זה בעמוד \"בעיות\"."
what_en = "After each conversation JARVES checks what went wrong (silences, failed tools) and lists it on the Issues page."
say = [["היו בעיות בשיחה האחרונה?", "Were there problems in the last conversation?"]]
expect_he = "בעמוד \"בעיות\" רואים כל בעיה עם ההוכחה. \"בדיקה בעזרת המודל\" מוצאת גם דברים שהכללים מפספסים."
expect_en = "The Issues page shows each problem with evidence. The AI review also finds what the rules miss."
cost_he = "הכללים חינם. בדיקה בעזרת המודל: בקשה קטנה אחת לשיחה, עם תקרה יומית."
cost_en = "The rules are free. The AI review: one small request per conversation, with a daily cap."
privacy_he = "הבדיקה בעזרת המודל שולחת את תמליל השיחה ל-OpenAI. במצב פרטיות היא לא רצה."
privacy_en = "The AI review sends the transcript to OpenAI. In privacy mode it does not run."

[[steps]]
he = "פתחו את עמוד \"בעיות\" כדי לראות מה נמצא."
en = "Open the Issues page to see what was found."
action = "open:#/issues"

[[steps]]
he = "ודאו שהמתג \"אבחון עצמי בעזרת המודל\" דולק (צריך מפתח API)."
en = "Keep the Self-diagnosis LLM pass switch on (needs an API key)."
action = "feature_on:diagnosis_llm_pass"
check = "active:diagnosis_llm_pass"

[[steps]]
he = "כשכלי נכשל ג'ארביס שואל פעם אחת: לבדוק? \"כן\" מריץ בדיקה עצמית מהירה (קריאה בלבד) ומסביר סיבה וצעד הבא. \"לא\" מדלג. לא ישאל יותר מ-3 פעמים בשעה, ולא על אותה בעיה תוך 10 דקות."
en = "When a tool fails JARVES asks once: diagnose it? Yes runs a quick read-only self-check and explains the cause and next step. No skips. It never asks more than 3 times an hour, or about the same problem within 10 minutes."
action = "feature_on:self_diagnosis_ask"
check = "enabled:self_diagnosis_ask"

[[steps]]
he = "בדיקה ידנית של תחום: jarvis diagnose anydo, whatsapp, google או voice (אפשר --code וקוד השגיאה, ו---json). המתג \"ניסוח האבחון בעזרת המודל\" מאפשר למודל המקוון לנסח מחדש את התוצאה, והוא רואה רק דוח מצונזר, בלי הודעות ובלי מפתחות."
en = "Check one area by hand: jarvis diagnose anydo, whatsapp, google or voice (add --code and the error code, and --json). The Model wording switch lets the online model reword the result; it sees only a redacted report: no messages, no keys."
action = "feature_on:self_diagnosis_ai_wording"
check = "enabled:self_diagnosis_ai_wording"

[[steps]]
he = "רוצים כרטיס מהבדיקה? jarvis diagnose anydo --code קוד --ticket שומר דוח מצונזר כרטיס מקומי בלבד (בלי הודעות, שמות, כתובות או מפתחות; אם נשאר בו טקסט פרטי הוא נחסם ולא נשמר). שום דבר לא נשלח. לשליחה: jarvis ticket send מזהה, והוא מציג את הטקסט המדויק ושואל קודם."
en = "Want a ticket from the check? jarvis diagnose anydo --code CODE --ticket saves the redacted report as a LOCAL ticket only (no messages, names, addresses or keys; if any private-looking text is left it is blocked and not saved). Nothing is sent. To send: jarvis ticket send ID, which shows the exact text and asks first."

[[steps]]
he = "העברה לסוכן קוד (בטא, כבויה כברירת מחדל): אחרי הבדיקה העצמית ג'ארביס יכול לשאול אם להעביר את הכשל ל-Claude Code. קודם מתירים פרויקט (jarvis agents), מגדירים אותו (jarvis diagnose --handoff-project שם) ומדליקים את המתג (jarvis features on self_diagnosis_handoff). כן פותח כרטיס אישור שני שמציג את הטקסט המדויק, ורק אחריו הסוכן עובד בעותק נפרד של הקוד ומציע תיקון כבקשת משיכה בטיוטה. הסוכן חסום ממיזוג ומדחיפה, ובטקסט יש רק דוח מצונזר."
en = "Hand-off to a coding agent (beta, off by default): after the self-check JARVES can ask whether to hand the failure to Claude Code. First allow a project (jarvis agents), set it (jarvis diagnose --handoff-project NAME) and switch on self_diagnosis_handoff (jarvis features on self_diagnosis_handoff). Yes opens a SECOND approval card that shows the exact text; only then does the agent work in a separate copy of the code and propose a fix as a draft pull request. The agent is blocked from merging and pushing, and the text holds only a redacted report."
action = "feature_on:self_diagnosis_handoff"

[[problems]]
he = "ההעברה לסוכן קוד אומרת שאין פרויקט"
en = "The hand-off says no project is set"
fix_he = "מתירים פרויקט ב-jarvis agents ומגדירים אותו: jarvis diagnose --handoff-project שם."
fix_en = "Allow a project in jarvis agents and set it: jarvis diagnose --handoff-project NAME."

[[problems]]
he = "הוא שואל אחרי כל כשל ואני לא רוצה"
en = "He asks after a failure and I do not want that"
fix_he = "כבו את המתג \"שאלה אחרי כשל: לבדוק?\" (jarvis features off self_diagnosis_ask). בלי המתג הוא לא שואל בכלל."
fix_en = "Turn off the Ask to diagnose a failure switch (jarvis features off self_diagnosis_ask). Without it he never asks."

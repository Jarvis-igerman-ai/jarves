order = 70
category = "privacy"
probe = "privacy"
optional = true
aliases = ["פרטיות", "privacy", "מה נשמר", "מי שומע", "what is stored"]
links = ["camera", "memory", "backup", "dashboard"]
title_he = "פרטיות"
title_en = "Privacy"
what_he = "מה נשמר ואיפה: הכול במחשב שלכם, ורק מה שצריך נשלח ל-OpenAI בזמן שיחה."
what_en = "What is kept and where: everything on your computer; only what is needed goes to OpenAI during a conversation."
say = [["מה אתה שומר עליי?", "What do you keep about me?"], ["תפעיל מצב פרטיות", "Turn on privacy mode"]]
expect_he = "במצב פרטיות היומן שומר רק אורך וזמנים, לא מה שנאמר. המצלמה ושליחת מיילים כבויות מראש."
expect_en = "In privacy mode the history keeps only lengths and timings, not what was said. Camera and sending e-mail are off by default."
cost_he = "חינם."
cost_en = "Free."
privacy_he = "קול נשלח ל-OpenAI רק אחרי \"היי ג'ארביס\". מפתחות נשמרים בקובץ פרטי ולא מופיעים ביומן, בגיבויים או בלוח הבקרה. בדיקה עם סודות שנטמנו ב-36 יעדים לא מצאה דליפה באף אחד משני מצבי הפרטיות."
privacy_en = "Audio goes to OpenAI only after \"Hey Jarvis\". Keys are in a private file and never in logs, backups or the dashboard. A planted-secret audit of 36 sinks found no leak in either privacy mode."

[[steps]]
he = "בעמוד הבית יש מתג \"פרטיות\": לחיצה אחת, ומיד רק אורך וזמנים נשמרים. שם אפשר גם להסתיר את מה שנשמר קודם."
en = "The Home page has a Privacy switch: one click, and from then on only lengths and timings are kept. You can also mask what was kept before."
action = "open:#/home"
check = "probe:privacy"

[[steps]]
he = "צריכים טקסט מלא לבדיקה? בעמוד הבית לחצו \"טקסט מלא לפי בקשה\" (או jarvis privacy full-text on). זה נשמר 24 שעות בלבד, ואז הפרטיות חוזרת לבד. בהתקנה חדשה הפרטיות פועלת מראש."
en = "Need full text for a check? On the Home page press Full text on request (or jarvis privacy full-text on). It lasts 24 hours only, then privacy turns on again by itself. A new install starts with privacy on."
action = "open:#/home"

[[steps]]
he = "עברו על עמוד \"יכולות ומתגים\": מה דולק ומה כבוי."
en = "Go over the Features page: what is on and what is off."
action = "open:#/features"

[[steps]]
he = "הלוגים ואבחון נשמרים עם הודעות קבועות: תוכן ונתונים אישיים מוסתרים לפי סוג. jarvis diag בונה חבילת תמיכה שתמיד מסירה תוכן, ומגבבת נתונים אישיים. עברו עליה לפני ששולחים."
en = "Logs and diagnostics use fixed messages: content and personal data are redacted by class. jarvis diag builds a support bundle that always strips content and hashes personal data. Read it before sharing."
action = "command:jarvis diag --help"

[[steps]]
he = "כשמצב פרטיות כבוי מופיע פס אזהרה בלוח הבקרה וב-jarvis status: טקסט שיחה נשמר ביומנים."
en = "When privacy mode is off a banner shows on the dashboard and in jarvis status: conversation text is kept in the logs."
action = "command:jarvis status"


order = 12
category = "everyday"
pages = ["tasks"]
features = ["background_tasks"]
aliases = ["משימות ברקע", "מחקר", "research", "tasks", "background"]
links = ["voice_ai", "web_search", "scheduler"]
title_he = "משימות ברקע"
title_en = "Background tasks"
what_he = "שאלות ארוכות (מחקר, השוואות) ג'ארביס בודק ברקע, ואפשר להמשיך לדבר בינתיים."
what_en = "Long questions (research, comparisons) run in the background while you keep talking."
say = [["תבדוק לי ברקע מה המחשב הנייד הכי טוב עד 4000 שקל", "Research in the background the best laptop under 4000 shekels"], ["מה עם המשימה?", "How is the task going?"]]
expect_he = "הוא אומר שהתחיל, ומספר את התשובה כשהיא מוכנה."
expect_en = "He says he started, and tells you the answer when it is ready."
cost_he = "בערך 5-30 סנט למשימה, לפי האורך. יש תקרה יומית."
cost_en = "About 5-30 cents a task, depending on length. There is a daily cap."
privacy_he = "השאלה נשלחת ל-OpenAI."
privacy_en = "The question is sent to OpenAI."

[[steps]]
he = "צריך מפתח OpenAI API (מנוי ChatGPT לבד לא מספיק). ראו \"חיבור לבינה המלאכותית\"."
en = "Needs an OpenAI API key (a ChatGPT plan alone is not enough). See \"Connect the AI\"."
check = "available:background_tasks"

[[steps]]
he = "ודאו שהמתג \"משימות ברקע\" דולק."
en = "Make sure the Background tasks switch is on."
action = "feature_on:background_tasks"
check = "enabled:background_tasks"

[[steps]]
he = "את המשימות רואים בעמוד \"Background tasks\" בלוח הבקרה."
en = "See the tasks on the dashboard's Background tasks page."
action = "open:#/tasks"

[[problems]]
he = "הוא אומר שאי אפשר להתחיל משימה ברקע"
en = "He says he cannot start a background task"
fix_he = "בדקו שיש מפתח OpenAI API (מנוי ChatGPT לבד לא מספיק) ושהמתג \"משימות ברקע\" דולק. את הסיבה המדויקת רואים בעמוד המשימות."
fix_en = "Check that there is an OpenAI API key (a ChatGPT plan alone is not enough) and that the Background tasks switch is on. The exact reason shows on the Tasks page."

[[problems]]
he = "המשימה לא נגמרת או לא התחילה"
en = "The task never finishes or did not start"
fix_he = "פתחו את עמוד המשימות וראו את המצב שלה. אם הגעתם לתקרה היומית, המשימה תחכה למחר, ואפשר להעלות את התקרה במדריך \"תקציב API\"."
fix_en = "Open the Tasks page and check its state. If the daily cap was reached the task waits until tomorrow; you can raise the cap in the API budget guide."

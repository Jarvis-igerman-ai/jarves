[[steps]]
he = "צריך מפתח OpenAI API (מנוי ChatGPT לבד לא מספיק). ראו \"חיבור לבינה המלאכותית\"."
en = "Needs an OpenAI API key (a ChatGPT plan alone is not enough). See \"Connect the AI\"."
check = "available:background_tasks"

[[steps]]
he = "ודאו שהמתג \"משימות ברקע\" דולק."
en = "Make sure the Background tasks switch is on."

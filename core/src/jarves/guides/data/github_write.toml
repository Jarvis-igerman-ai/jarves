order = 30
category = "system"
features = ["github_write", "github_approve_reviews", "github_merge_queue"]
aliases = ["פתח issue", "תגובה ב-github", "open an issue", "comment on github", "כתיבה ל-github", "github write", "github writes", "הרשאת כתיבה", "אישור כתיבה"]
error_codes = ["GITHUB_WRITE_OFF", "GITHUB_WRITE_FORBIDDEN", "GITHUB_WRITE_UNTRUSTED", "GITHUB_WRITE_REPO", "GITHUB_WRITE_SCOPE", "GITHUB_WRITE_RATE_LIMIT", "GITHUB_WRITE_DENIED", "GITHUB_WRITE_TIMEOUT", "GITHUB_WRITE_NOT_IMPLEMENTED", "GITHUB_WRITE_BAD_ARGUMENT", "GITHUB_WRITE_DUPLICATE", "GITHUB_WRITE_PERMISSION", "GITHUB_WRITE_INVALID", "GITHUB_WRITE_REDIRECT", "GITHUB_WRITE_UNKNOWN", "GITHUB_WRITE_AUDIT_TAMPERED", "GITHUB_WRITE_AGENT_SESSION", "GITHUB_WRITE_APPROVE_OFF", "GITHUB_RATE_LIMIT", "GITHUB_NOT_FOUND", "GITHUB_BAD_ARGUMENT"]
title_he = "GitHub: כתיבה באישור"
title_en = "GitHub: writes with approval"
what_he = "אפשר לבקש ממני לפתוח או לערוך issue, להגיב ולהוסיף או להסיר תוויות ב-GitHub. כל שינוי מוצג לכם בדיוק כפי שהוא (גם אם יש בו @ או קישור, עם אזהרה), ורק אחרי אישור שלכם הוא יתבצע. אפשר גם לפתוח או לעדכן בקשת מיזוג (PR), להגיב עליה, לכתוב ביקורת ולהריץ שוב בדיקת CI. מיזוג עצמו לא נעשה כאן (בהמשך, רק דרך תור המיזוג)."
what_en = "You can ask me to open or edit an issue, comment, and add or remove labels on GitHub. Every change is shown to you exactly as it is (with a warning if it has an @ or a link), and happens only after you approve. You can also open or update a pull request, comment on it, write a review and re-run a CI run. Merging is not done here (later, only through the merge queue)."
say = [["מה מצב הכתיבה ל-GitHub?", "What is the state of GitHub writes?"], ["פתח issue במאגר", "Open an issue in the repository"]]
expect_he = "כבוי כברירת מחדל. עובד רק במאגרים שרשמתם ב-github_repos, בלי מיזוג ישיר, בלי force push ובלי שינוי הגדרות, סודות, הרשאות או הגנת ענפים. מגבלת קצב, ויומן ביקורת בלי טקסט ובלי אסימון."
expect_en = "Off by default. Works only on repositories you list in github_repos, with no direct merge, no force push and no change of settings, secrets, permissions or branch protection. Rate limited, with an audit log that holds no text and no token."
test = "feature"
test_he = "הבדיקה רק בודקת שיש אסימון שמור. היא לא פונה ל-GitHub ולא כותבת כלום. בדיקה אמיתית (פתיחת issue בדיקה) נעשית רק על ידכם, במאגר בדיקה."
test_en = "The check only sees that a saved token exists. It does not contact GitHub and writes nothing. A real test (opening a test issue) is done only by you, in a test repository."
cost_he = "חינם."
cost_en = "Free."
privacy_he = "יומן הביקורת (github/write_audit.jsonl) שומר סוג, מאגר, יעד ותוצאה בלבד. האסימון לא נכתב לשום יומן."
privacy_en = "The audit log (github/write_audit.jsonl) keeps only kind, repository, target and result. The token is never written to any log."

[[steps]]
he = "קודם חברו את GitHub לקריאה (המדריך GitHub). הפעילו יכולות בטא: jarvis features beta on."
en = "First connect GitHub for reading (the GitHub guide). Turn on beta features: jarvis features beta on."

[[steps]]
he = "ב-config.toml הוסיפו שורה כמו github_repos = [\"בעלים/מאגר\"]. ברירת המחדל ריקה: שום מאגר לא מותר."
en = "In config.toml add a line like github_repos = [\"owner/repo\"]. The default is empty: no repository is allowed."

[[steps]]
he = "ב-GitHub צרו אסימון עם פרטים מדויקים (Fine-grained) רק למאגרים שבחרתם. לשלב הזה צריך: Issues: Read and write (זה מכסה issues, תגובות ותוויות; תוויות לא נוצרות, רק קיימות). Metadata: Read מתווסף לבד. אל תוסיפו Contents, Administration, Secrets או Workflows. לבקשות מיזוג הוסיפו Pull requests: Read and write, ולהרצה חוזרת של CI הוסיפו Actions: Read and write (רק אם אתם רוצים את זה). הבדיקה שלי קוראת את המאגר ואת ה-issues בלבד, כך שהיא לא יכולה להוכיח שיש הרשאת כתיבה: אם חסרה, GitHub יסרב אחרי האישור שלכם ואומר לכם בדיוק מה חסר (GITHUB_WRITE_PERMISSION). אסימון קלאסי עם הרשאות רחבות (repo, admin, delete_repo, workflow) יגרום לאזהרה ב-jarvis github write status ובחלון האישור: עדיף Fine-grained."
en = "On GitHub create a Fine-grained token for the repositories you chose only. This stage needs: Issues: Read and write (it covers issues, comments and labels; labels are never created, only existing ones are used). Metadata: Read is added automatically. Do not add Contents, Administration, Secrets or Workflows. For pull requests add Pull requests: Read and write, and for CI re-runs add Actions: Read and write (only if you want those). My check only reads the repository and its issues, so it cannot prove a write permission: if one is missing, GitHub refuses after your approval and I tell you exactly what is missing (GITHUB_WRITE_PERMISSION). A classic token with broad scopes (repo, admin, delete_repo, workflow) causes a warning in jarvis github write status and in the approval window: prefer a Fine-grained token."

[[steps]]
he = "פקודות (כל אחת מבקשת אישור ומציגה את הטקסט המדויק): jarvis github issue create --repo בעלים/מאגר --title כותרת --body טקסט; jarvis github issue comment 12 --body טקסט; jarvis github issue edit 12 --state closed; jarvis github issue labels-add 12 --label bug; jarvis github issue labels-remove 12 --label bug. מגבלות: כותרת עד 200 תווים, טקסט עד 800, עד 10 תוויות, עד 5 אחראים. אזכור של כולם או של צוות (@all, @org/team) נדחה."
en = "Commands (each asks your approval and shows the exact text): jarvis github issue create --repo owner/repo --title Title --body Text; jarvis github issue comment 12 --body Text; jarvis github issue edit 12 --state closed; jarvis github issue labels-add 12 --label bug; jarvis github issue labels-remove 12 --label bug. Limits: title up to 200 characters, text up to 800, up to 10 labels, up to 5 assignees. A mention of everyone or of a team (@all, @org/team) is refused."

[[steps]]
he = "בקשות מיזוג ובדיקות (רק בשורת הפקודה, אין כלי למודל): jarvis github pr open --head ענף --base main --title כותרת --body טקסט [--draft]; jarvis github pr update 12 --title כותרת --state closed; jarvis github pr comment 12 --body טקסט; jarvis github pr review 12 --event COMMENT --body טקסט (או REQUEST_CHANGES או APPROVE); jarvis github pr rerun מספר-הרצה [--failed-only]. הענף חייב להיות באותו מאגר. אין מיזוג, force push, שינוי הגנת ענפים, סודות, הרשאות או ארגון: הפקודות האלה לא קיימות. APPROVE ו-REQUEST_CHANGES מסומנים באזהרה בחלון. כל אישור קשור לפעולה המדויקת, באותו חלון קופץ ובאותה מגבלת קצב ויומן ביקורת."
en = "Pull requests and CI (command line only, no model tool): jarvis github pr open --head branch --base main --title Title --body Text [--draft]; jarvis github pr update 12 --title Title --state closed; jarvis github pr comment 12 --body Text; jarvis github pr review 12 --event COMMENT --body Text (or REQUEST_CHANGES or APPROVE); jarvis github pr rerun RUN_ID [--failed-only]. The branch must be in the same repository. There is no merge, force push, branch protection, secret, permission or organization change: those commands do not exist. APPROVE and REQUEST_CHANGES are flagged in the window. Every approval is bound to the exact action, in the same popup, with the same rate limit and audit log."

[[steps]]
he = "מי מאשר: כתיבה ל-GitHub מאושרת רק בחלון הקופץ של JARVES במחשב. הפקודה jarvis approvals approve, הטלפון, לוח הבקרה והטרמינל של jarvis chat לא יכולים לאשר (הם רק יכולים לדחות). גם jarvis github issue ... פותחת את אותו חלון קופץ; אין יותר אישור בהקלדה. הפקודה נדחית (GITHUB_WRITE_AGENT_SESSION) כשהיא רצה מצינור, מסקריפט או מתוך סוכן או כלי אוטומטי: הריצו אותה בעצמכם בטרמינל שלכם. האישור קשור לפעולה המדויקת: שינוי כלשהו בטקסט מחייב אישור חדש."
en = "Who approves: a GitHub write is approved only in the JARVES popup on the computer. The command jarvis approvals approve, the phone, the dashboard and the jarvis chat terminal cannot approve (they can only deny). jarvis github issue ... opens the same popup; there is no typed approval any more. The command is refused (GITHUB_WRITE_AGENT_SESSION) when it runs from a pipe, a script, or inside an agent or automation tool: run it yourself in your own terminal. The approval is bound to the exact action: any change of text needs a new approval."

[[steps]]
he = "מה החלון מזהיר עליו: עריכה (edit) מחליפה את כל התוויות או האחראים ולא מוסיפה: החלון מראה 'REPLACES labels: ישן -> חדש'. אם המספר הוא בקשת מיזוג, סגירה שלה סוגרת אותה. הפניה owner/repo#N, @אזכור וקישור מסומנים, ושיוך אחראי שולח לו התראה. קצב: עד 10 כתיבות ב-10 דקות, נספר מיומן הביקורת (גם אחרי הפעלה מחדש), והמקום נתפס לפני שמבקשים את אישורכם, אז שתי פקודות במקביל לא עוקפות את המגבלה. ביקשתם אותה פעולה פעמיים תוך 10 דקות: השנייה נדחית, אבל מעבר בין מצבים (סגור, פתוח, סגור) מותר."
en = "What the window warns about: an edit REPLACES the whole set of labels or assignees, it does not add: the window shows 'REPLACES labels: old -> new'. If the number is a pull request, closing it closes the PR. A reference owner/repo#N, an @mention and a link are flagged, and assigning someone sends them a notification. Rate: up to 10 writes per 10 minutes, counted from the audit log (also after a restart); the slot is taken before your approval is asked, so two commands at once cannot get around the limit. The same action twice within 10 minutes: the second is refused, but a toggle (closed, open, closed) is allowed."

[[steps]]
he = "הדליקו: jarvis github write on. מצב: jarvis github write status."
en = "Switch on: jarvis github write on. State: jarvis github write status."
action = "feature_on:github_write"
check = "active:github_write"

[[steps]]
he = "לכיבוי: jarvis github write off. כל כתיבה תבקש את אישורכם בחלון, עם הפעולה המדויקת."
en = "To turn off: jarvis github write off. Every write asks for your approval in a window, with the exact action."

[[steps]]
he = "הפעלת מיזוג אוטומטי (בטא, כבוי כברירת מחדל, מתג נפרד): jarvis features on github_merge_queue ואז jarvis github pr enqueue מספר --head-sha הקומיט-המלא --repo owner/repo. החלון הקופץ במחשב מציג את הבקשה, הקומיט ואת מצב הבדיקות, ורק אחרי האישור שלכם GitHub מפעיל מיזוג אוטומטי: הוא ממזג דרך תור המיזוג רק אחרי שכל הבדיקות הנדרשות עברו. אין מיזוג ישיר ואין עקיפה. קומיט חדש אחרי האישור מבטל את זה. הרשאת האסימון היא Pull requests: write והיא נבדקת בשימוש האמיתי הראשון."
en = "Turn on auto-merge (beta, off by default, its own switch): jarvis features on github_merge_queue, then jarvis github pr enqueue NUMBER --head-sha FULL_COMMIT --repo owner/repo. The popup on the computer shows the pull request, the commit and the check state, and only after your approval does GitHub turn on auto-merge: it merges through the merge queue only after every required check passed. There is no direct merge and no bypass. A newer commit after the approval cancels it. The token permission is Pull requests: write and is verified on first real use."

[[problems]]
he = "הוא אומר שהכתיבה כבויה או שהמאגר לא ברשימה"
en = "He says writes are off or the repository is not in the list"
fix_he = "הריצו jarvis github write on והוסיפו את המאגר ל-github_repos ב-config.toml."
fix_en = "Run jarvis github write on and add the repository to github_repos in config.toml."

[[problems]]
he = "חסרה הרשאת כתיבה בטוקן"
en = "The token lacks a write permission"
fix_he = "ב-GitHub הוסיפו לטוקן את הרשאת הכתיבה של הסוג הדרוש (ראו הרשימה למעלה), ורק למאגרים שבחרתם."
fix_en = "On GitHub add the write permission of the needed class to the token (see the list above), for the chosen repositories only."

[[problems]]
he = "אמר שהמאגר שונה או הועבר"
en = "He says the repository was renamed or moved"
fix_he = "עדכנו את github_repos בשם החדש (GITHUB_WRITE_SCOPE או GITHUB_WRITE_REDIRECT). שום דבר לא נכתב."
fix_en = "Update github_repos with the new name (GITHUB_WRITE_SCOPE or GITHUB_WRITE_REDIRECT). Nothing was written."

[[problems]]
he = "אמר שהפעולה כבר בוצעה (GITHUB_WRITE_DUPLICATE) או שלא הגיעה תשובה (GITHUB_WRITE_UNKNOWN)"
en = "He says the action was already done (GITHUB_WRITE_DUPLICATE) or no answer came (GITHUB_WRITE_UNKNOWN)"
fix_he = "בדקו ב-GitHub אם ה-issue או התגובה קיימים לפני ניסיון נוסף. אותה פעולה בדיוק לא תבוצע שוב תוך 10 דקות."
fix_en = "Check on GitHub whether the issue or comment exists before trying again. The exact same action is not repeated within 10 minutes."

[[problems]]
he = "הוא אומר שהתווית לא קיימת או שהטקסט נדחה (GITHUB_WRITE_BAD_ARGUMENT)"
en = "He says the label does not exist or the text was refused (GITHUB_WRITE_BAD_ARGUMENT)"
fix_he = "תוויות לא נוצרות בידי: צרו אותה ב-GitHub (ל-GitHub אין דגל שמונע יצירה: אני בודק רשימה עדכנית רגע לפני הכתיבה, ונשאר חלון של אלפיות שנייה). קצרו טקסט ארוך, והוציאו אזכור של כולם או של צוות."
fix_en = "I never create labels: create it on GitHub (GitHub has no flag that forbids creating one: I re-read the list right before the write, which leaves a window of milliseconds). Shorten long text and remove mentions of everyone or a team."

[[problems]]
he = "ניסיתי לאשר מ-jarvis approvals approve או מהטלפון וזה נדחה"
en = "I tried to approve from jarvis approvals approve or the phone and it was refused"
fix_he = "זה במכוון: אשרו בחלון הקופץ של JARVES במחשב (או הקלידו את ה-Ref בטרמינל שהריץ את הפקודה)."
fix_en = "This is by design: approve in the JARVES popup on the computer (or type the Ref in the terminal that ran the command)."

[[problems]]
he = "עריכה נדחתה: לא הצלחתי לקרוא את ה-issue (GITHUB_WRITE_UNREADABLE)"
en = "An edit was refused: could not read the issue (GITHUB_WRITE_UNREADABLE)"
fix_he = "לפני עריכה אני קורא את ה-issue כדי להראות מה יוחלף; כשהקריאה נכשלת (רשת, GitHub) העריכה נדחית ולא מוצגת תצוגה חלקית. בדקו חיבור ונסו שוב."
fix_en = "Before an edit I read the issue to show what it replaces; when that read fails (network, GitHub) the edit is refused instead of showing a partial preview. Check the connection and try again."

[[problems]]
he = "אמר שעדיין לא מומש"
en = "He says it is not implemented yet"
fix_he = "נכון לסוגים שעוד לא נבנו: issues, תגובות, תוויות, בקשות מיזוג, ביקורות והרצה חוזרת של CI עובדים; מיזוג דרך תור המיזוג יתווסף בגרסה הבאה."
fix_en = "Correct for kinds not built yet: issues, comments, labels, pull requests, reviews and CI re-runs work; merging through the merge queue comes in a later version."

[[problems]]
he = "הוא אומר שיומן הכתיבה שונה או קוצר (GITHUB_WRITE_AUDIT_TAMPERED)"
en = "He says the write audit was changed or shortened (GITHUB_WRITE_AUDIT_TAMPERED)"
fix_he = "היומן הוא שרשרת חתומה: עריכה, מחיקה או קיצור שלו עוצרים כל כתיבה ל-GitHub. בדקו מה קרה. אם זה בסדר, הריצו בעצמכם בטרמינל שלכם jarvis github write reset-audit: הקובץ הישן נשמר כראיה ומתחילה שרשרת חדשה."
fix_en = "The log is a signed chain: editing, deleting or shortening it stops every GitHub write. Check what happened. If it is fine, run jarvis github write reset-audit yourself in your own terminal: the old file is kept as evidence and a new chain starts."

[[problems]]
he = "הפקודה אומרת שהיא נדחתה כי רץ סוכן או שאין טרמינל אינטראקטיבי (GITHUB_WRITE_AGENT_SESSION)"
en = "The command says it was refused because an agent runs it or there is no interactive terminal (GITHUB_WRITE_AGENT_SESSION)"
fix_he = "פתחו טרמינל רגיל בעצמכם והריצו שם את הפקודה; החלון הקופץ יופיע במחשב."
fix_en = "Open a normal terminal yourself and run the command there; the popup appears on the computer."

[[steps]]
he = "אישור בקשת מיזוג (APPROVE) מוגן במתג נפרד, כבוי כברירת מחדל ובטא: jarvis features on github_approve_reviews. בלעדיו jarvis github pr review עם APPROVE נדחה (GITHUB_WRITE_APPROVE_OFF). הערות ובקשת שינויים (COMMENT, REQUEST_CHANGES) לא צריכות אותו. חלון האישור של APPROVE מזהיר שהוא יכול למלא ביקורת נדרשת למיזוג. כל הפעולות על בקשות מיזוג ובדיקות (pr, ci) עובדות רק משורת הפקודה שלכם, לא דרך המודל. לפני הרצה חוזרת של CI החלון מציג את שם ה-workflow, הענף, ואם ההרצה באה מ-fork."
en = "Approving a pull request (APPROVE) has its own switch, off by default and beta: jarvis features on github_approve_reviews. Without it, jarvis github pr review with APPROVE is refused (GITHUB_WRITE_APPROVE_OFF). Comments and change requests (COMMENT, REQUEST_CHANGES) do not need it. The APPROVE window warns that it can satisfy a required review for merging. All pull request and CI actions (pr, ci) work only from your own command line, never through the model. Before a CI re-run the window shows the workflow name, the branch and whether the run came from a fork."

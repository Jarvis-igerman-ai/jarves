order = 30
category = "system"
features = ["github_write"]
aliases = ["פתח issue", "תגובה ב-github", "open an issue", "comment on github", "כתיבה ל-github", "github write", "github writes", "הרשאת כתיבה", "אישור כתיבה"]
error_codes = ["GITHUB_WRITE_OFF", "GITHUB_WRITE_FORBIDDEN", "GITHUB_WRITE_UNTRUSTED", "GITHUB_WRITE_REPO", "GITHUB_WRITE_SCOPE", "GITHUB_WRITE_RATE_LIMIT", "GITHUB_WRITE_DENIED", "GITHUB_WRITE_TIMEOUT", "GITHUB_WRITE_NOT_IMPLEMENTED", "GITHUB_WRITE_BAD_ARGUMENT", "GITHUB_WRITE_DUPLICATE", "GITHUB_WRITE_PERMISSION", "GITHUB_WRITE_INVALID", "GITHUB_WRITE_REDIRECT", "GITHUB_WRITE_UNKNOWN", "GITHUB_RATE_LIMIT", "GITHUB_NOT_FOUND"]
title_he = "GitHub: כתיבה באישור"
title_en = "GitHub: writes with approval"
what_he = "אפשר לבקש ממני לפתוח או לערוך issue, להגיב ולהוסיף או להסיר תוויות ב-GitHub. כל שינוי מוצג לכם בדיוק כפי שהוא (גם אם יש בו @ או קישור, עם אזהרה), ורק אחרי אישור שלכם הוא יתבצע. בשלב הזה רק issues, תגובות ותוויות; בקשות מיזוג ובדיקות יגיעו בהמשך."
what_en = "You can ask me to open or edit an issue, comment, and add or remove labels on GitHub. Every change is shown to you exactly as it is (with a warning if it has an @ or a link), and happens only after you approve. For now only issues, comments and labels; pull requests and CI come later."
say = [["מה מצב הכתיבה ל-GitHub?", "What is the state of GitHub writes?"], ["פתח issue במאגר", "Open an issue in the repository"]]
expect_he = "כבוי כברירת מחדל. עובד רק במאגרים שרשמתם ב-github_repos, בלי מיזוג ישיר, בלי force push ובלי שינוי הגדרות, סודות, הרשאות או הגנת ענפים. מגבלת קצב, ויומן ביקורת בלי טקסט ובלי אסימון."
expect_en = "Off by default. Works only on repositories you list in github_repos, with no direct merge, no force push and no change of settings, secrets, permissions or branch protection. Rate limited, with an audit log that holds no text and no token."
test = "feature"
test_he = "הבדיקה רק בודקת שיש אסימון שמור. היא לא פונה ל-GitHub ולא כותבת כלום. בדיקה אמיתית (פתיחת issue בדיקה) נעשית רק על ידכם, במאגר בדיקה."
test_en = "The check only sees that a saved token exists. It does not contact GitHub and writes nothing. A real test (opening a test issue) is done only by you, in a test repository."
cost_he = "חינם."
cost_en = "Free."
privacy_he = "יומן הביקורת (github/write_audit.jsonl) שומר סוג, מאגר, יעד ותוצאה בלבד. האסימון לא נכתב לשום יומן."
privacy_en = "The audit log (github/write_audit.jsonl) keeps only kind, repository, target and result. The token is never written to any log."

[[steps]]
he = "קודם חברו את GitHub לקריאה (המדריך GitHub). הפעילו יכולות בטא: jarvis features beta on."
en = "First connect GitHub for reading (the GitHub guide). Turn on beta features: jarvis features beta on."

[[steps]]
he = "ב-config.toml הוסיפו שורה כמו github_repos = [\"בעלים/מאגר\"]. ברירת המחדל ריקה: שום מאגר לא מותר."
en = "In config.toml add a line like github_repos = [\"owner/repo\"]. The default is empty: no repository is allowed."

[[steps]]
he = "ב-GitHub צרו אסימון עם פרטים מדויקים (Fine-grained) רק למאגרים שבחרתם. לשלב הזה צריך: Issues: Read and write (זה מכסה issues, תגובות ותוויות; תוויות לא נוצרות, רק קיימות). Metadata: Read מתווסף לבד. אל תוסיפו Contents, Administration, Secrets, Workflows או Pull requests. הבדיקה שלי קוראת את המאגר ואת ה-issues בלבד, כך שהיא לא יכולה להוכיח שיש הרשאת כתיבה: אם חסרה, GitHub יסרב אחרי האישור שלכם ואומר לכם בדיוק מה חסר (GITHUB_WRITE_PERMISSION). אסימון קלאסי עם הרשאות רחבות (repo, admin, delete_repo, workflow) יגרום לאזהרה ב-jarvis github write status ובחלון האישור: עדיף Fine-grained."
en = "On GitHub create a Fine-grained token for the repositories you chose only. This stage needs: Issues: Read and write (it covers issues, comments and labels; labels are never created, only existing ones are used). Metadata: Read is added automatically. Do not add Contents, Administration, Secrets, Workflows or Pull requests. My check only reads the repository and its issues, so it cannot prove a write permission: if one is missing, GitHub refuses after your approval and I tell you exactly what is missing (GITHUB_WRITE_PERMISSION). A classic token with broad scopes (repo, admin, delete_repo, workflow) causes a warning in jarvis github write status and in the approval window: prefer a Fine-grained token."

[[steps]]
he = "פקודות (כל אחת מבקשת אישור ומציגה את הטקסט המדויק): jarvis github issue create --repo בעלים/מאגר --title כותרת --body טקסט; jarvis github issue comment 12 --body טקסט; jarvis github issue edit 12 --state closed; jarvis github issue labels-add 12 --label bug; jarvis github issue labels-remove 12 --label bug. מגבלות: כותרת עד 200 תווים, טקסט עד 800, עד 10 תוויות, עד 5 אחראים. אזכור של כולם או של צוות (@all, @org/team) נדחה."
en = "Commands (each asks your approval and shows the exact text): jarvis github issue create --repo owner/repo --title Title --body Text; jarvis github issue comment 12 --body Text; jarvis github issue edit 12 --state closed; jarvis github issue labels-add 12 --label bug; jarvis github issue labels-remove 12 --label bug. Limits: title up to 200 characters, text up to 800, up to 10 labels, up to 5 assignees. A mention of everyone or of a team (@all, @org/team) is refused."

[[steps]]
he = "הדליקו: jarvis github write on. מצב: jarvis github write status."
en = "Switch on: jarvis github write on. State: jarvis github write status."
action = "feature_on:github_write"
check = "active:github_write"

[[steps]]
he = "לכיבוי: jarvis github write off. כל כתיבה תבקש את אישורכם בחלון, עם הפעולה המדויקת."
en = "To turn off: jarvis github write off. Every write asks for your approval in a window, with the exact action."

[[problems]]
he = "הוא אומר שהכתיבה כבויה או שהמאגר לא ברשימה"
en = "He says writes are off or the repository is not in the list"
fix_he = "הריצו jarvis github write on והוסיפו את המאגר ל-github_repos ב-config.toml."
fix_en = "Run jarvis github write on and add the repository to github_repos in config.toml."

[[problems]]
he = "חסרה הרשאת כתיבה בטוקן"
en = "The token lacks a write permission"
fix_he = "ב-GitHub הוסיפו לטוקן את הרשאת הכתיבה של הסוג הדרוש (ראו הרשימה למעלה), ורק למאגרים שבחרתם."
fix_en = "On GitHub add the write permission of the needed class to the token (see the list above), for the chosen repositories only."

[[problems]]
he = "אמר שהמאגר שונה או הועבר"
en = "He says the repository was renamed or moved"
fix_he = "עדכנו את github_repos בשם החדש (GITHUB_WRITE_SCOPE או GITHUB_WRITE_REDIRECT). שום דבר לא נכתב."
fix_en = "Update github_repos with the new name (GITHUB_WRITE_SCOPE or GITHUB_WRITE_REDIRECT). Nothing was written."

[[problems]]
he = "אמר שהפעולה כבר בוצעה (GITHUB_WRITE_DUPLICATE) או שלא הגיעה תשובה (GITHUB_WRITE_UNKNOWN)"
en = "He says the action was already done (GITHUB_WRITE_DUPLICATE) or no answer came (GITHUB_WRITE_UNKNOWN)"
fix_he = "בדקו ב-GitHub אם ה-issue או התגובה קיימים לפני ניסיון נוסף. אותה פעולה בדיוק לא תבוצע שוב תוך 10 דקות."
fix_en = "Check on GitHub whether the issue or comment exists before trying again. The exact same action is not repeated within 10 minutes."

[[problems]]
he = "הוא אומר שהתווית לא קיימת או שהטקסט נדחה (GITHUB_WRITE_BAD_ARGUMENT)"
en = "He says the label does not exist or the text was refused (GITHUB_WRITE_BAD_ARGUMENT)"
fix_he = "תוויות לא נוצרות בידי: צרו אותה ב-GitHub. קצרו טקסט ארוך, והוציאו אזכור של כולם או של צוות."
fix_en = "I never create labels: create it on GitHub. Shorten long text and remove mentions of everyone or a team."

[[problems]]
he = "אמר שעדיין לא מומש"
en = "He says it is not implemented yet"
fix_he = "נכון לסוגים שעוד לא נבנו: issues, תגובות ותוויות עובדים; בקשות מיזוג, בדיקות ותור מיזוג יתווספו בגרסאות הבאות."
fix_en = "Correct for kinds not built yet: issues, comments and labels work; pull requests, CI and the merge queue come in later versions."

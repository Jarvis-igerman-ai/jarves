order = 63
category = "system"
pages = ["signoff"]
features = ["release_signoff"]
aliases = ["אישור גרסה", "בדיקה ידנית", "גרסה יציבה", "sign-off", "signoff", "manual test", "release"]
links = ["updates", "beta_channel"]
title_he = "אישור גרסה (בדיקה ידנית)"
title_en = "Release sign-off (manual test)"
what_he = "לפני גרסה יציבה אתם בודקים ידנית את הבטא האחרונה לפי גיליון קצר, ורושמים תוצאות. בלי חתימה הגרסה היציבה לא יוצאת."
what_en = "Before a stable release you test the latest beta by hand against a short sheet and record the results. Without your sign-off the stable release is refused."
say = [["איפה אנחנו באישור הגרסה?", "Where are we with the release sign-off?"]]
expect_he = "הגיליון docs/reviews/MANUAL_TEST_<גרסה>.md מציג שורה לכל בדיקה. החתימה רושמת את הבטא שנבדקה, ה-SHA שלה והתאריך."
expect_en = "The sheet docs/reviews/MANUAL_TEST_<version>.md has one row per check. Signing records the beta tested, its SHA and the date."
cost_he = "חינם."
cost_en = "Free."
privacy_he = "הגיליון נשמר בקובץ בפרויקט ולא מכיל מידע אישי."
privacy_en = "The sheet is a file in the project and holds no personal data."

[[steps]]
he = "בדקו מה מוכן: jarvis release status. הפקודה מריצה כל בדיקה אוטומטית (main ירוק, לילה ירוק, אפס P0-P2 פתוחים) ואומרת מה נשאר לכם. הוסיפו --report לכתיבת דוח ראיות."
en = "See what is ready: jarvis release status. It runs every automatic check (main green, nightly green, zero open P0-P2) and says what remains for you. Add --report to write an evidence report."
action = "command:jarvis release status"

[[steps]]
he = "צרו את הגיליון הקצר: jarvis release sheet --version X.Y.Z. חמש שורות בדיקה על המחשב שלכם; כל השאר נרשם כמאושר-אוטומטית עם הראיות."
en = "Create the short sheet: jarvis release sheet --version X.Y.Z. Five smoke rows on your PC; everything else is recorded as accepted by automation with its evidence."
action = "command:jarvis release sheet"

[[steps]]
he = "עברו על חמש השורות מול הבטא המותקנת ורשמו כל תוצאה: בעמוד אישור גרסה, או jarvis release signoff --version X.Y.Z --row ID --result pass."
en = "Go through the five rows with the installed beta and record each result: on the Release sign-off page, or jarvis release signoff --version X.Y.Z --row ID --result pass."
action = "open:#/signoff"

[[steps]]
he = "כשכל שורה pass: jarvis release signoff --version X.Y.Z --finish. עכשיו אפשר לתייג vX.Y.Z."
en = "When every row is pass: jarvis release signoff --version X.Y.Z --finish. Now you can tag vX.Y.Z."
action = "command:jarvis release signoff --finish"

[[problems]]
he = "החתימה מסרבת"
en = "Signing is refused"
fix_he = "נשארה שורה פתוחה, או שאין בטא מותקנת מערוץ הבטא. עברו לבטא (jarvis update --channel beta), התקינו אותה ונסו שוב; אפשר גם לתת --beta ו---commit."
fix_en = "A row is still open, or no beta from the beta channel is installed. Switch to beta (jarvis update --channel beta), install it and try again; you can also pass --beta and --commit."

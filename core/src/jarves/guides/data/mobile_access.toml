order = 64
category = "system"
features = ["mobile_access"]
aliases = ["אפליקציה", "אפליקציית טלפון", "pwa", "qr", "קוד qr", "mobile", "phone app", "גישה מהטלפון"]
links = ["lan_dashboard", "privacy"]
title_he = "דיבור עם JARVES מהטלפון"
title_en = "Talk to JARVES from your phone"
what_he = "אפליקציית אינטרנט בטלפון שמדברת ישירות עם המחשב שלכם בבית: שיחה, דיבור בלחיצה ורשימת אישורים. אין שרת בענן. כבוי מראש."
what_en = "A web app on your phone that talks directly to your computer at home: chat, push-to-talk and an approvals list. No cloud server. Off by default."
say = [["איך אני מדבר עם JARVES מהטלפון?", "How do I talk to JARVES from my phone?"]]
expect_he = "מצמידים את הטלפון פעם אחת בסריקת קוד QR שמוצג במחשב. אחר כך אפשר לכתוב ל-JARVES, ואם הוגדר חיבור מאובטח גם לדבר אליו. אישורים נענים בחלון במחשב, אלא אם הפעלתם אישורים מהטלפון; בקשות שדורשות קוד מאושרות במחשב בלבד. אפשר לנתק כל טלפון בכל רגע."
expect_en = "Pair the phone once by scanning the QR code shown on the computer. Then you can type to JARVES, and talk to it if a secure connection is set up. Approvals are answered in the popup on the computer unless you switch on phone approvals; requests that need a code are approved on the computer only. You can disconnect any phone at any time."
cost_he = "חינם."
cost_en = "Free."
privacy_he = "רק ברשת הביתית, בלי שרת בענן. בלי חיבור מאובטח אפשר לכתוב אבל לא לדבר, ומישהו שכבר מחובר ל-Wi-Fi שלכם יכול תיאורטית לראות את התנועה. יומן הביקורת לא שומר תוכן הודעות. כיבוי המתג עוצר את הגישה מיד."
privacy_en = "Home network only, no cloud server. Without a secure connection you can type but not talk, and someone already on your Wi-Fi could in theory see the traffic. The audit log never keeps message text. Switching it off stops access at once."

[[steps]]
he = "בלוח הבקרה פתחו את העמוד \"טלפון\" ולחצו \"הפעלת גישה מהטלפון\" (סיכון גבוה, יש אישור). לא צריך שורת פקודה ולא הפעלה מחדש: JARVES יוצר תעודה עצמית, מאזין ברשת הביתית עם TLS ומציג QR וקוד בן 8 ספרות. אם הלוח לא יכול להתכוונן לבד, העמוד אומר את הצעד היחיד: jarvis features on mobile_access ואז jarvis dashboard --mobile --tls-selfsigned."
en = "In the dashboard open the Phone page and press Turn on phone access (high risk, it asks first). No command line and no restart: JARVES makes a self-signed certificate, listens on the home network with TLS and shows the QR and the 8-digit code. If the dashboard cannot set itself up, the page says the one next step: jarvis features on mobile_access, then jarvis dashboard --mobile --tls-selfsigned."
action = "feature_on:mobile_access"
check = "enabled:mobile_access"

[[steps]]
he = "בלוח הבקרה במחשב פתחו את העמוד \"טלפון\" ולחצו \"צימוד טלפון\"."
en = "In the dashboard on the computer open the Phone page and press Pair a phone."

[[steps]]
he = "בטלפון סרקו את קוד ה-QR במצלמה. אם הוא לא נסרק, הקלידו את הקוד בן 8 הספרות. הקוד תקף 5 דקות ופעם אחת."
en = "On the phone scan the QR code with the camera. If it does not scan, type the 8-digit code. It works for 5 minutes and once."

[[steps]]
he = "מחוץ לבית? התקינו Tailscale במחשב ובטלפון והתחברו לאותו חשבון (בעצמכם: JARVES לא מתקין ולא מתחבר). בעמוד \"טלפון\" יופיעו כתובת ה-Tailscale ו-QR נפרד. אפשר גם להאזין לכתובת Tailscale בלבד."
en = "Away from home? Install Tailscale on the computer and the phone and sign in to the same account (yourself: JARVES never installs or signs in). The Phone page then shows the Tailscale address and its own QR. You can also listen on the Tailscale address only."

[[steps]]
he = "אישורים מהטלפון (כבוי מראש): טלפון מצומד יכול לאשר כל רמת סיכון, חוץ מבקשות עם קוד מוקלד. טלפון אבוד: \"ניתוק כל הטלפונים\" בלחיצה אחת, או jarvis phone revoke-all."
en = "Phone approvals (off by default): a paired phone can approve any risk level except typed-code requests. A lost phone: one click on Revoke all phones, or jarvis phone revoke-all."

[[steps]]
he = "פס המיקרופון בראש האפליקציה (תמיד פועל): כותב במילים אם מיקרופון הטלפון פועל, מה מצב המיקרופון במחשב ואם שמע נשלח לענן ברגע זה. בזמן הקלטה מהטלפון הפס מתאדם ויש בו \"עצירה ושליחה\" ו\"ביטול ההקלטה\" (ביטול סוגר את המיקרופון ולא שולח כלום). כשהאפליקציה יוצאת מהמסך המיקרופון נסגר לבד. שמע מהטלפון עובר רק למחשב, מובן שם על המכשיר, לא נשלח לענן ולא נשמר. אם המחשב לא עונה, הפס כותב \"לא ידוע\" ולא \"כבוי\". בזמן הקלדה (המקלדת פתוחה) הפס השקט מפנה מקום לשיחה וחוזר כשהמקלדת נסגרת; כשמשהו מאזין הוא נשאר תמיד."
en = "The microphone strip at the top of the app (always on): it says in words whether the phone microphone is on, what the computer's microphone is doing and whether audio is going to the cloud right now. While the phone records, the strip turns red and offers Stop and send and Discard (discard closes the microphone and sends nothing). The microphone closes by itself when the app leaves the screen. Audio from the phone goes to the computer only, is understood there on the device, is not sent to the cloud and is not stored. If the computer does not answer, the strip says unknown, never off. While you type (keyboard open) the quiet strip steps aside for the conversation and comes back when the keyboard closes; while anything listens it always stays."

[[steps]]
he = "מבנה האפליקציה: הצ'אט הוא המסך הראשי, כמו ChatGPT. התשובות מוצגות כטקסט מלא עם רשימות וקוד (עם כפתור העתקה), וליד כל תשובה כפתור העתקה. בתחתית: שדה הודעה, כפתור שליחה ומיקרופון (לחיצה ארוכה, רק בחיבור https). הודעה שלא נשלחה מקבלת \"ניסיון חוזר\". כפתור התפריט (שלושה קווים) פותח מגירה צדדית עם שיחה חדשה, שיחות אחרונות ושאר העמודים: אישורים, תוכניות, נהיגה, קול, תקינות והטלפון הזה. העיפרון בראש המסך פותח שיחה חדשה. בצ'אט ריק מופיעות הפקודות העיקריות בשורה שגוללים הצידה, וטיפ חד-פעמי להוספת JARVES למסך הבית (או לחיבור מאובטח); ה-X סוגר אותו לתמיד בטלפון הזה. העיצוב בהיר או כהה לפי הגדרת הטלפון, ובעברית מימין לשמאל."
en = "App layout: the chat is the home screen, like ChatGPT. Answers show as full text with lists and code (with a Copy button), and each answer has a copy button. At the bottom: the message field, Send and the microphone (hold to talk, https only). A message that failed to send gets Retry. The menu button (three lines) opens a side drawer with New chat, recent conversations and the other pages: Approvals, Plans, Drive, Voice, Health and This phone. The pencil at the top starts a new chat. An empty chat shows the main commands in a row you swipe sideways, and a one-time tip to add JARVES to the home screen (or to use a secure connection); its X hides it for good on this phone. Light or dark follows the phone setting; Hebrew reads right to left."

[[steps]]
he = "הודעות יזומות בטלפון: כל הודעה נשארת על המסך עם \"השתקת הודעות לשעה\", \"עצירת הודעות\" ו\"סגירה\", בכל לשונית. אלה עובדות עם ההרשאות הרגילות של הטלפון. הודעות שנעצרו נשארות כבויות עד שמדליקים אותן שוב במחשב; הדלקה מהטלפון לא אפשרית."
en = "Proactive notes on the phone: each note stays on screen with Snooze notes 1 h, Stop notes and Dismiss, on every tab. They work with the phone's normal permissions. Stopped notes stay off until you switch them on again on the computer; switching on from the phone is not possible."

[[problems]]
he = "הפס אומר \"לא ידוע\" על המיקרופון או הענן"
en = "The strip says unknown for the microphone or cloud"
fix_he = "המחשב לא עונה לטלפון או שמצב השמע שלו לא נקרא. בדקו שהמחשב דולק ו-JARVES פועל (העמוד \"תקינות ומהירות\"). הפס לא ממציא מצב רגוע."
fix_en = "The computer is not answering the phone or its audio state could not be read. Check that the computer is on and JARVES is running (the Health and speed page). The strip never invents a calm state."

[[steps]]
he = "תוכניות ליעדים בטלפון (דורש את ההרשאה \"משימות\", כבויה מראש): בלשונית \"תוכניות\" רואים כל תוכנית, את התקדמותה ואת השלבים (שם הכלי, הסיבה, המצב). מהטלפון אפשר להשהות תוכנית שרצה, לחדש תוכנית מושהית, לנסות שוב תוכנית שנכשלה (נשאל קודם) ולבטל תוכנית פתוחה. המשך וניסיון חוזר רק ממשיכים תוכנית שכבר אישרתם במחשב: שלב שמשנה משהו עדיין שואל בחלון האישור שם, ותוכנית שקראה טקסט חיצוני או שיש בה שלב שאולי כבר רץ נשארת למחשב. אישור תוכנית, דילוג על שלב ומחיקה נעשים במחשב בלבד. פרטי הכלים ותוצאותיהם לא נשלחים לטלפון."
en = "Goal plans on the phone (needs the \"tasks\" permission, off by default): the Plans tab shows each plan, its progress and its steps (tool name, reason, status). From the phone you can pause a running plan, resume a paused one, retry a failed one (it asks first) and cancel an open one. Resume and retry only continue a plan you already approved on the computer: a step that changes something still asks in the approval popup there, and a plan that read outside text, or has a step that may already have run, stays for the computer. Approving a plan, skipping a step and deleting are done on the computer only. Tool arguments and results are never sent to the phone."

[[problems]]
he = "אין לשונית \"תוכניות\" בטלפון"
en = "The Plans tab is missing on the phone"
fix_he = "ההרשאה \"משימות\" כבויה מראש. הרשו אותה לטלפון בעמוד \"טלפון\" במחשב ופתחו את האפליקציה מחדש. תוכנית שממתינה לאישור מאושרת במחשב בלבד."
fix_en = "The \"tasks\" permission is off by default. Allow it for the phone on the Phone page on the computer and reopen the app. A plan that waits for approval is approved on the computer only."

[[steps]]
he = "העדפות שנלמדו בטלפון (כבוי מראש): בעמוד \"טלפון\" במחשב סמנו \"העדפות שנלמדו\" ליד הטלפון, או הריצו jarvis phone scopes <מזהה> --grant prefs. בטלפון תופיע לשונית \"למדתי\": אפשר לאשר הצעה, לדחות, לתקן טקסט ולשכוח. אי אפשר להוסיף העדפה חדשה או למחוק הכול מהטלפון. טקסט רגיש נדחה כמו במחשב, והשינוי מופיע מיד גם בעמוד ההעדפות במחשב. כדי לבטל: הסירו את הסימון או jarvis phone scopes <מזהה> --revoke prefs."
en = "Learned preferences on the phone (off by default): on the Phone page on the computer tick Learned preferences next to the phone, or run jarvis phone scopes <id> --grant prefs. The phone then shows a Learned tab: confirm a suggestion, decline, correct the text and forget. You cannot add a new preference or clear everything from the phone. Sensitive text is refused like on the computer, and the change shows at once on the computer's preferences page too. To turn it off: untick it, or jarvis phone scopes <id> --revoke prefs."

[[problems]]
he = "אין לשונית \"למדתי\" בטלפון"
en = "The Learned tab is missing on the phone"
fix_he = "ההרשאה כבויה מראש. סמנו \"העדפות שנלמדו\" ליד הטלפון בעמוד \"טלפון\" במחשב (או jarvis phone scopes <מזהה> --grant prefs) ופתחו את האפליקציה מחדש."
fix_en = "The permission is off by default. Tick Learned preferences next to the phone on the Phone page on the computer (or jarvis phone scopes <id> --grant prefs) and reopen the app."

[[problems]]
he = "Tailscale לא מזוהה"
en = "Tailscale is not detected"
fix_he = "ודאו ש-Tailscale פועל ומחובר במחשב (jarvis phone status מראה את המצב). לתעודה מאובטחת הפעילו HTTPS בלוח הניהול של Tailscale; בלעדיה JARVES משתמש בתעודה עצמית."
fix_en = "Make sure Tailscale is running and signed in on the computer (jarvis phone status shows the state). For a trusted certificate enable HTTPS in the Tailscale admin console; without it JARVES uses the self-signed certificate."

[[problems]]
he = "הטלפון לא מגיע למחשב"
en = "The phone cannot reach the computer"
fix_he = "הטלפון חייב להיות באותה רשת Wi-Fi והמחשב דולק עם JARVES פעיל. אם Windows שואל על חומת האש, אשרו רשתות פרטיות בלבד."
fix_en = "The phone must be on the same Wi-Fi and the computer on with JARVES running. If Windows asks about the firewall, allow private networks only."

[[problems]]
he = "כפתור הדיבור לא פעיל"
en = "The talk button is disabled"
fix_he = "דיבור דורש חיבור מאובטח. במחשב הריצו jarvis dashboard --mobile --tls-selfsigned ואשרו את אזהרת התעודה בטלפון פעם אחת."
fix_en = "Talking needs a secure connection. On the computer run jarvis dashboard --mobile --tls-selfsigned and accept the certificate warning on the phone once."

[[problems]]
he = "הטלפון התנתק ואז חזר: האם הודעות יישלחו פעמיים?"
en = "The phone dropped and came back: will messages be sent twice?"
fix_he = "לא. לכל הודעה, תשובת אישור ופעולת יעד יש מזהה; המחשב מבצע אותם פעם אחת וזוכר את התשובה גם אחרי הפעלה מחדש. הודעה שלא נשלחה מסומנת בטלפון ונשלחת מחדש אוטומטית רק בתוך שתי דקות. רשימת היעדים והשהיית אותות דורשות להרשות לטלפון \"משימות\" בעמוד טלפון."
fix_en = "No. Every message, approval answer and goal action carries an id; the computer runs it once and remembers the answer, also after a restart. A message that was not sent is marked on the phone and re-sent automatically only within two minutes. The goals list and snoozing signals need the \"tasks\" permission for the phone on the Phone page."

[[problems]]
he = "הדפדפן אומר \"מפתח גישה לא נכון\" או שהאתר לא נגיש"
en = "The browser says wrong access key, or the site cannot be reached"
fix_he = "כל הפעלה של לוח הבקרה יוצרת מפתח פרטי חדש, וקישור ישן או לשונית ישנה לא יעבדו. הריצו jarvis dashboard: אם לוח בקרה כבר רץ, הוא נפתח מחדש עם הקישור הנכון (לא נפתח לוח שני). בדף השגיאה יש גם כפתור \"פתח את לוח הבקרה הנוכחי\". עם --tls-selfsigned הקישור הוא https; הדפדפן מזהיר פעם אחת מתעודה עצמית, וזה צפוי."
fix_en = "Every run of the dashboard makes a new private key, so an old link or tab stops working. Run jarvis dashboard: if a dashboard is already running it is reopened with the right link (no second one starts). The error page also has an Open the current dashboard button. With --tls-selfsigned the link is https; the browser warns once about the self-signed certificate, which is expected."

category = "system"
features = ["phone_trust"]
suggest = false
aliases = ["חיבור מהימן לטלפון", "התקנת אפליקציית הטלפון", "אישור אבטחה לטלפון", "trusted phone connection", "install phone app", "phone certificate", "local CA", "add to home screen", "tailscale certificate"]
links = ["mobile_access", "phone_hands_free"]
title_he = "חיבור מהימן לטלפון (התקנה כאפליקציה)"
title_en = "Trusted phone connection (install as an app)"
what_he = "בלי חיבור מהימן, Chrome בטלפון מזהיר מהאישור העצמי של JARVES ולא מאפשר להתקין את עמוד הטלפון כאפליקציה אמיתית. יש שתי דרכים, שתיהן אופציונליות. נתיב א': JARVES יוצר רשות אישורים מקומית קטנה משלו (בלי צד שלישי): המפתח שלה נשאר במחשב הזה בלבד, והיא מוגבלת טכנית לכתובות ברשת פרטית ולשמות מקומיים, כך שאינה יכולה לאשר אתר ציבורי. אתם מתקינים בטלפון רק את האישור הציבורי שלה, פעם אחת, בעצמכם. נתיב ב': אם אתם כבר משתמשים ב-Tailscale, הוא נותן אישור אמיתי לשם המחשב ואין מה להתקין בטלפון. כבוי כברירת מחדל, בשלב בטא."
what_en = "Without a trusted connection, Chrome on the phone warns about JARVES's self-signed certificate and will not install the phone page as a real app. There are two ways, both optional. Path A: JARVES makes its own small local certificate authority (no third party): its key stays on this PC only, and it is technically limited to private-network addresses and local names, so it cannot vouch for a public site. You install only its public certificate on the phone, once, yourself. Path B: if you already use Tailscale, it gives a real certificate for the computer's tailnet name and there is nothing to install on the phone. Off by default, in beta."
say = [["חיבור מהימן לטלפון", "Trusted phone connection"]]
expect_he = "\"jarvis phone trust status\" מראה שיש רשות אישורים, תאריך תפוגה (עד שנתיים) וטביעת אצבע SHA-256. אחרי התקנת האישור בטלפון והפעלה מחדש של שרת הטלפון, \"jarvis phone trust verify\" כותב \"תקין\", ועמוד הטלפון כבר לא מציג את ההערה על חיבור לא מהימן."
expect_en = "jarvis phone trust status shows the CA, its expiry date (two years at most) and a SHA-256 fingerprint. After installing the certificate on the phone and restarting the phone server, jarvis phone trust verify says OK, and the phone page no longer shows the note about an untrusted connection."
test_he = "הריצו  \"jarvis features on beta_features\"  \"jarvis features on phone_trust\"  \"jarvis phone trust enable --yes\". אחרי הפעלה מחדש של שרת הטלפון הריצו \"jarvis phone trust verify\". בטלפון התקינו את הקובץ לפי השלבים ופתחו את עמוד הטלפון: אין אזהרת אישור. לביטול: \"jarvis phone trust revoke --yes\" והסרה בטלפון."
test_en = "Run  jarvis features on beta_features  jarvis features on phone_trust  jarvis phone trust enable --yes. After restarting the phone server run jarvis phone trust verify. On the phone install the file as described and open the phone page: no certificate warning. To undo: jarvis phone trust revoke --yes and remove it on the phone."
cost_he = "אין עלות. נתיב א' בלי רשת ובלי שירות חיצוני; הכול נוצר במחשב. נתיב ב' משתמש בחשבון Tailscale שלכם."
cost_en = "No cost. Path A uses no network and no outside service; everything is made on this computer. Path B uses your own Tailscale account."
privacy_he = "מה זה אומר לסמוך על רשות אישורים: מי שמחזיק את המפתח שלה יכול ליצור אישורים שהטלפון יקבל. בטלפון מתקינים את אישור השורש של JARVES; המפתח של השורש נמחק מיד אחרי שחתם פעם אחת על רשות ביניים, ולא נשמר בשום מקום. רק המפתח של רשות הביניים נשאר בקובץ במחשב הזה (הרשאות לבעלים בלבד), לא נשלח, לא נרשם ביומן ולא נכנס לגיבוי או לדוח אבחון. רשות הביניים מוגבלת בתוך האישור שלה לכתובות 10.x, 172.16-31.x, 192.168.x, 127.0.0.1 ולשמות \"localhost\", \".local\", \".home.arpa\", ולכן אינה יכולה לאשר אתר ציבורי; Chrome ואנדרואיד אוכפים זאת (חלק מהאפליקציות או גרסאות ישנות אולי לא). שימו לב: היא כן יכולה לאשר כל כתובת פרטית או שם מקומי, בכל רשת Wi-Fi שהטלפון מחובר אליה. אנדרואיד יציג אזהרה שהרשת עשויה להיות מנוטרת: זו האזהרה הכללית לכל אישור ידני. JARVES לא מתקין שום דבר בטלפון: רק אתם. התקינו רק בטלפון שלכם. אם המחשב נפרץ, המפתח נפרץ איתו: הריצו \"jarvis phone trust revoke\" והסירו את האישור מהטלפון. הרשות תקפה עד שנתיים; אישור השרת תקף 30 יום ומתחדש לבד, גם כששרת הטלפון רץ."
privacy_en = "What trusting a CA means: whoever holds its key can make certificates the phone accepts. On the phone you install the JARVES root certificate; the root's key is deleted right after it signs one intermediate CA once, and is never stored anywhere. Only the intermediate's key stays in a file on this PC (owner-only permissions); it is never sent, never logged and never put in a backup or diagnostics bundle. The intermediate is limited inside its own certificate to 10.x, 172.16-31.x, 192.168.x, 127.0.0.1 and the names localhost, .local, .home.arpa, so it cannot vouch for a public site; Chrome and Android enforce that (some apps or old versions may not). Note: it CAN vouch for any private address or local name, on any Wi-Fi the phone joins. Android shows a warning that the network may be monitored: that is its generic text for any manual certificate. JARVES installs nothing on the phone: only you do. Install only on your own phone. If the PC is compromised its key is too: run jarvis phone trust revoke and remove the certificate from the phone. The CA lasts two years at most; the server certificate lasts 30 days and renews by itself, also while the phone server runs."

[parity.features]
phone_trust = "phone"

[[steps]]
he = "ודאו שגישה מהטלפון פועלת וששיוך הטלפון עבד (אזהרת האישור בפעם הראשונה צפויה). במחשב: \"jarvis features on beta_features\" ואז \"jarvis features on phone_trust\". מהמסוף שלכם זה המתג שלכם; אם מבקשים מ-JARVES להפעיל את זה בשיחה, הוא מבקש את אישורכם במסך, כי זו תכונה בסיכון גבוה."
en = "Make sure phone access works and the phone is paired (the certificate warning the first time is expected). On the computer: jarvis features on beta_features, then jarvis features on phone_trust. From your own terminal this is your own switch; if you ask JARVES to turn it on in a conversation, it asks for your on-screen approval, as a high-risk feature."
action = "feature_on:phone_trust"

[[steps]]
he = "נתיב א': הריצו \"jarvis phone trust enable\" והקלידו yes. הפקודה מסבירה מה זה אומר לסמוך על רשות, יוצרת את הרשות, ומדפיסה את טביעת האצבע ואת נתיב הקובץ הציבורי (\"jarvis phone trust ca-path\"). הפעילו מחדש את שרת הטלפון."
en = "Path A: run jarvis phone trust enable and type yes. It explains what trusting a CA means, makes the CA, and prints the fingerprint and the path of the public file (jarvis phone trust ca-path). Restart the phone server."
action = "command:jarvis phone trust enable"

[[steps]]
he = "בטלפון המצומד, בלשונית \"הטלפון הזה\", לחצו \"הורדת האישור\" (או העבירו את הקובץ בעצמכם). אנדרואיד: הגדרות > אבטחה (או אבטחה ופרטיות > אבטחה נוספת) > התקנת אישור (הצפנה ופרטי כניסה) > אישור CA > \"התקן בכל זאת\" ובחרו את הקובץ. השוו את טביעת האצבע בפרטי האישור. JARVES לא מתקין דבר בטלפון: את ההתקנה עושים רק אתם."
en = "On the paired phone, in the \"This phone\" tab, press \"Download the certificate\" (or copy the file over yourself). Android: Settings > Security (or Security and privacy > More security) > Install a certificate (Encryption and credentials) > CA certificate > \"Install anyway\" and pick the file. Compare the fingerprint in the certificate details. JARVES installs nothing on the phone: only you do."

[[steps]]
he = "במחשב: \"jarvis phone trust verify\". כתוב \"תקין\"? פתחו את עמוד הטלפון: בלי אזהרה, ואפשר להתקין כאפליקציה (תפריט Chrome > התקנת אפליקציה)."
en = "On the computer: jarvis phone trust verify. Does it say OK? Open the phone page: no warning, and it can be installed as an app (Chrome menu > Install app)."
action = "command:jarvis phone trust verify"

[[steps]]
he = "נתיב ב' (במקום נתיב א', אם יש לכם Tailscale): הריצו \"jarvis phone trust tailscale\". הפקודה רק בודקת מה מותקן ואומרת מה הצעד הבא: התקנה והתחברות באפליקציה של Tailscale עצמה, הפעלת \"HTTPS Certificates\" במסוף הניהול שלו, והפעלה מחדש של שרת הטלפון. JARVES לא מתקין את Tailscale ולא רואה את פרטי הכניסה."
en = "Path B (instead of path A, if you use Tailscale): run jarvis phone trust tailscale. It only checks what is installed and says the next step: install and sign in in Tailscale's own app, turn on \"HTTPS Certificates\" in its admin console, and restart the phone server. JARVES does not install Tailscale and never sees the sign-in."
action = "command:jarvis phone trust tailscale"

[[steps]]
he = "לביטול והסרה: \"jarvis phone trust revoke\" (מוחק את המפתח, אחרי yes). שרת טלפון שכבר רץ ממשיך עם האישור הנוכחי עד שמפעילים אותו מחדש. אחר כך בטלפון: הגדרות > אבטחה > הצפנה ופרטי כניסה > פרטי כניסה של משתמש > \"JARVES local CA\" > הסרה. להחלפת הרשות בחדשה: \"jarvis phone trust rotate\". לכיבוי התכונה: \"jarvis features off phone_trust\"."
en = "To undo and remove: jarvis phone trust revoke (deletes the key, after a yes). A phone server that is already running keeps the current certificate until it restarts. Then on the phone: Settings > Security > Encryption and credentials > User credentials > \"JARVES local CA\" > Remove. To replace the CA with a new one: jarvis phone trust rotate. To turn the feature off: jarvis features off phone_trust."

[[problems]]
he = "אחרי ההתקנה הדפדפן עדיין מזהיר"
en = "The browser still warns after installing"
fix_he = "ודאו שהפעלתם מחדש את שרת הטלפון, ושהכתובת בדפדפן היא כתובת רשת פרטית (192.168.x וכד'). הריצו \"jarvis phone trust verify\"; אם כתוב \"לא תקין\", הריצו \"jarvis phone trust renew\" והפעילו מחדש. כתובת Tailscale (100.x) אינה מכוסה ברשות המקומית: לה מתאים נתיב ב'."
fix_en = "Make sure you restarted the phone server and the address in the browser is a private-network address (192.168.x and so on). Run jarvis phone trust verify; if it says NOT trusted, run jarvis phone trust renew and restart. A Tailscale address (100.x) is not covered by the local CA: path B fits it."

[[problems]]
he = "הכתובת של המחשב השתנתה"
en = "The computer's address changed"
fix_he = "אישור השרת מונפק מחדש אוטומטית (בהפעלה של שרת הטלפון ובבדיקה כל כמה שעות), ואין צורך להתקין שוב את האישור בטלפון. אפשר גם \"jarvis phone trust renew\"."
fix_en = "The server certificate is re-issued automatically (at phone server start and in a check every few hours), and the phone certificate does not need to be installed again. You can also run jarvis phone trust renew."

[[problems]]
he = "אנדרואיד כותב שהרשת עשויה להיות מנוטרת"
en = "Android says the network may be monitored"
fix_he = "זו האזהרה הכללית של אנדרואיד לכל אישור CA ידני. כאן הרשות שלכם, על המחשב שלכם, ומוגבלת לרשת פרטית. אם אינכם בטוחים, בטלו: \"jarvis phone trust revoke\"."
fix_en = "That is Android's generic warning for any manual CA certificate. Here the CA is yours, on your computer, and limited to a private network. If you are unsure, undo it: jarvis phone trust revoke."

[[problems]]
he = "הסטטוס כותב שיש אישור בלי מפתח, או שתוקף הרשות פג"
en = "Status says there is a certificate without its key, or the CA has expired"
fix_he = "המפתח לעולם לא נשמר בגיבוי, ולכן אחרי שחזור נשאר רק האישור הציבורי. הריצו \"jarvis phone trust rotate\", הסירו מהטלפון את האישור הישן והתקינו את החדש."
fix_en = "The key is never put in a backup, so after a restore only the public certificate is left. Run jarvis phone trust rotate, remove the old certificate from the phone and install the new one."

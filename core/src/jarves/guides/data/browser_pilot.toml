order = 59
category = "system"
features = ["browser_pilot", "browser_liveview", "browser_takeover", "browser_phone_view", "browser_recording"]
aliases = ["פיילוט דפדפן", "browser pilot", "read only browser", "דפדפן לקריאה בלבד"]
links = ["browser", "privacy"]
error_codes = ["BROWSER_PILOT_OFF", "BROWSER_PILOT_NOT_AGENT", "BROWSER_PILOT_READ_ONLY", "BROWSER_PILOT_URL", "BROWSER_PILOT_CAP", "BROWSER_RECORDING_OFF"]
title_he = "פיילוט דפדפן (קריאה בלבד)"
title_en = "Browser pilot (read only)"
what_he = "ג'ארביס קורא דפים שהצבעתם עליהם: דפים מקומיים בלבד במחשב הזה או דפים ציבוריים. הוא לא מתחבר, לא שולח טפסים, לא לוחץ על דבר שמשנה מצב ולא שומר עוגיות או סיסמאות. כל פעולה נרשמת בקבלה (סוג בלבד)."
what_en = "JARVES reads pages you point to: local pages on this computer or public pages. It does not log in, submit forms, click anything that changes state, or store cookies or passwords. Every action leaves a receipt (kind only)."
say = [["תקרא לי מה כתוב בעמוד המקומי", "Read me what the local page says"]]
expect_he = "הטקסט מנוקה מסודות ומסומן כלא אמין. יש מגבלה על מספר הפעולות ועל הזמן, ואפשר לעצור בכל רגע."
expect_en = "Text is cleaned of secrets and marked untrusted. Actions and time are capped, and you can stop at any moment."
test = "feature"
test_he = "הבדיקה רק בודקת שהמתג קיים. היא לא פותחת דף ולא משנה כלום."
test_en = "The check only sees that the switch exists. It opens no page and changes nothing."
cost_he = "חינם."
cost_en = "Free."
privacy_he = "אין עוגיות, סיסמאות או טפסים. צילומי מסך לא נשמרים בשלב הזה. ביומן נרשם רק סוג הפעולה. רק אם מדליקים את browser_recording וגם מסמנים \"להקליט\" בהפעלה, הדף נשמר כוידאו במחשב הזה (ראו שלב ההקלטה)."
privacy_en = "No cookies, passwords or forms. Screenshots are not stored at this stage. The log holds only the kind of action. Only if you switch on browser_recording AND tick Record when you start a pilot, the page is saved as a video on this computer (see the recording step)."

[[steps]]
he = "הדליקו את המתג \"פיילוט דפדפן\" (כבוי כברירת מחדל). זו תכונת בטא: קודם הדליקו תכונות בטא."
en = "Switch on \"Browser pilot\" (off by default). It is a beta feature: turn on beta features first."
action = "feature_on:browser_pilot"
check = "active:browser_pilot"

[[steps]]
he = "לכיבוי: jarvis features off browser_pilot. הדפדפן הרגיל נשאר כפי שהיה (jarvis browser)."
en = "To turn off: jarvis features off browser_pilot. The normal browser stays as it was (jarvis browser)."

[[steps]]
he = "תצוגה חיה (בטא, כבויה כברירת מחדל): הדליקו את המתג \"תצוגה חיה של הדפדפן\" (jarvis features on browser_liveview). בעמוד הדפדפן בלוח הבקרה לוחצים \"תצוגה חיה\" ורואים את הדף כתמונה שמתרעננת, לקריאה בלבד: אי אפשר ללחוץ או להקליד דרכה. היא נפתחת רק במחשב עצמו, רק לדפי בדיקה מקומיים (localhost), פגה אחרי 5 דקות, ולחצן \"עצירה\" סוגר גם את הסשן."
en = "Live view (beta, off by default): switch on \"Browser live view\" (jarvis features on browser_liveview). On the dashboard Browser page press Live view and watch the page as a refreshing picture, read only: you cannot click or type through it. It opens only on the computer itself, only for local test pages (localhost), expires after 5 minutes, and the Stop button also closes the session."
action = "feature_on:browser_liveview"

[[steps]]
he = "שליטה ידנית (בטא, כבויה כברירת מחדל, מתג נפרד): jarvis features on browser_takeover. בכרטיס התצוגה החיה לוחצים \"קחו שליטה\": הסוכן נעול בחוץ (גם אם הוא באמצע קריאה, התוצאה שלו נזרקת), ואתם לוחצים על התמונה, מקלידים בתיבה (מוסתרת כסיסמה כברירת מחדל) או לוחצים Enter ו-Tab. מה שהקלדתם הולך לדף בלבד: הוא לא נרשם ביומן ולא נשמר, והוא מוסתר מהסוכן (במאמץ סביר: מחרוזות קצרות מ-3 תווים לא מוסתרות, הד חלקי או מוסווה עלול לעבור, ואחרי שמאפשרים לסוכן להמשיך הוא קורא את הדף כפי שהוא); אם הדף מציג אותו בחזרה אנחנו מנסים להסתיר אותו (במאמץ סביר, בלי הבטחה: הד חלקי או מוסווה לא תמיד יתפס). \"החזירו\" מחזיר את השליטה והסוכן נשאר מושהה. רק \"אפשרו לסוכן להמשיך\" (עם אישור) נותן לו לקרוא את הדף כפי שהוא עכשיו, למשל חשבון מחובר, ואז הוא קורא אותו מחדש. בזמן שאתם שולטים הדף לא יכול לשלוח בקשות לאתרים ציבוריים. זה פועל כרגע רק בדפי בדיקה מקומיים (localhost); התחברות לאתר אמיתי היא שלב נפרד שתבדקו בעצמכם בחשבון ניסיון."
en = "Take over (beta, off by default, its own switch): jarvis features on browser_takeover. On the Live view card press Take over: the assistant is locked out (a read that was running has its result thrown away), and you click on the picture, type in the box (hidden like a password by default) or press Enter and Tab. What you type goes to the page only: it is not logged and not stored, and it is hidden from the assistant (best effort: strings under 3 characters are not hidden, a partial or disguised echo may get through, and after you let the assistant continue it re-reads the page as it is); if the page echoes it back we try to hide it (best effort, no promise: a partial or disguised echo may get through). Give back returns control and the assistant stays paused. Only Let the assistant continue (it asks first) lets it read the page as it is now, a logged-in account for instance, with a fresh read. While you are in control the page cannot send requests to public sites. This works only on local test pages (localhost) for now; logging in to a real site is a separate step that you test yourself on a throwaway account."

[[steps]]
he = "הפעלת פיילוט אמיתי על דף בדיקה מקומי: בכרטיס התצוגה החיה בעמוד הדפדפן מקלידים כתובת כמו http://localhost:8000/ (דף שרץ במחשב שלכם) ולוחצים \"הפעלת פיילוט בדף בדיקה\". נפתח דפדפן אמיתי ללא תצוגה, שיוצא לרשת רק דרך פרוקסי מקומי: הוא יכול לגשת רק לפורט הזה, לא ללוח הבקרה ולא לשירותים אחרים במחשב, ולא לאתרים ציבוריים בזמן שאתם שולטים. אחר כך לוחצים \"תצוגה חיה\". \"סגירת הפיילוט\" סוגר הכול. אתרים ציבוריים ואתרים אמיתיים עדיין לא נפתחים בשלב הזה."
en = "Start a real pilot on a local test page: on the Live view card of the Browser page type an address like http://localhost:8000/ (a page running on your computer) and press Start a test pilot. A real headless browser opens that reaches the network only through a local proxy: it can reach that one port only, not the dashboard or any other service on this computer, and no public site while you are in control. Then press Live view. Close the pilot closes everything. Public and real sites do not open at this stage."

[[steps]]
he = "תצוגה בטלפון (בטא, כבויה כברירת מחדל, מתג נפרד): jarvis features on browser_phone_view. במחשב, בעמוד המכשירים, מסמנים לטלפון המצומד את ההרשאה \"תצוגת הדפדפן של הפיילוט\". אחרי שהפיילוט הופעל במחשב (בכרטיס התצוגה החיה בעמוד הדפדפן, עם כתובת דף בדיקה מקומי), הלשונית \"דפדפן\" בטלפון מציגה אותו: רואים את הדף כתמונה, ואם גם מתג \"שליטה ידנית\" דלוק אפשר לקחת שליטה: ללחוץ על התמונה, להקליד ולהחזיר. זה עובד רק בקישור המאובטח (https) של הטלפון. הטלפון יכול לעצור את הפיילוט אבל לא להפעיל אותו (טלפון עם ההרשאה הזאת יכול גם לעצור את הסשן שהפעלתם במחשב: זה בטוח, זה רק מסיים את הסשן); מה שמוקלד לא נרשם ומוסתר מהסוכן (במאמץ סביר: מחרוזות קצרות מ-3 תווים לא מוסתרות, ואחרי שמאפשרים לסוכן להמשיך הוא קורא את הדף כפי שהוא)."
en = "Phone view (beta, off by default, its own switch): jarvis features on browser_phone_view. On the computer, on the Devices page, tick the permission Browser pilot view for the paired phone. Once the pilot has been started on the computer (on the Live view card of the Browser page, with a local test page address), the Browser tab on the phone shows it: you see the page as a picture, and if the Take over switch is also on you can take over: tap the picture, type and give back. It works only on the phone's secure (https) link. The phone can stop the pilot but not start it (a phone with this permission can also stop the session you started on the computer: that is fail-safe, it only ends the session); what you type is not logged and is hidden from the assistant (best effort: strings under 3 characters are not hidden, and after you let the assistant continue it re-reads the page as it is)."

[[steps]]
he = "הקלטת וידאו (בטא, כבויה כברירת מחדל, מתג נפרד): jarvis features on browser_recording. צריך פעם אחת את כלי הווידאו הקטן של Playwright: python -m playwright install ffmpeg (בערך מגה אחת, שום דבר אחר במחשב לא משתנה); עד אז המתג יגיד שזה חסר. כשמפעילים פיילוט בדף בדיקה מקומי מסמנים \"להקליט את הסשן הזה\" (בלי הסימון לא מקליטים כלום). ההקלטה היא וידאו WebM בלי קול, שנשמר רק במחשב הזה, בקובץ נפרד לכל קטע רצוף, ואף פעם לא נשלח למודל או החוצה. ברגע שבדף יש שדה סיסמה, כרטיס אשראי או קוד חד-פעמי ההקלטה נעצרת (הקובץ נסגר) וממשיכה לבד, בקובץ חדש, כשהשדה נעלם; אם אי אפשר לבדוק, לא מקליטים. השדות האלה גם מוסתרים בדף מהפריים הראשון. ההקלטה פועלת רק כשהסוכן שולט: כשלקחתם שליטה היא מושהית כל הזמן. מה שלא מכוסה: טקסט שפשוט מוצג בדף (למשל מספר כרטיס בקבלה) מוקלט; shadow root סגור ואזורי contenteditable לא מזוהים; הוידאו ברזולוציה 1024x768 ב-10 פריימים לשנייה ואינו מוגן מפני שינוי; טקסט שהוקלד בזמן שליטה ידנית עלול להיראות בוידאו אחרי שהשליטה חוזרת לסוכן, אם השדה לא זוהה כרגיש; יכול להיות פער קצר בין הופעת שדה לסגירת הקובץ (בינתיים השדה מוסתר בדף). לכן מקליטים רק דפי בדיקה. הקלטות אף פעם לא נכנסות לגיבוי. הקלטות נמחקות אחרי 7 ימים, הכול מוגבל ל-500 מגה, ואפשר למחוק כל הקלטה בכל רגע: jarvis browser recordings, jarvis browser recording-delete ID."
en = "Recording (beta, off by default, its own switch): jarvis features on browser_recording. It needs Playwright's small video helper once: python -m playwright install ffmpeg (about 1 MB, nothing else on the computer changes); until then the switch says so. When you start a pilot on a local test page tick Record this session (without the tick nothing is recorded). The recording is a WebM video with no sound, kept only on this computer, one file per uninterrupted stretch, and it is never sent to a model or anywhere else. The moment the page has a password, card or one-time-code field the recording pauses (the file is closed) and resumes by itself, in a new file, when the field is gone; if the check cannot run, nothing is recorded. Those fields are also blanked on the page from the first frame. Recording runs only while the assistant is driving: it is paused the whole time you have taken over. What is NOT covered: text that is simply shown on a page (a card number on a receipt) is recorded; closed shadow roots and contenteditable areas are not recognised; the video is 1024x768 at 10 frames a second and is not tamper-proof; text typed during a takeover can still be filmed after control returns to the assistant if the field is not matched as sensitive; there can be a short gap between a field appearing and the file closing (the field is blanked on the page meanwhile). So record test pages only. Recordings are never part of a backup. Recordings are deleted after 7 days, the total is capped at 500 MB, and you can delete any recording at any time: jarvis browser recordings, jarvis browser recording-delete ID."

[[problems]]
he = "הלשונית דפדפן לא מופיעה בטלפון או אומרת שאין פיילוט"
en = "The Browser tab does not show on the phone, or says there is no pilot"
fix_he = "הלשונית מופיעה רק עם המתג browser_phone_view, תצוגה חיה דלוקה והרשאת תצוגת הדפדפן לטלפון בעמוד המכשירים. היא אומרת \"אין פיילוט\" עד שמפעילים פיילוט במחשב, ודורשת קישור https; הצפייה נפתחת בטלפון אחד בכל פעם (אי אפשר לדחוק החוצה את הצפייה במחשב)."
fix_en = "The tab shows only with the browser_phone_view switch, the live view on and the Browser pilot view permission for this phone on the Devices page. It says there is no pilot until one is started on the computer, and it needs the https link. The view is open on one device at a time (a phone cannot push the computer's view out)."

[[problems]]
he = "קחו שליטה לא עובד"
en = "Take over does not work"
fix_he = "צריך את המתג הנפרד (jarvis features on browser_takeover), תצוגה חיה פעילה ודף בדיקה מקומי. אם לחצתם על משהו שמוביל לאתר אחר, הסשן נסגר מטעמי בטיחות: התחילו מחדש."
fix_en = "It needs its own switch (jarvis features on browser_takeover), an active live view and a local test page. If you clicked something that leads to another site the session was closed for safety: start again."

[[problems]]
he = "הוא מסרב לכתובת עם אותיות מיוחדות (למשל ß או ς בסוף מילה)"
en = "He refuses an address with special letters (for example a sharp s or a final sigma)"
fix_he = "בשלב הבטא הפיילוט דוחה כתובות שמתורגמות בשמות בינלאומיים בכוונה, כדי שלא יוחלף אתר בדומה לו. השתמשו בצורה הלטינית של הכתובת (xn-- או האיות הרגיל)."
fix_en = "In this beta the pilot deliberately refuses internationalized names that could be swapped for a look-alike site. Use the plain Latin spelling of the address."

[[problems]]
he = "הוא אומר שהפיילוט כבוי"
en = "He says the pilot is off"
fix_he = "הריצו jarvis features on browser_pilot (אחרי הפעלת תכונות בטא)."
fix_en = "Run jarvis features on browser_pilot (after turning on beta features)."

[[problems]]
he = "הוא מסרב לפתוח כתובת"
en = "He refuses to open an address"
fix_he = "רק דפים מקומיים (localhost) וציבוריים נפתחים. כתובות פרטיות ברשת הביתית ודפי חשבון של ספקי AI חסומים."
fix_en = "Only local (localhost) and public pages open. Private home-network addresses and AI account pages are blocked."

[[problems]]
he = "התצוגה החיה לא נפתחת או נסגרה"
en = "The live view will not open, or it closed"
fix_he = "היא פועלת רק במחשב עצמו, רק כשדף בדיקה מקומי (localhost) פתוח בסשן הפיילוט, פגה אחרי 5 דקות, ונסגרת כשהסשן נעצר או עובר לדף אחר. התחילו אותה שוב מעמוד הדפדפן."
fix_en = "It works only on the computer itself, only while a local test page (localhost) is open in the pilot session, expires after 5 minutes, and ends when the session stops or moves to another page. Start it again from the Browser page."

[[problems]]
he = "ההקלטה נעצרה או חסרים קטעים"
en = "The recording stopped or has gaps"
fix_he = "זה בכוונה: ההקלטה נעצרת כשבדף יש שדה סיסמה, כרטיס או קוד, כשהסשן מושהה, או כשעברו 10 דקות לקובץ או 30 דקות בסך הכול. היא ממשיכה בקובץ חדש (part-002 וכן הלאה). אם אין קבצים בכלל: בדקו שהמתג browser_recording דלוק ושסימנתם \"להקליט\" בעת ההפעלה."
fix_en = "That is on purpose: recording pauses while the page has a password, card or code field, while the session is paused, after 10 minutes in one file and after 30 minutes in total. It resumes in a new file (part-002 and so on). If there are no files at all: check that the browser_recording switch is on and that you ticked Record when you started."

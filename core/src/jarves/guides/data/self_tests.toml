what_he = "ג'ארביס בודק את ההתקנה שלו (הגדרות, מסדי נתונים, הרשאות, חיבורים, מדריכים, שפות, פרטיות היומן, דיסק, עדכונים) ומודד כמה הוא מהיר וקל (הפעלה, מעבד, זיכרון, דיסק, לוח הבקרה, כלים, זמן עד קול ראשון). הוא אומר מה איטי או שבור ואם זה החמיר לעומת הפעמים הקודמות."
what_en = "JARVES checks his own installation (config, databases, permissions, connections, guides, languages, log privacy, disk, updates) and measures how fast and light he is (start-up, CPU, memory, disk, dashboard, tools, time to first sound). He says what is slow or broken and whether it got worse than before."
say = [["תבדוק את עצמך מבחינה טכנית", "Run a self-test"], ["תריץ בדיקת מהירות", "Run a speed test"], ["מה כדאי לשפר בביצועים", "What should you improve about your speed?"]]
expect_he = "משפט אחד עם התוצאה, והפרטים בעמוד 'תקינות ומהירות'. הבדיקה העצמית רצה כל יום ב-08:15, בדיקת המהירות פעם בשבוע (ראשון 13:00), אף פעם לא בשעות השקט ולא באמצע שיחה."
expect_en = "One sentence with the result, the details on the Health & speed page. The self-test runs daily at 08:15, the speed test weekly (Sunday 13:00), never in quiet hours and never during a conversation."
test = "feature"
test_he = "הבדיקה רק מוודאת שהרכיב מותקן. הבדיקות עצמן רצות מהעמוד 'תקינות ומהירות' או מ-jarvis selftest."
test_en = "The check only sees that the component is installed. The tests themselves run from the Health & speed page or jarvis selftest."
cost_he = "חינם. הבדיקות מקומיות ורק קוראות. מול OpenAI נשלחת בקשת HEAD אחת בלי מפתח: אין עלות ואין אסימונים."
cost_en = "Free. The tests are local and read-only. Against OpenAI only one HEAD request without a key is sent: no cost, no tokens."
privacy_he = "כברירת מחדל כל המדידות וההמלצות נשארות במחשב. אם בעל החשבון מפעיל במפורש דיווח Performance אוטומטי ב-Dashboard, ג׳ארביס רשאי לשלוח ל-GitHub מדדים מספריים בלבד, בלי תוכן שיחות, קבצים או פרטים אישיים; לכל היותר Issue אחד ביום. אפשר לכבות בכל עת. בדיקה מעמיקה לא מקליטה אלא אם ביקשתם --audio."
privacy_en = "Measurements and recommendations stay on this computer by default. With explicit owner opt-in on the Dashboard, JARVES can file at most one performance-only GitHub issue per day, containing sanitized numeric metric evidence and a diagnostic suggestion, never conversations, local logs or personal details. Disable at any time. Deep tests do not record unless requested with --audio."

[[steps]]
he = "פתחו את העמוד 'תקינות ומהירות' ולחצו 'הרץ עכשיו' ליד הבדיקה העצמית או בדיקת המהירות."
en = "Open the Health & speed page and press Run now next to the self-test or the speed test."
action = "open:#/speed"

[[steps]]
he = "מהטרמינל: בדיקה מהירה, או מעמיקה (הפעלת ליבה זמנית, מודל מילת ההפעלה, התקני שמע)."
en = "From the terminal: the quick test, or the deep one (a temporary Core start, the wake model, audio devices)."
action = "command:jarvis selftest --deep"

[[steps]]
he = "בדיקת מהירות מול התקציב ומול חמש ההרצות האחרונות. החמרה של יותר מ-20 אחוז מסומנת באזהרה."
en = "The speed test against the budget and the last five runs. Getting more than 20 percent worse is a warning."
action = "command:jarvis speedtest"

[[steps]]
he = "ראו בעמוד 'תקינות ומהירות' את המלצות הביצועים: נדרשות לפחות שלוש מדידות דומות והוכחה להאטה חוזרת. ג'ארביס גם יודע להסביר אותן בקול."
en = "On Health & speed, see measured recommendations: at least three comparable runs and repeated slowdowns are required. JARVES can explain them by voice."
action = "open:#/speed"

[[steps]]
he = "בטרמינל: הציגו המלצות עם jarvis performance; הפעילו דיווח אוטומטי פעם אחת עם jarvis performance --auto-github on (או כבו עם off)."
en = "From the terminal: jarvis performance lists recommendations; one-time opt-in via jarvis performance --auto-github on (disable with off)."
action = "command:jarvis performance"

[[steps]]
he = "אם ברצונכם שג'ארביס יפתח Issues אוטומטיים, לחצו 'הפעל דיווח אוטומטי ל-GitHub', אשרו את ההסבר ודאגו לחיבור GitHub (token או gh auth login). אפשר לכבות באותו מקום; בלי הרשאה ממשיכים במעקב מקומי בלבד."
en = "To allow autonomous GitHub performance issues, click Enable GitHub auto reporting, confirm once, and ensure the local GitHub token/gh CLI is configured. You can turn it off here; without a token findings remain local."
action = "open:#/speed"

[[steps]]
he = "זמני תגובה קולית לפי שלב: jarvis performance --voice-stages מראה חציון, p95, צוואר הבקבוק ורמת ביטחון מתוך היומן המקומי. שלבים שהמערכת לא מודדת מסומנים כלא זמינים, ואישור על מכשיר אמיתי נשאר לבדיקה שלכם."
en = "Voice reply time by stage: jarvis performance --voice-stages shows median, p95, the bottleneck and a confidence level from the local log. Stages the system does not time are marked unavailable, and real-device acceptance stays your own test."
action = "command:jarvis performance --voice-stages"

[[problems]]
he = "הבדיקה המתוזמנת לא רצה"
en = "The scheduled test did not run"
fix_he = "בשעות השקט (22:00-07:00) ובזמן שיחה קולית היא מדולגת, נרשמת ביומן ולא נדחית להמשך. אפשר להריץ ידנית בכל שעה."
fix_en = "In quiet hours (22:00-07:00) and during a voice conversation it is skipped, logged and not queued. You can run it by hand at any time."

[[problems]]
he = "ערכים חסרים בבדיקת המהירות"
en = "Some speed values are missing"

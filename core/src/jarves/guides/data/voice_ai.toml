privacy_en = "The key is kept only on your computer in a private file (secrets.env), never in the project or the logs."

[[steps]]
he = "פתחו את platform.openai.com/api-keys, לחצו \"Create new secret key\" והעתיקו אותו."
en = "Open platform.openai.com/api-keys, press \"Create new secret key\" and copy it."

[[steps]]
he = "בטרמינל הקלידו jarvis key והדביקו את המפתח (הוא מוסתר בזמן ההדבקה)."
en = "In a terminal type jarvis key and paste the key (it stays hidden while you paste)."
action = "command:jarvis key"
check = "probe:ai"

[[steps]]
he = "הפעילו מחדש את ג'ארביס: jarvis stop ואז jarvis."
en = "Restart JARVES: jarvis stop, then jarvis."
action = "command:jarvis stop"

[[steps]]
he = "לחצו \"בדוק עכשיו\"."
en = "Press Test now."
action = "test"

[[problems]]
he = "הוא אומר שאין מפתח"

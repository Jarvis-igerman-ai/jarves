<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<title>JARVES</title>
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="icon" href="/m/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/m/icon-192.png">
<link rel="stylesheet" href="/m/style.css">
<link rel="stylesheet" href="/m/chatview.css">
<link rel="stylesheet" href="/m/m_theme.css">
<script src="/m/chatview.js" defer></script>
<script src="/m/indicator.js" defer></script>
<script src="/m/plans.js" defer></script>
<script src="/m/prefs.js" defer></script>
<script src="/m/drive.js" defer></script>
<script src="/m/hands_free.js" defer></script>
<script src="/m/m_shell.js" defer></script>
<script src="/m/app.js" defer></script>
</head>
<body>
<header class="bar">
  <button type="button" id="menuBtn" class="icon-btn app-only" aria-controls="drawer" aria-expanded="false" aria-label="Menu"></button>
  <div class="bar-title"><strong class="brand">JARVES</strong><span id="conn" class="pill" role="status" aria-live="polite"></span></div>
  <button type="button" id="newChat" class="icon-btn app-only" aria-label="New chat"></button>
  <button type="button" id="lang" class="ghost" aria-label="עברית" lang="he">עב</button>
</header>

<div id="banner" class="banner" role="alert" hidden></div>
<div id="drawer" class="drawer" hidden>
  <div id="drawerScrim" class="scrim"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <strong id="drawerTitle" class="brand">JARVES</strong>
      <button type="button" id="drawerClose" class="icon-btn" aria-label="Close the menu"></button>
    </div>
    <button type="button" id="drawerNew" class="drawer-new"></button>
    <nav class="tabs" role="tablist" aria-label="Pages" aria-orientation="vertical">
      <button type="button" role="tab" id="tabbtn-chat" data-tab="chat" aria-selected="true"><span data-t="tab_chat">Chat</span></button>
      <button type="button" role="tab" id="tabbtn-approvals" data-tab="approvals" aria-selected="false"><span data-t="tab_approvals">Approvals</span><span id="apprCount" class="badge" hidden></span></button>
      <button type="button" role="tab" id="tabbtn-plans" data-tab="plans" aria-selected="false" hidden><span data-t="tab_plans">Plans</span></button>
      <button type="button" role="tab" id="tabbtn-prefs" data-tab="prefs" aria-selected="false" hidden><span data-t="tab_prefs">Learned</span></button>
      <button type="button" role="tab" id="tabbtn-drive" data-tab="drive" aria-selected="false" hidden><span data-t="tab_drive">Drive</span></button>
      <button type="button" role="tab" id="tabbtn-voice" data-tab="voice" aria-selected="false"><span data-t="tab_voice">Voice</span></button>
      <button type="button" role="tab" id="tabbtn-health" data-tab="health" aria-selected="false"><span data-t="tab_health">Health &amp; speed</span></button>
      <button type="button" role="tab" id="tabbtn-home" data-tab="home" aria-selected="false"><span data-t="tab_home">This phone</span></button>
    </nav>
    <h2 id="histHead" class="drawer-sec">Recent conversations</h2>
    <button type="button" id="histLoad" class="drawer-new"></button>
    <ul id="histList" class="hist"></ul>
  </aside>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>


<main id="pairView" hidden>
  <h1 data-t="pair_title">Pair this phone</h1>
  <p data-t="pair_help">On the computer open the JARVES dashboard, go to Phone and press Pair a phone. Scan the QR code, or type the 8-digit code here.</p>
  <form id="pairForm" class="card">
    <label><span data-t="code">Pairing code</span>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" required></label>
    <label><span data-t="name">Name for this phone</span>
      <input id="name" maxlength="40" value="phone"></label>
    <button type="submit" class="primary" data-t="pair">Pair</button>
    <p id="pairMsg" class="muted" aria-live="polite"></p>
  </form>
  <p class="muted" data-t="pair_net">Works on your home network only. Nothing here is reachable from the internet.</p>
</main>

<main id="appView" hidden>
  <div id="audioBar" class="audio" role="status" aria-live="polite" hidden></div>
  <div id="noticeBox" class="notices"></div>

  <section id="tab-home" class="panel" hidden>
    <ul id="homeList" class="list"></ul>
    <p class="muted" id="meInfo"></p>
    <button type="button" id="unpair" data-t="unpair">Un-pair this phone</button>
  </section>

  <section id="tab-chat" class="panel">
    <div id="chatRoot"></div>
  </section>

  <section id="tab-voice" class="panel" hidden>
    <p id="voiceNote" class="muted"></p>
    <button type="button" id="ptt" class="ptt" data-t="hold">Hold to talk</button>
    <p id="voiceOut" class="log" aria-live="polite"></p>
  </section>

  <section id="tab-approvals" class="panel" hidden>
    <p id="apprNote" class="muted"></p>
    <ul id="apprList" class="list"></ul>
  </section>

  <section id="tab-plans" class="panel" hidden>
    <div id="plansRoot"></div>
  </section>

  <section id="tab-prefs" class="panel" hidden>
    <div id="prefsRoot"></div>
  </section>

  <section id="tab-drive" class="panel" hidden>
    <div id="hfRoot"></div>
    <div id="driveRoot"></div>
  </section>

  <section id="tab-health" class="panel" hidden>
    <ul id="statusList" class="list"></ul>
    <ul id="testList" class="list"></ul>
    <h2 data-t="goals" id="goalsHead" hidden>Goals</h2>
    <ul id="goalList" class="list" hidden></ul>
    <div id="sigBox" class="row" hidden>
      <button type="button" id="sigSnooze" data-t="snooze">Snooze notes 1 h</button>
      <button type="button" id="sigStop" data-t="stop_notes">Stop notes</button>
    </div>
    <div id="noteLog" aria-live="polite"></div>
    <p id="sigNote" class="muted" aria-live="polite"></p>
  </section>
</main>
</body>
</html>

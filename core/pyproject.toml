[project]
name = "jarves"
version = "4.0.1"
description = "JARVES assistant Core: state, Godot face link, DevicePort, memory, Skills, voice and music"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.24.0,<0.25",   # OpenAI Agents SDK: text agent, RealtimeAgent, hosted web search
    "websockets>=15,<18",           # Godot <-> Core localhost link (pinned below 17 by openai-agents)
    "pydantic>=2.12,<3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",           # Sign in with ChatGPT: verify the OpenAI ID token (RS256, JWKS)
    "cryptography>=46",              # update-signature verification (ed25519) and TLS helpers: declared, not only via pyjwt[crypto]
    "numpy>=2",
    "tzdata>=2025.2",                # IANA time zones for zoneinfo (Windows has none built in): scheduler DST
]

[project.optional-dependencies]
voice = [
    "sounddevice>=0.5",                 # PortAudio mic/speaker (Windows + Linux)
    "faster-whisper>=1.2",              # offline STT (Hebrew via ivrit-ai models)
    "pyopen-wakeword>=1.1,<2",          # offline "hey jarvis" wake word (openWakeWord models + bundled TFLite C lib)
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
]

camera = [
    # USB webcam capture + local face detection/recognition models (YuNet/SFace). Pi 5: aarch64 wheels; the Pi
    # camera itself uses the apt package python3-picamera2 (libcamera), not pip. Checked 2026-10-19 (PyPI).
    "opencv-python-headless>=4.12",
]
browser = [
    # Browser Skill: Playwright drives the installed Edge/Chrome on Windows (no download) or Chromium on the Pi
    # (manylinux aarch64 wheel; `playwright install chromium` or apt chromium). 1.64.0 checked 2026-10-20 (PyPI).
    "playwright>=1.63,<2",
]
tray = [
    "pillow>=11",
    "pystray>=0.19.5,<0.20",
]

[project.scripts]
jarves = "jarves.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "pyyaml>=6.0.2"]   # pyyaml: test_ci_workflows parses .github/workflows

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# core/ on sys.path for every test file, so `from tools import ...` never depends on which test file ran first in the
# shard (ModuleNotFoundError: tools on a shard where no earlier file had put core/ on sys.path; PR #150 run 40119205483).
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.9.4,<0.14.0"]
build-backend = "uv_build"

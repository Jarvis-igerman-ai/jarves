# JARVES performance budgets (SW-V4 package M). Read by tools/perf_gate.py; explained in docs/reviews/SWV4_PERF_BUDGETS.md.
#
# Each metric: the measured baseline plus two ceilings. `owner_max` is strict (the owner's PC, checked by hand and by
# the O monitor); `ci_max` is loose (a shared CI runner is 2-5x noisier). The gate compares the MEDIAN of the runs
# with `<= max`. Raising a ceiling needs a reason in [[history]] (see "Updating budgets" in the budgets doc).
#
# `source`: bench = tools/bench_startup.py (real background Core), inproc = measured in the gate process,
#           log = per-start stage timings from a real jarves.log (owner PC only, `perf_gate.py --log`).
[meta]
baseline_commit = "v3-p03-perf (swv2-integrate e95eb6f) + V4 M gate"
baseline_machine = "owner PC: AMD Ryzen 3 5300U, 7.5 GB RAM, Windows 11, Python 3.12.12"
scenario = "combined"
default_runs = 3
default_idle_s = 60
ci_runs = 3
ci_idle_s = 60

[metrics.private_mb]
baseline = 92.7
unit = "MB"
source = "bench"
owner_max = 150
ci_max = 260
note = "background Core private commit, combined scenario (cloud scenario baseline 131.4)"

[metrics.steady_rss_mb]
baseline = 117.0
unit = "MB"
source = "bench"
owner_max = 175
ci_max = 300
note = "steady working set"

[metrics.threads]
baseline = 11
unit = "count"
source = "bench"
owner_max = 14
ci_max = 22
note = "idle threads"

[metrics.child_processes]
baseline = 0
unit = "count"
source = "bench"
owner_max = 0
ci_max = 0
note = "no child process in background mode"

[metrics.idle_cpu_pct]

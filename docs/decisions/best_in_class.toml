# Best-in-class registry (JAR-233): the models, voice and agent libraries JARVES ships today.
# One row per stage. `recorded` must match the code (`code` file contains `code_match`).
# The monthly scout reads this file:
#   python core/tools/best_in_class_scout.py            # offline: drift + overdue rows
#   python core/tools/best_in_class_scout.py --online   # also fetches each `source` (official docs / PyPI)
# The scout only reports. A newer option is a candidate, never an automatic switch:
# a change goes through a normal PR with tests, and then `checked` is updated here.
#
# kind = "openai-model": `source` is the official models page; `family` is a regex with ONE capture group
#        holding the version, newer = a listed id in the same family with a higher version.
# kind = "pypi":         `package` on pypi.org; newer = latest release above `recorded` (the pin floor);
#        `pin_below` (optional) flags a latest release outside the current pin.
# kind = "manual":       no machine-readable official source; only the age of `checked` is reported.

[meta]
max_age_days = 31
deprecations = "https://developers.openai.com/api/docs/deprecations"

[[entry]]
id = "text_model"
stage = "model"
kind = "openai-model"
recorded = "gpt-6-luna"
code = "core/src/jarves/config.py"
code_match = 'text_model: str = "gpt-6-luna"'
family = '^gpt-(\d+(?:\.\d+)?)-luna$'
source = "https://developers.openai.com/api/docs/models"
checked = "2026-11-16"

